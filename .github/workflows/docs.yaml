name: Documentation

on:
  pull_request:
    paths:
      - docs/**
      - r/**
      - python/**
      - LICENSE
      - pyproject.toml
      - great-docs.yml
      - tests/website.py
      - scripts/preview-site
      - scripts/render-site
      - tests/snapshots/cli/interface/test_help/**
      - tests/snapshots/cli/interface/test_config_init/dry_run_previews_the_created_contents.yaml
      - .github/workflows/docs.yaml
      - scripts/configure-ci-r.R
  push:
    branches: [main]
    paths:
      - docs/**
      - r/**
      - python/**
      - LICENSE
      - pyproject.toml
      - great-docs.yml
      - tests/website.py
      - scripts/preview-site
      - scripts/render-site
      - tests/snapshots/cli/interface/test_help/**
      - tests/snapshots/cli/interface/test_config_init/dry_run_previews_the_created_contents.yaml
      - .github/workflows/docs.yaml
      - scripts/configure-ci-r.R
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install Python documentation tools
        run: python -m pip install -r docs/requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false
      - name: Configure binary R repositories
        run: sudo "$(command -v Rscript)" --vanilla scripts/configure-ci-r.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          upgrade: "FALSE"
          cache-version: binary-repositories-v1
          packages: |
            deps::.
            any::pkgdown
      - name: Check website pages and links
        run: python tests/website.py
      - name: Render website
        run: scripts/render-site
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/_site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
