name: Release

# Build native macOS, Linux, and Windows x64 wheels and publish them to PyPI.
#
# Releases are tag-driven. A manual workflow run builds artifacts for
# inspection but does not publish.
#
# If publication partially fails, rerun the failed job while the original
# artifacts are retained. Do not rebuild an already partially uploaded version.

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: "0.13.1"

jobs:
  wheels:
    name: pypi-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Cold ARM R preparation can take 30 minutes after native compilation.
    # Leave the smoke test its full, separately bounded startup allowance.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select weekly cache epoch
        id: cache-epoch
        run: printf 'value=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Read private sandbox source pin
        id: sandbox-pin
        run: scripts/stage-sandbox-runner --github-output "$GITHUB_OUTPUT"

      - name: Check out private sandbox source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.sandbox-pin.outputs.repository }}
          ref: ${{ steps.sandbox-pin.outputs.commit }}
          path: .sandbox-runner-source

      # Chrome is unused here; its repository can block apt with inconsistent metadata.
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -qF 'dl.google.com/linux/chrome' {} \; \
            -print -delete

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: false

      - name: Configure binary R repositories
        run: sudo "$(command -v Rscript)" --vanilla scripts/configure-ci-r.R

      # The default R environment may build data.table from source. Its NLS code
      # needs libintl.h in R's /opt/R/<arch> build prefix.
      - name: Install gettext for R source packages
        if: runner.os == 'macOS'
        run: |
          sudo Rscript --vanilla -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext"); stopifnot(file.exists(file.path("/opt/R", Sys.info()[["machine"]], "include", "libintl.h")))'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-local-path: ${{ runner.temp }}/mcp-console-cache
          cache-suffix: release-v1-${{ steps.cache-epoch.outputs.value }}

      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkgconf libcurl4-openssl-dev libcap-dev libssl-dev binutils

      - name: Stage private sandbox runner
        run: >-
          scripts/stage-sandbox-runner
          .sandbox-runner-source
          --target "${{ matrix.target }}"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          rust-toolchain: stable
          target: ${{ matrix.target }}
          # Use native runners while retaining PyPI-compatible Linux wheel tags.
          container: off
          args: --release --locked --compatibility pypi --out dist

      - name: Inspect Linux bundle ABI and wheel tags
        if: runner.os == 'Linux'
        run: |
          mkdir -p linux-compatibility
          python3 scripts/release.py inspect-wheel dist/*.whl \
            --target "${{ matrix.target }}" --release \
            --report linux-compatibility/builder-abi.json

      # Cold ARM64 R source builds are preparation, not worker startup.
      # Match the full runtime request and R_HOME in ir's resolution-cache key.
      - name: Prepare Linux R smoke environment
        if: runner.os == 'Linux'
        env:
          GITHUB_PAT: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/mcp-console-xdg-cache
          IR_CACHE_DIR: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies/ir
          IR_LIBRARY_ROOT: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies/ir/libraries
          R_USER_CACHE_DIR: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies
          RENV_PATHS_ROOT: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies/renv
          PKG_CACHE_DIR: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies/R/pkgcache
          R_PKG_CACHE_DIR: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-xdg-cache/mcp-console/dependencies/uv/cache
          LIBARROW_BINARY: "true"
          MAKEFLAGS: -j1
          R_MAKEVARS_USER: ${{ runner.temp }}/preparation.Makevars
        run: |
          sudo apt-get install -y --no-install-recommends \
            r-base-dev libxml2-dev libcairo2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libjpeg-dev libpng-dev libtiff-dev \
            libuv1-dev libwebp-dev
          printf '%s\n' 'CXX17FLAGS=-O0 -g0' > "$R_MAKEVARS_USER"
          uv venv "$RUNNER_TEMP/cmake"
          uv pip install --python "$RUNNER_TEMP/cmake/bin/python" cmake
          export PATH="$RUNNER_TEMP/cmake/bin:$PATH"
          R_HOME="$(R RHOME)"
          export R_HOME
          uv tool run --isolated --python 3.14 --from r-lib-ir ir run \
            --rscript "$R_HOME/bin/Rscript" \
            --with tidyverse --with dplyr --with dbplyr --with reticulate --with DBI \
            --with duckdb --with arrow --with nanoarrow --with yyjsonr --with ggplot2 \
            --with jsonlite --with pillar --with tibble --with utf8 \
            --isolated --vanilla -e 'sessionInfo()'
          uv cache clean cmake
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Smoke-test wheel
        env:
          GITHUB_PAT: ${{ github.token }}
          UV_TOOL_DIR: ${{ runner.temp }}/mcp-console-tool
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/mcp-console-bin
          UV_CACHE_DIR: ${{ runner.temp }}/mcp-console-cache
          UV_PYTHON_DOWNLOADS: automatic
          UV_NO_CONFIG: "1"
        run: |
          python3 scripts/release.py \
            smoke-wheel \
            dist/*.whl \
            target/${{ matrix.target }}/release/mcp-console \
            --target "${{ matrix.target }}"
          python3 scripts/release.py \
            smoke-wheel \
            dist/*.whl \
            target/${{ matrix.target }}/release/mcp-console \
            --target "${{ matrix.target }}" \
            --without-r
          python3 tests/sandbox_installation.py "$UV_TOOL_BIN_DIR/mcp-console"

      - name: Report Linux preparation failure
        if: failure() && runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dependencies = Path(os.environ["RUNNER_TEMP"]) / "mcp-console-xdg-cache/mcp-console/dependencies"
          for library in sorted((dependencies / "ir/libraries").glob("*")):
              if library.is_dir():
                  print(json.dumps({
                      "library": str(library),
                      "incomplete": (library / ".ir-incomplete").exists(),
                      "entries": sorted(entry.name for entry in library.iterdir()),
                  }))
          print(json.dumps({
              "python_installations": sorted(path.name for path in (dependencies / "uv/python").glob("*")),
          }))
          PY

      - name: Upload Linux compatibility evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-compatibility-${{ matrix.target }}
          path: linux-compatibility
          if-no-files-found: warn

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  windows-wheel:
    name: pypi-x86_64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MCP_CONSOLE_SANDBOX_SOURCE: ${{ github.workspace }}/.sandbox-runner-source
      UV_NO_CONFIG: "1"
      LANGUAGE: en
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Prepare native build tools and read sandbox pin
        id: sandbox-pin
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/stage-sandbox-runner --github-output "$env:GITHUB_OUTPUT"

      - name: Set release installation directories
        run: |
          "UV_TOOL_DIR=$env:RUNNER_TEMP/mcp-console-tools" >> $env:GITHUB_ENV
          "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP/mcp-console-bin" >> $env:GITHUB_ENV
          "UV_CACHE_DIR=$env:RUNNER_TEMP/mcp-console-cache" >> $env:GITHUB_ENV

      - name: Check out private sandbox source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.sandbox-pin.outputs.repository }}
          ref: ${{ steps.sandbox-pin.outputs.commit }}
          path: .sandbox-runner-source
          persist-credentials: false

      # Use the PEP 517 backend: it relocates the native command and adds the
      # environment-bound Windows launcher that direct Maturin builds omit.
      - name: Build Windows wheel
        run: scripts/with-checkout.cmd uv build --wheel --out-dir dist

      - name: Install wheel through its public tool command
        run: |
          $wheel = (Get-Item dist/*-win_amd64.whl).FullName
          uv tool install --python (Get-Command python).Source $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: false

      - name: Configure binary R repositories
        run: Rscript --vanilla scripts/configure-ci-r.R

      - name: Install native smoke-test dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r
          upgrade: "FALSE"
          cache-version: binary-repositories-v1
          dependencies: "NA"
          packages: |
            any::reticulate
            any::jsonlite

      - name: Prepare Python and select the R runtime
        run: |
          $ciPython = (Get-Command python).Source
          uv pip install --python $ciPython numpy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rHome = & (Get-Command Rscript.exe).Source --vanilla -e 'cat(R.home())'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "R_HOME=$rHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Accept installed Windows wheel
        run: python tests/windows_install.py --installed-binary "$env:UV_TOOL_BIN_DIR/mcp-console.exe"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-x86_64-pc-windows-msvc
          path: dist/*-win_amd64.whl
          if-no-files-found: error

  linux-floor:
    name: linux-floor-${{ matrix.target }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    # Cold language preparation gets its own job budget. Consume the exact
    # smoke-tested wheel so a failed floor check never requires rebuilding it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download smoke-tested wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-${{ matrix.target }}
          path: dist

      - name: Validate Linux wheel in clean floor runtimes
        shell: bash
        run: |
          mkdir -p linux-compatibility
          python3 scripts/check-linux-wheel dist/*.whl \
            --target "${{ matrix.target }}" \
            --evidence linux-compatibility \
            2>&1 | tee linux-compatibility/runtime.log

      - name: Upload Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runtime-${{ matrix.target }}
          path: linux-compatibility
          if-no-files-found: warn

  publish-pypi:
    name: publish PyPI
    needs: [wheels, windows-wheel, linux-floor]

    # Manual dispatch is build-only. Only tag-triggered runs may publish.
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

    runs-on: ubuntu-22.04
    environment: pypi

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py validate-publish

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Verify wheel set
        run: python3 scripts/release.py verify-wheel-set dist

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish wheels to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple \
            dist/*.whl

  verify-pypi:
    name: public-pypi-${{ matrix.target }}
    needs: publish-pypi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Linux runtime and inspection dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap2 libgcc-s1 libstdc++6 binutils

      - name: Download published artifacts for hash comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Wait for public JSON and package-index visibility
        run: python3 scripts/release.py wait-pypi dist --report publication.json

      - name: Verify fresh public-index installations and Python-only MCP
        env:
          UV_NO_CONFIG: "1"
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import sys
          import tempfile

          sys.path.insert(0, str(Path("scripts").resolve()))
          from release import command_output, package_version, run_command, smoke_mcp

          version = package_version()
          publication = json.loads(Path("publication.json").read_text())
          assert publication["version"] == version, publication

          options = ["--no-cache", "--no-sources", "--default-index", "https://pypi.org/simple"]
          with tempfile.TemporaryDirectory(prefix="public-pypi-") as temporary:
              root = Path(temporary)
              env = dict(
                  os.environ,
                  UV_CACHE_DIR=str(root / "cache"),
                  UV_TOOL_DIR=str(root / "tools"),
                  UV_TOOL_BIN_DIR=str(root / "bin"),
              )
              expected = f"mcp-console {version}"
              assert (
                  command_output(
                      ["uvx", "--isolated", *options, f"mcp-console@{version}", "--version"], env
                  )
                  == expected
              )
              run_command(["uv", "tool", "install", *options, f"mcp-console=={version}"], env)
              installed = root / "bin/mcp-console"
              assert command_output([str(installed), "--version"], env) == expected
              run_command([str(installed), "--help"], env)
              commands = root / "commands"
              commands.mkdir()
              (commands / "uv").symlink_to(Path(shutil.which("uv")).resolve())
              (commands / "python3").symlink_to(Path(sys.executable).resolve())
              mcp_env = dict(env, PATH=str(commands), MCP_CONSOLE_HOME=str(root / "console"))
              for name in (
                  "R_HOME",
                  "R_LIBS",
                  "R_LIBS_USER",
                  "RETICULATE_PYTHON",
                  "RETICULATE_UV",
              ):
                  mcp_env.pop(name, None)
              workspace = root / "workspace"
              workspace.mkdir()
              run_command(
                  [str(installed), "sandbox", "--", "/usr/bin/true"],
                  dict(mcp_env, PATH=str(workspace)),
                  cwd=workspace,
              )
              smoke_mcp(installed, version, mcp_env, workspace, 1200, 30, r_available=False)
              latest_env = dict(
                  env,
                  UV_CACHE_DIR=str(root / "latest-cache"),
                  UV_TOOL_DIR=str(root / "latest-tools"),
                  UV_TOOL_BIN_DIR=str(root / "latest-bin"),
              )
              assert (
                  command_output(
                      ["uvx", "--isolated", *options, "mcp-console", "--version"], latest_env
                  )
                  == expected
              )
              run_command(["uv", "tool", "install", *options, "mcp-console"], latest_env)
              assert (
                  command_output([str(root / "latest-bin/mcp-console"), "--version"], latest_env)
                  == expected
              )
          print(
              json.dumps(
                  {
                      "version": version,
                      "wheels": publication["wheels"],
                      "pinned_install": True,
                      "latest_install": True,
                      "python_only_mcp": True,
                  }
              )
          )
          PY

  verify-pypi-windows:
    name: public-pypi-x86_64-pc-windows-msvc
    needs: publish-pypi
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_NO_CONFIG: "1"
      LANGUAGE: en
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set public-index installation directories
        run: |
          "UV_TOOL_DIR=$env:RUNNER_TEMP/public-mcp-console/tools" >> $env:GITHUB_ENV
          "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP/public-mcp-console/bin" >> $env:GITHUB_ENV
          "UV_CACHE_DIR=$env:RUNNER_TEMP/public-mcp-console/cache" >> $env:GITHUB_ENV

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: false

      - name: Configure binary R repositories
        run: Rscript --vanilla scripts/configure-ci-r.R

      - name: Install native smoke-test dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r
          upgrade: "FALSE"
          cache-version: binary-repositories-v1
          dependencies: "NA"
          packages: |
            any::reticulate
            any::jsonlite

      - name: Download published artifacts for hash comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Wait for public JSON and package-index visibility
        run: python scripts/release.py wait-pypi dist --report publication.json

      - name: Install the pinned release from the public index
        run: |
          $version = (Get-Content publication.json | ConvertFrom-Json).version
          $actual = uvx --isolated --no-cache --no-sources --default-index https://pypi.org/simple "mcp-console@$version" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($actual -ne "mcp-console $version") { throw "Unexpected pinned uvx version: $actual" }
          uv tool install --python (Get-Command python).Source --no-cache --no-sources --default-index https://pypi.org/simple "mcp-console==$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Prepare Python and select the R runtime
        run: |
          uv pip install --python (Get-Command python).Source numpy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $rHome = & (Get-Command Rscript.exe).Source --vanilla -e 'cat(R.home())'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "R_HOME=$rHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Accept pinned public-index installation
        run: python tests/windows_install.py --installed-binary "$env:UV_TOOL_BIN_DIR/mcp-console.exe"

      - name: Verify a fresh unqualified public-index installation
        run: |
          $env:UV_CACHE_DIR = "$env:RUNNER_TEMP/public-mcp-console/latest-cache"
          $env:UV_TOOL_DIR = "$env:RUNNER_TEMP/public-mcp-console/latest-tools"
          $env:UV_TOOL_BIN_DIR = "$env:RUNNER_TEMP/public-mcp-console/latest-bin"
          $version = (Get-Content publication.json | ConvertFrom-Json).version
          $actual = uvx --isolated --no-cache --no-sources --default-index https://pypi.org/simple mcp-console --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($actual -ne "mcp-console $version") { throw "Unexpected latest uvx version: $actual" }
          uv tool install --python (Get-Command python).Source --no-cache --no-sources --default-index https://pypi.org/simple mcp-console
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_install.py --installed-binary "$env:UV_TOOL_BIN_DIR/mcp-console.exe"
