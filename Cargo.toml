[package]
name = "mcp-console"
version = "0.0.6+dev"
edition = "2024"
rust-version = "1.99"
description = "Persistent R, Python, and SQL sessions for MCP clients"
repository = "https://github.com/posit-dev/mcp-console"
license = "MIT"
publish = false

[[bin]]
name = "mcp-console"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ctor = "1.0.13"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
harp = { git = "https://github.com/t-kalinowski/ark", rev = "2411df0d1f75d53f88d4bb39bd41ee9c26222757" }
html2text = "0.17.3"
libc = "0.2.190"
libloading = "0.9.0"
libr = { git = "https://github.com/t-kalinowski/ark", rev = "2411df0d1f75d53f88d4bb39bd41ee9c26222757" }
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "macros", "server", "transport-io"] }
saphyr = { git = "https://github.com/t-kalinowski/saphyr", rev = "bd5bf9624347b24fa77cc2ef4a67ab2ef5c2cf8b", default-features = false }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "net", "process", "rt", "sync", "time"] }
toml_edit = "0.25.17"
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(unix)'.dependencies]
errno = "0.3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1.8.0"
embed-resource = "3.0.12"
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
strip = true
