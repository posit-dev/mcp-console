[package]
name = "mcp-console"
version = "0.0.5"
edition = "2024"
rust-version = "1.95"
description = "Persistent R, Python, and SQL sessions for MCP clients"
repository = "https://github.com/t-kalinowski/mcp-console"
license = "MIT"
publish = false

[[bin]]
name = "mcp-console"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["now"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
ctor = "1.0.7"
harp = { git = "https://github.com/t-kalinowski/ark", rev = "37d3db0074e01a184d67b7a85faf9a3492836422" }
html2text = "0.17.1"
libc = "0.2"
libloading = "0.9"
libr = { git = "https://github.com/t-kalinowski/ark", rev = "37d3db0074e01a184d67b7a85faf9a3492836422" }
pep508_rs = "0.9.2"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
saphyr = { git = "https://github.com/t-kalinowski/saphyr", rev = "bd5bf9624347b24fa77cc2ef4a67ab2ef5c2cf8b", default-features = false }
rust-embed = { version = "8.11", features = ["debug-embed"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = { version = "0.3.18", default-features = false }

[target.'cfg(unix)'.dependencies]
errno = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1"
embed-resource = "3"
serde_json = "1"
sha2 = "0.11"

[profile.release]
strip = true
