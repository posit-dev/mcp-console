project:
  type: website
  post-render:
    - _pkgdown.R
    - _python.py
  render:
    - index.qmd
    - getting-started.qmd
    - cli-help.qmd
    - README.md
    - "*.md"
    - benchmarks/*.md
    - "!templates/"

website:
  title: MCP Console
  description: >-
    An interactive, sandboxed workspace for AI agents working with data in
    R, Python, and SQL.
  site-url: https://t-kalinowski.github.io/mcp-console/
  repo-url: https://github.com/t-kalinowski/mcp-console
  repo-subdir: docs
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Get started
      - href: README.md
        text: User guides
      - href: CLIENTS.md
        text: Client integration
      - href: DEVELOPMENT.md
        text: Development
    right:
      - text: Packages
        menu:
        - href: python/index.html
          text: Python package
        - href: r/index.html
          text: R package
      - icon: github
        href: https://github.com/t-kalinowski/mcp-console
        aria-label: GitHub repository
  sidebar:
    - id: guides
      title: User guides
      style: docked
      collapse-level: 1
      contents:
      - href: README.md
        text: Overview
      - getting-started.qmd
      - section: Work with Console
        contents:
        - BUILTIN_RUNTIME.md
        - REQUIREMENTS.md
        - RECORDING.md
      - section: Configure Console
        contents:
        - CONFIGURATION.md
        - CONFIGURATION_REFERENCE.md
        - SANDBOX.md
        - SANDBOX_CONFIGURATION.md
        - RESOLVER.md
        - ENVIRONMENT.md
        - CLI.md
        - cli-help.qmd
      - section: Platforms and installation
        contents:
        - WINDOWS.md
        - LINUX_COMPATIBILITY.md
        - BUILD_FROM_SOURCE.md
      - GLOSSARY.md
    - id: clients
      title: Client integration
      style: docked
      collapse-level: 1
      contents:
      - CLIENTS.md
      - PYTHON.md
      - href: r/index.html
        text: R and ellmer
      - section: MCP reference
        contents:
        - API.md
        - SEND_OPERATIONS.md
        - REQUIREMENTS_API.md
        - TOOL_CONFIGURATION.md
        - RUNTIME_REFERENCE.md
      - href: python/reference/index.html
        text: Python API
      - href: r/reference/index.html
        text: R API
    - id: development
      title: Development
      style: docked
      collapse-level: 1
      contents:
      - DEVELOPMENT.md
      - ARCHITECTURE.md
      - RELAY_PROTOCOL.md
      - WORKER_PROTOCOL.md
      - TOOL_DESCRIPTIONS.md
      - WINDOWS_DEVELOPMENT.md
      - TODO.md
      - section: Evidence and release
        contents:
        - RESOLVER_RELEASE_AUDIT.md
        - benchmarks/transcript-concurrency.md
        - href: https://github.com/t-kalinowski/mcp-console/blob/main/RELEASE.md
          text: Release procedure
  page-footer:
    left: MCP Console · MIT License
    right:
      - text: Source
        href: https://github.com/t-kalinowski/mcp-console

filters:
  - _filters/website.lua

execute:
  enabled: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, dark.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
