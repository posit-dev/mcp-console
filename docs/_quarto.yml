project:
  type: website
  post-render:
    - _pkgdown.R
    - _python.py
  render:
    - index.qmd
    - getting-started.qmd
    - cli-help.qmd
    - README.md
    - "*.md"
    - benchmarks/*.md
    - "!templates/"

website:
  title: MCP Console
  description: >-
    An interactive, sandboxed workspace for AI agents working with data in
    R, Python, and SQL.
  site-url: https://t-kalinowski.github.io/mcp-console/
  repo-url: https://github.com/t-kalinowski/mcp-console
  repo-subdir: docs
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Get started
      - href: README.md
        text: Documentation
      - href: python/index.html
        text: Python package
      - href: r/index.html
        text: R package
    right:
      - icon: github
        href: https://github.com/t-kalinowski/mcp-console
        aria-label: GitHub repository
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: README.md
        text: Reading guide
      - section: Use Console
        contents:
        - getting-started.qmd
        - BUILTIN_RUNTIME.md
        - RECORDING.md
        - PYTHON.md
        - href: r/index.html
          text: R and ellmer
      - section: Public reference
        contents:
        - API.md
        - CONFIGURATION.md
        - REQUIREMENTS.md
        - SEND_OPERATIONS.md
        - CLI.md
        - cli-help.qmd
        - ENVIRONMENT.md
        - GLOSSARY.md
        - href: python/reference/index.html
          text: Python API
      - section: Security and platforms
        contents:
        - SANDBOX.md
        - SANDBOX_CONFIGURATION.md
        - RESOLVER.md
        - WINDOWS.md
        - LINUX_COMPATIBILITY.md
      - section: Develop Console
        contents:
        - DEVELOPMENT.md
        - ARCHITECTURE.md
        - RELAY_PROTOCOL.md
        - WORKER_PROTOCOL.md
        - TOOL_DESCRIPTIONS.md
        - TODO.md
      - section: Evidence and release
        contents:
        - RESOLVER_RELEASE_AUDIT.md
        - benchmarks/transcript-concurrency.md
        - href: https://github.com/t-kalinowski/mcp-console/blob/main/RELEASE.md
          text: Release procedure
  page-footer:
    left: MCP Console · MIT License
    right:
      - text: Source
        href: https://github.com/t-kalinowski/mcp-console

filters:
  - _filters/website.lua

execute:
  enabled: false

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, dark.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
