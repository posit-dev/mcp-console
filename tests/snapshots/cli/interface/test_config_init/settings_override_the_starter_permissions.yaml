---
scenario: clear sandbox
configuration:
  sandbox: ~
---
scenario: read-only sandbox
configuration:
  sandbox:
    profile: read_only
---
scenario: empty sandbox mapping
configuration:
  sandbox: {}
---
scenario: replace write grants
configuration:
  sandbox:
    filesystem:
      read_write: []
      read_only:
        - .git
        - .agents
        - .codex
        - .aws
---
scenario: configured proxy and local binding
configuration:
  sandbox:
    filesystem:
      read_write:
        - .
      read_only:
        - .git
        - .agents
        - .codex
        - .aws
    network:
      proxy:
        domains:
          allow:
            - api.example.com
      allow_local_binding: true
