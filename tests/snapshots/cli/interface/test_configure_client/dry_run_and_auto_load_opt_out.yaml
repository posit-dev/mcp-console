---
client: codex
console:
  command: uvx
  args:
    - mcp-console
    - serve
    - --default-config
    - sandbox.profile=inherit_codex
  enabled: true
  omit_tools_from: []
  tools:
    send:
      approval_mode: approve
dry_run: |
  Would configure Console for Codex (global).
  Configuration: <CONFIG>

  Set these fields:
  [mcp_servers.console]
  command = "uvx"
  args = ["mcp-console", "serve", "--default-config", "sandbox.profile=inherit_codex"]
  enabled = true
  omit_tools_from = ["deferred"]

  [mcp_servers.console.tools.send]
  approval_mode = "approve"

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Console's send tool is allowlisted for calls without individual approval; explicit client restrictions still apply.
  Dry run; no files changed. You can apply the settings above manually.
opt_out: |
  Configured Console for Codex (global).
  Configuration: <CONFIG>

  Set these fields:
  [mcp_servers.console]
  command = "uvx"
  args = ["mcp-console", "serve", "--default-config", "sandbox.profile=inherit_codex"]
  enabled = true
  omit_tools_from = []

  [mcp_servers.console.tools.send]
  approval_mode = "approve"

  Console tools use the client's default tool discovery.
  Console's send tool is allowlisted for calls without individual approval; explicit client restrictions still apply.
  Restart Codex to load the configuration.
---
client: claude
console:
  type: stdio
  command: uvx
  args:
    - mcp-console
    - serve
  alwaysLoad: false
dry_run: |
  Would configure Console for Claude Code (global).
  Configuration: <CONFIG>

  Set these fields:
  {
    "mcpServers": {
      "console": {
        "type": "stdio",
        "command": "uvx",
        "args": [
          "mcp-console",
          "serve"
        ],
        "alwaysLoad": true
      }
    }
  }

  Would configure Console for Claude Code (global).
  Configuration: <SETTINGS>

  Set these fields:
  {
    "permissions": {
      "allow": [
        "mcp__console__send"
      ]
    }
  }

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Console's send tool is allowlisted for calls without individual approval; explicit client restrictions still apply.
  Dry run; no files changed. You can apply the settings above manually.
opt_out: |
  Configured Console for Claude Code (global).
  Configuration: <CONFIG>

  Set these fields:
  {
    "mcpServers": {
      "console": {
        "type": "stdio",
        "command": "uvx",
        "args": [
          "mcp-console",
          "serve"
        ],
        "alwaysLoad": false
      }
    }
  }

  Already configured Console for Claude Code (global).
  Configuration: <SETTINGS>

  Set these fields:
  {
    "permissions": {
      "allow": [
        "mcp__console__send"
      ]
    }
  }

  Console tools use the client's default tool discovery.
  Console's send tool is allowlisted for calls without individual approval; explicit client restrictions still apply.
  Restart Claude Code to load the configuration.
