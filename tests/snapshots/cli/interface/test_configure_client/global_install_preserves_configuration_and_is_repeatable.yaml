---
client: codex
console:
  command: uvx
  args:
    - mcp-console
    - serve
    - --default-config
    - sandbox.profile=inherit_codex
  enabled: true
  startup_timeout_sec: 30
  tool_input_schema_max_bytes: 12000
  omit_tools_from:
    - deferred
  default_tools_approval_mode: approve
  env:
    KEEP: value
stdout: |
  Configured Console for Codex (global).
  Configuration: <CONFIG>

  Set these fields:
  [mcp_servers.console]
  command = "uvx"
  args = ["mcp-console", "serve", "--default-config", "sandbox.profile=inherit_codex"]
  enabled = true
  # Limit schema size to less than roughly 1% of the stock 272k-token context.
  tool_input_schema_max_bytes = 12000
  omit_tools_from = ["deferred"]
  default_tools_approval_mode = "approve"

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Console tools are allowlisted for calls without individual approval; explicit client restrictions still apply.
  Restart Codex to load the configuration.
repeat: unchanged
---
client: claude
console:
  type: stdio
  command: uvx
  args:
    - mcp-console
    - serve
  env:
    KEEP: value
  alwaysLoad: true
stdout: |
  Configured Console for Claude Code (global).
  Configuration: <CONFIG>

  Set these fields:
  {
    "mcpServers": {
      "console": {
        "type": "stdio",
        "command": "uvx",
        "args": [
          "mcp-console",
          "serve"
        ],
        "alwaysLoad": true
      }
    }
  }

  Configured Console for Claude Code (global).
  Configuration: <SETTINGS>

  Set these fields:
  {
    "permissions": {
      "allow": [
        "mcp__console__*"
      ]
    }
  }

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Console tools are allowlisted for calls without individual approval; explicit client restrictions still apply.
  Restart Claude Code to load the configuration.
repeat: unchanged
