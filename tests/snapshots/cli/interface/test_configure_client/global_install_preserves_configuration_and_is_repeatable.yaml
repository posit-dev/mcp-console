---
client: codex
console:
  command: uvx
  args:
    - mcp-console
    - serve
  enabled: true
  startup_timeout_sec: 30
  omit_tools_from:
    - deferred
  env:
    KEEP: value
stdout: |
  Configured Console for Codex (global).
  Configuration: <CONFIG>

  Set these fields:
  [mcp_servers.console]
  command = "uvx"
  args = ["mcp-console", "serve"]
  enabled = true
  omit_tools_from = ["deferred"]

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Restart Codex to load the configuration.
repeat: unchanged
---
client: claude
console:
  type: stdio
  command: uvx
  args:
    - mcp-console
    - serve
  env:
    KEEP: value
  alwaysLoad: true
stdout: |
  Configured Console for Claude Code (global).
  Configuration: <CONFIG>

  Set these fields:
  {
    "mcpServers": {
      "console": {
        "type": "stdio",
        "command": "uvx",
        "args": [
          "mcp-console",
          "serve"
        ],
        "alwaysLoad": true
      }
    }
  }

  Console tools are configured to load up front. Use --no-auto-load to keep the client's default tool discovery.
  Restart Claude Code to load the configuration.
repeat: unchanged
