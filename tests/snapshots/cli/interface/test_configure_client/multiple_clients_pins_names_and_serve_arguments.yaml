---
version_suffix: ~
clients: 2
args:
  codex:
    - mcp-console
    - serve
    - --default-config
    - sandbox.profile=inherit_codex
    - --no-project-config
    - --writable-root
    - a path
  claude:
    - mcp-console
    - serve
    - --no-project-config
    - --writable-root
    - a path
