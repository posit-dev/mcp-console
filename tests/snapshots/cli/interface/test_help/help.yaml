---
command: mcp-console
exit_code: 2
stdout: ""
stderr: |
  Persistent R, Python, and SQL sessions for MCP clients

  Usage: mcp-console [OPTIONS] <COMMAND>

  Commands:
    serve             Run the MCP server over standard input and output
    sandbox           Run a command with the default or an explicit sandbox policy
    config            Create or inspect configuration without starting
                      interpreters or preparing packages
    configure-client  Configure clients to launch MCP Console and expose its tools
    warmup            Check the configured server and runtimes and warm their
                      caches
    help              Print this message or the help of the given subcommand(s)

  Options:
        --no-project-config
            Skip trusted launch-directory project configuration; still load global
            configuration and apply -c overrides
        --no-global-config
            Skip global configuration; still load project configuration and apply
            -c overrides
        --no-config
            Skip global and project configuration; still apply --default-config
            and -c settings
        --config-file <PATH>
            Use only this YAML or JSON configuration file, then apply -c overrides
        --default-config <KEY=VALUE>
            Supply defaults below configuration files; repeat for ordered dotted
            KEY=VALUE assignments
    -c, --config <KEY=VALUE>
            Override layered global and project configuration; repeat for ordered
            dotted KEY=VALUE assignments
    -h, --help
            Print help (see more with '--help')
    -V, --version
            Print version

  Examples:
    mcp-console serve
    mcp-console warmup
    mcp-console sandbox -- python -c 'print("hello")'
    mcp-console configure-client codex claude
