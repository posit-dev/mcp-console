command: mcp-console warmup --help
stdout: |
  Check the configured server and runtimes and warm their caches

  Dependency preparation runs with host permissions, using the same caches as
  serve. Run only trusted configuration and dependencies. Runtime checks use the
  configured sandbox unless --no-sandbox is selected.

  Usage: mcp-console warmup [OPTIONS]

  Options:
        --no-project-config
            Skip launch-directory project configuration; still load global
            configuration and apply -c overrides.
            Automatic project configuration is trusted launcher input: it can
