command: mcp-console config --help
stdout: |
  Create or inspect configuration without starting interpreters or preparing
  packages

  Usage: mcp-console config <COMMAND>

  Commands:
    init     Create an annotated Console configuration with workspace permissions
    resolve  Print resolved configuration
    help     Print this message or the help of the given subcommand(s)

  Options:
    -h, --help  Print help
---
command: mcp-console config init --help
stdout: |
  Create an annotated Console configuration with workspace permissions

  Usage: mcp-console config init [OPTIONS]

  Options:
        --global              Create global configuration in Console home instead
                              of the project directory
        --directory <PATH>    Existing project directory; defaults to the current
                              directory without searching Git parents
    -c, --config <KEY=VALUE>  Override starter settings; repeat for ordered dotted
                              KEY=VALUE assignments
        --dry-run             Print the destination and proposed contents without
                              creating files or directories
    -h, --help                Print help

  Starts with workspace permissions and commented examples for common settings.
  Apply -c settings after the starter permissions; other defaults remain implicit.
  Existing files are never overwritten. Does not start interpreters or prepare
  packages.

  Examples:
    mcp-console config init
    mcp-console config init --global
    mcp-console config init --directory /path/to/project
    mcp-console config init -c r.resolution=disabled -c 'r.packages=[]' --dry-run
