---
command: mcp-console configure-client --help
stdout: |
  Configure clients to launch MCP Console and expose its tools

  Usage: mcp-console configure-client [OPTIONS] <CLIENT>... [-- <SERVE_ARGS>...]

  Arguments:
    <CLIENT>...      One or more clients to configure [possible values: codex,
                     claude]
    [SERVE_ARGS]...  Additional arguments passed to mcp-console serve, after --

  Options:
        --directory <PATH>       Write project configuration in PATH; defaults to
                                 global registration when omitted
        --no-uvx                 Configure an absolute executable path; temporary
                                 uvx runs install recorded direct sources with uv.
                                 Index installs must be persistent first.
                                 Conflicts with --pin-version
        --pin-version <VERSION>  Console version to resolve with uvx: exact
                                 version, current, or latest; unpinned by default.
                                 Conflicts with --no-uvx
        --name <NAME>            Server name in the client's configuration
                                 [default: console]
        --no-auto-load           Keep the client's default tool discovery instead
                                 of loading Console tools up front
        --no-warmup              Skip the background runtime checks and cache
                                 warming after configuration
        --dry-run                Preview setup without writing files, installing,
                                 or starting background warmup
    -h, --help                   Print help

  Prints each configuration file and setting changed. Unrelated settings are
  preserved. Use --dry-run to preview or apply the changes manually.
  Starts cache warming in the background; use --no-warmup to skip it.
  Codex launches default to the client's sandbox permissions; configuration files
  can select another profile. Arguments after -- customize the serve settings.

  Examples:
    uvx mcp-console configure-client codex claude
    mcp-console configure-client codex --pin-version current
    mcp-console configure-client codex --pin-version v0.0.5
    mcp-console configure-client claude --no-uvx --dry-run
