---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import errno
    import socket
    import sys

    try:
        socket.create_connection(("127.0.0.1", int(sys.argv[1])))
    except OSError as error:
        assert error.errno == errno.EPERM
        print("blocked")
    else:
        raise SystemExit("network access was allowed")
  - <listener port>
stdout: |
  blocked
transcript_normalization:
  target: command[-1]
  listener_port: omitted
