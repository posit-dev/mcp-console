---
command:
  - mcp-console
  - sandbox
  - --
  - python
  - -c
  - |
    import sys

    print("ready", flush=True)
    for line in sys.stdin:
        if line == "EXIT\n":
            break

        sys.stdout.write(line)
        sys.stdout.flush()
        sys.stderr.write(line)
        sys.stderr.flush()
stdin: |
  echo exactly: $(literal)
stdout: |
  ready
  echo exactly: $(literal)
stderr: |
  echo exactly: $(literal)
---
stdin: |
  EXIT
exit_code: 0
