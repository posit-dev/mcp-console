---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: pass
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: print('survived')
result:
  content:
    - type: text
      text: |
        survived
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
