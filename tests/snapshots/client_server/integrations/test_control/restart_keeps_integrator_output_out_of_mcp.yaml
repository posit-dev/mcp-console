---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: pass
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  python: print('replacement ready')
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        replacement ready
        [done]
  isError: false
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: print('survived')
result:
  content:
    - type: text
      text: |
        survived
  isError: false
