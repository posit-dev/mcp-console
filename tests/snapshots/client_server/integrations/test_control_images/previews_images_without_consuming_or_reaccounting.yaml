---
!same-as MCP initialization for this execution mode
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    plot(1:3)
    invisible(grDevices::dev.off())
    cat(strrep("x", 24000), "\n", sep = "")
    gate <- fifo(
      "<workspace>/entered",
      "wb",
      blocking = TRUE
    )
    writeBin(charToRaw("1"), gate)
    close(gate)
    gate <- fifo(
      "<workspace>/release",
      "rb",
      blocking = TRUE
    )
    invisible(readBin(gate, "raw", n = 1))
    close(gate)
  timeout_ms: 60000
result:
  content:
    - type: image
      data: <PNG byte-identical to captured agent plot>
      mimeType: image/png
    - type: text
      text:
        text_bytes: 8057
        concat:
          - repeat: x
            count: 3968
          - |

            [output omitted: 16065 UTF-8 bytes; raw log: .agents/console/sessions/<recording ID>/capture/sessions/001/cell-002.txt]
          - repeat: x
            count: 3967
          - "\n"
  isError: false
---
send:
  r: cat("still recorded\n")
result:
  content:
    - type: text
      text: |
        still recorded
  isError: false
