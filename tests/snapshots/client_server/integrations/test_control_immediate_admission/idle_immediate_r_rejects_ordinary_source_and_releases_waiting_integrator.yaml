---
!same-as MCP initialization for this execution mode
---
send:
  r: priority_unwound <- FALSE
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: writeLines("ordinary R ran", "ordinary-r-ran")
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[immediate R execution is in progress; cell was not run]"
  isError: true
---
send:
  python: open("ordinary-python-ran", "w").close()
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[immediate R execution is in progress; cell was not run]"
  isError: true
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: stopifnot(priority_unwound); cat("worker usable\n")
result:
  content:
    - type: text
      text: |
        worker usable
  isError: false
