---
!same-as MCP initialization for this execution mode
---
send:
  python: import matplotlib.pyplot as plt
  requirements:
    python:
      - matplotlib
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    with open('<workspace>/entered', "wb", buffering=0) as gate:
        _ = gate.write(b"1")
    with open('<workspace>/release', "rb", buffering=0) as gate:
        _ = gate.read(1)
    _ = plt.plot([3, 1])
    plt.show()
  timeout_ms: 60000
result:
  content:
    - type: image
      data: <PNG byte-identical to ordinary plot>
      mimeType: image/png
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
