---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: shared = 40
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  session: alpha
  python: |
    shared = 100
    print("alpha pending", flush=True)
    with open('<workspace>/release', "rb", buffering=0) as gate:
        _ = gate.read(1)
    print(shared)
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        alpha pending
        100
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
