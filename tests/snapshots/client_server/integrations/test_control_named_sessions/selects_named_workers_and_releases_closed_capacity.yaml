---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: shared = 40
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  session: alpha
  python: shared = 100; print('agent alpha')
result:
  content:
    - type: text
      text: |
        agent alpha
  isError: false
---
send:
  session: alpha
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: print(shared)
result:
  content:
    - type: text
      text: |
        40
  isError: false
---
send:
  session: alpha
  python: print('shared' in globals())
result:
  content:
    - type: text
      text: |
        [worker stopped: in-memory state lost]
        [stopped]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [output produced while idle]
        False
  isError: false
---
send:
  python: print(shared)
result:
  content:
    - type: text
      text: |
        40
  isError: false
