---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: pass
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import os, sys
    print("partial", end="", flush=True)
    with open('<workspace>/release', "rb", buffering=0) as gate:
        gate.read(1)
    print(" console", flush=True)
    sys.stderr.write("diagnostic\n")
    sys.stderr.flush()
    raise ValueError("typed failure")
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        partial console
        diagnostic
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 8, in <module>
        ValueError: typed failure
  isError: false
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
