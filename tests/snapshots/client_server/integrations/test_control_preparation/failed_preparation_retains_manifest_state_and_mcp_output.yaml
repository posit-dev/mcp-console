---
!same-as MCP initialization for this execution mode
---
send:
  python: "kept = {'value': 42}"
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: import sys; print(sys.executable)
result:
  content:
    - type: text
      text: |
        <running Python>
  isError: false
---
send:
  python: |
    import os
    import threading

    def background_output():
        with open('<workspace>/release', "rb", buffering=0) as gate:
            gate.read(1)
        os.write(1, b"uncollected MCP output\n")

    threading.Thread(target=background_output).start()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-
        [session: "default"; status: idle]
        uncollected MCP output
        managed Python resolution failed:
        resolver input:
        {
          "python": "<running Python>",
          "packages": [
            "numpy",
            "pandas",
            "matplotlib",
            "plotnine",
            "mcp-console-control-prepare-failure"
          ]
        }
        uv output:
        synthetic uv failure
  structuredContent:
    sessions:
      - session: default
        status: idle
  isError: true
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: print(kept['value'])
result:
  content:
    - type: text
      text: |
        42
  isError: false
