---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: import threading; release = threading.Event()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    print("foreground pending", flush=True)
    with open('<workspace>/entered', "wb", buffering=0) as gate:
        gate.write(b"1")
    assert release.wait(30), "priority request did not release the foreground"
    print("foreground complete")
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        foreground pending
        foreground complete
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: print(release.is_set())
result:
  content:
    - type: text
      text: |
        True
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
