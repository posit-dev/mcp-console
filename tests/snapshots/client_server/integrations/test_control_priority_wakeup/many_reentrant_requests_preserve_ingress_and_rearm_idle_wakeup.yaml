---
!same-as MCP initialization for this execution mode
---
send:
  r: wakeup_count <- 0L
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    wakeup_release <- FALSE
    gate <- fifo("<workspace>/entered-0", "wb", blocking = TRUE)
    writeBin(charToRaw("1"), gate)
    close(gate)
    while (!wakeup_release) {
      Sys.sleep(0.001)
    }
    cat("foreground complete\n")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
