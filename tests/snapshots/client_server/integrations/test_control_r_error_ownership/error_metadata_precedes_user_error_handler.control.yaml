  language: r
  code: |
    options(show.error.messages = TRUE)
    error_path <- tempfile()
    error_file <- file(error_path, "wt")
    sink(error_file, type = "message")
    options(error = function() {
      sink(type = "message")
      try(stop("inner"), silent = TRUE)
      cat(geterrmessage(), file = stderr())
    })
    stop("redirected outer", call. = FALSE)
  busy: wait
  wait_ms: 30000
