---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    release_foreground_error <- FALSE
    options(error = function() {
      cat("foreground error handler ready\n")
      while (!release_foreground_error) {
        Sys.sleep(0.01)
      }
      cat("foreground handler message: ", geterrmessage(), sep = "")
    })
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
