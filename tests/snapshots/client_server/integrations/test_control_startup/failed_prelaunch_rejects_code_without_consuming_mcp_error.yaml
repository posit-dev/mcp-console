---
scenario: >-
  Integrator admission rejects a failed worker prelaunch and leaves its
  diagnostic for MCP.
fixture: >-
  Native macOS Seatbelt denies the selected R installation's etc/Renviron
  file during worker startup. An invalid control request activates
  recording before a journal checkpoint observes prelaunch failure.
---
!same-as python-only MCP initialization for this execution mode
---
send: {}
result:
  content:
    - type: text
      text: |-
        Can't read R resource directories: exit status: 1: <R_HOME>/bin/Rcmd: line 39: <R_HOME>/etc/Renviron: Operation not permitted

        [worker sideband read failed: worker sideband closed]
        [worker exited with status 1]
  isError: true
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
