---
!same-as MCP initialization for this execution mode
---
send:
  r: options(warn = 0); release <- FALSE
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    {
      warning("foreground deferred", call. = FALSE)
      gate <- fifo("<workspace>/entered", "wb", blocking = TRUE)
      writeBin(charToRaw("1"), gate)
      close(gate)
      while (!release) {
        Sys.sleep(0.01)
      }
      cat("foreground complete\n")
    }
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        foreground complete
        Warning message:
        foreground deferred 
  isError: false
---
send:
  r: cat("next cell\n")
result:
  content:
    - type: text
      text: |
        next cell
  isError: false
