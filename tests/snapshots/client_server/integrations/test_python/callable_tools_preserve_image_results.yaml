---
scenario: >-
  Callable tools through MCPConsole: Chatlas, OpenAI Agents, Anthropic,
  and OpenAI Responses each receive an image result, a text result, then
  an invalid call. Anthropic also receives an image followed by a worker
  exit error.
fixture: >-
  The built-in R runtime produces a plot whose PNG bytes are compared with
  a live Rscript reference. The proxy records MCP exchanges; adapter
  results are checked in Python.
---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(
      console.plot.width_in = 4,
      console.plot.height_in = 3,
      console.plot.dpi = 100
    )
    cat("before image\n")
    plot(1:3)
    invisible(dev.off())
    cat("after image\n")
  timeout_ms: 300000
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: cat("text\n")
result:
  content:
    - type: text
      text: |
        text
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: cat("r\n")
  python: print("python")
result:
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
