---
scenario: >-
  Chatlas tools through AsyncMCPConsole: an image result, a text result,
  then an invalid call.
fixture: >-
  The real Console server runs the synthetic zod worker, which emits fixed
  text and PNG data instead of executing R or Python. The proxy records
  MCP exchanges; adapter results are checked in Python.
---
!same-as custom MCP initialization for this execution mode
---
send:
  r: emit image
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to zod fixture>
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
---
send:
  r: echo text
result:
  content:
    - type: text
      text: |
        zod: text
  isError: false
---
send:
  r: echo r
  python: echo python
result:
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
