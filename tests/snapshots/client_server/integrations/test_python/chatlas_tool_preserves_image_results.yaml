---
scenario: >-
  Chatlas tools through MCPConsole: an image result, a text result, then
  an invalid call.
fixture: >-
  The zod worker returns a fixed PNG for `emit image`. The recording proxy
  captures the SDK's MCP requests and responses; adapter return values are
  checked in Python assertions.
transcript_normalization:
  target: initialize.params.clientInfo
  original:
    name: mcp
    version: 0.1.0
  normalized:
    name: acceptance-test
    version: 1.0.0
---
!same-as custom MCP initialization for this execution mode
---
send:
  r: emit image
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
---
send:
  r: echo text
result:
  content:
    - type: text
      text: |
        zod: text
  isError: false
---
send:
  r: echo r
  python: echo python
result:
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
