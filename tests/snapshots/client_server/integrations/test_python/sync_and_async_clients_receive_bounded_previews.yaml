---
scenario: MCPConsole receives a bounded preview and then idle.
fixture: >-
  The real Python runtime emits more than the retained preview budget. The
  full raw log and exact preview bytes are checked; the proxy retains the
  MCP exchanges.
---
!same-as modern MCP initialization for this execution mode
---
send:
  python: print("x" * 8388615, end="")
  timeout_ms: 600000
result:
  resultType: complete
  content:
    - type: text
      text: |-
        
        [output omitted: 8380679 UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/capture/sessions/001/cell-001.txt]
        
  isError: false
---
send:
  session: default
result:
  resultType: complete
  content:
    - type: text
      text: |-

        [idle]
  isError: false
