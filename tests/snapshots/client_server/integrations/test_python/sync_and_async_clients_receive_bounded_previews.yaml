---
scenario: MCPConsole receives a bounded preview and then idle.
fixture: >-
  The real Python runtime emits more than the retained preview budget. The
  full raw log and exact preview bytes are checked; the proxy retains the
  MCP exchanges.
---
!same-as modern-python-sdk MCP initialization for this execution mode
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      python: print("x" * 8388615, end="")
      timeout_ms: 600000
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |-
        
        [output omitted: 8380679 UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/capture/sessions/001/cell-001.txt]
        
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      session: default
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
