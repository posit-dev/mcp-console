---
scenario: >-
  Rich results through MCPConsole: an image, text, a raw call, an invalid
  call, then an image-bearing worker exit.
fixture: >-
  The built-in R runtime produces PNG bytes compared with a live Rscript
  reference. The proxy records MCP exchanges; Python asserts result
  preservation and notebook display without model API calls.
---
!same-as modern-python-sdk MCP initialization for this execution mode
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |
        options(
          console.plot.width_in = 4,
          console.plot.height_in = 3,
          console.plot.dpi = 100
        )
        cat("before image\n")
        plot(1:3)
        invisible(dev.off())
        cat("after image\n")
      timeout_ms: 300000
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: cat("text\n")
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |
        text
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: cat("raw\n")
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |
        raw
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: cat("r\n")
      python: print("python")
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      r: |
        options(
          console.plot.width_in = 4,
          console.plot.height_in = 3,
          console.plot.dpi = 100
        )
        cat("before image\n")
        plot(1:3)
        invisible(dev.off())
        cat("after image\n")

        quit(save = "no", status = 33L, runLast = FALSE)
      timeout_ms: 300000
    _meta:
      io.modelcontextprotocol/protocolVersion: 2026-07-28
      io.modelcontextprotocol/clientInfo:
        name: mcp
        version: 0.1.0
      io.modelcontextprotocol/clientCapabilities: {}
result:
  resultType: complete
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |-
        after image
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 33]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      version: <Console version>
