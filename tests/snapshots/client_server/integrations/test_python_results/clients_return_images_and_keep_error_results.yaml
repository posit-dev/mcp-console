---
scenario: >-
  Rich results through MCPConsole: an image, text, a raw call, an invalid
  call, then an image-bearing worker exit.
fixture: >-
  The built-in R runtime produces PNG bytes compared with a live Rscript
  reference. The proxy records MCP exchanges; Python asserts result
  preservation and notebook display without model API calls.
---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(
      console.plot.width_in = 4,
      console.plot.height_in = 3,
      console.plot.dpi = 100
    )
    cat("before image\n")
    plot(1:3)
    invisible(dev.off())
    cat("after image\n")
  timeout_ms: 300000
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: cat("text\n")
result:
  content:
    - type: text
      text: |
        text
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: cat("raw\n")
result:
  content:
    - type: text
      text: |
        raw
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: cat("r\n")
  python: print("python")
result:
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
---
send:
  r: |
    options(
      console.plot.width_in = 4,
      console.plot.height_in = 3,
      console.plot.dpi = 100
    )
    cat("before image\n")
    plot(1:3)
    invisible(dev.off())
    cat("after image\n")

    quit(save = "no", status = 33L, runLast = FALSE)
  timeout_ms: 300000
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |-
        after image
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 33]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
