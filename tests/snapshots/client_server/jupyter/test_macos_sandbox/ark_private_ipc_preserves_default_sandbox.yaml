---
scenario: The published ark kernel works in the default read-only sandbox.
fixture: >-
  No transport or sandbox permissions are configured. Host TCP and Unix
  listeners accept baseline connections outside the sandbox; a host file
  contains a protected sentinel.
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.jupyter.yaml
---
send:
  code: |-
    answer = 42
    print(answer)
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  code: |
    private <- tempfile("kernel-permission-probe-")
    writeLines("private", private)
    stopifnot(identical(readLines(private), "private"))
    unlink(private)
    cat("private temp: writable\n")
    host <- Sys.getenv("MCP_CONSOLE_TEST_JUPYTER_HOST_FILE")
    stopifnot(identical(readLines(host), "original"))
    failure <- tryCatch(
      withCallingHandlers(
        writeLines("changed", host),
        warning = function(w) {
          cat("host file warning: ", conditionMessage(w), "\n", sep = "")
          invokeRestart("muffleWarning")
        }
      ),
      error = identity
    )
    stopifnot(inherits(failure, "error"))
    cat("host file error: ", conditionMessage(failure), "\n", sep = "")
result:
  content:
    - type: text
      text: |
        private temp: writable
        host file warning: cannot open file '<workspace>/host-sentinel': Operation not permitted
        host file error: cannot open the connection
  isError: false
---
send:
  code: |
    status <- system2(
      Sys.getenv("MCP_CONSOLE_TEST_JUPYTER_PYTHON"),
      shQuote(Sys.getenv("MCP_CONSOLE_TEST_JUPYTER_NETWORK_PROBE"))
    )
    stopifnot(status == 0L)
result:
  content:
    - type: text
      text: |
        private Unix: roundtrip
        host TCP: [Errno 1] Operation not permitted
        external TCP: [Errno 1] Operation not permitted
        host Unix: [Errno 1] Operation not permitted
        host Unix through private symlink: [Errno 1] Operation not permitted
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  code: exists("answer", inherits = FALSE)
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
---
send:
