---
scenario: >-
  Interrupt cancels kernel startup before Jupyter readiness and discards
  the pending cell.
fixture: >-
  An isolated kernelspec selects the test host's installed release using
  IPC transport. A Python launcher records its PID and blocks on a FIFO
  before starting the released ipykernel.
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.jupyter.direct.yaml
---
send:
  code: |
    from pathlib import Path

    Path("must-not-run").write_text("unexpected execution")
