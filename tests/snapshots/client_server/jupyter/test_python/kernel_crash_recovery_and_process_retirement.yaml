---
scenario: >-
  A kernel crash loses state; explicit restart recovers and reaps prior
  processes.
fixture: >-
  An isolated kernelspec selects the test host's installed release using
  IPC transport.
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.jupyter.direct.yaml
---
send:
  code: |-
    import os
    print(os.getpid())
result:
  content:
    - type: text
      text: |
        <original kernel PID>
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  code: |-
    import os
    print(os.getpid())
result:
  content:
    - type: text
      text: |
        <crashing kernel PID>
  isError: false
