result:
  content:
    - type: text
      text: |
        ---------------------------------------------------------------------------
        ValueError                                Traceback (most recent call last)
        Cell In[4], line 1
        ----> 1 raise ValueError("intentional kernel error")

        ValueError: intentional kernel error
  isError: false
---
send:
  code: answer + 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: 1 + 1
result:
  content:
    - type: text
      text: "`r` source fields are hidden by `--jupyter-kernel`"
  isError: true
---
send:
  python: 1 + 1
result:
  content:
    - type: text
