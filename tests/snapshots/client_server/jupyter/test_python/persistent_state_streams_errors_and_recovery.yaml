      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  code: |-
    answer = 40
    answer + 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  code:
    text_bytes: 102413
    concat:
      - "# "
      - repeat: x
        count: 102400
      - |-

        answer + 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  code: |
    import sys

    print("stdout café", flush=True)
    print("stderr Ω", file=sys.stderr, flush=True)
result:
  content:
    - type: text
      text: |
        stdout café
        stderr Ω
  isError: false
---
