---
scenario: A published ark kernel executes persistent cells.
fixture: >-
  An isolated kernelspec selects the test host's installed release using
  IPC transport.
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.jupyter-reticulate.direct.yaml
---
send:
  python: |-
    answer = 42
    print("ready")
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  python: |
    from pathlib import Path

    try:
        Path("cpu-ready").touch()
        while True:
            pass
    except KeyboardInterrupt:
        print("CPU interrupted")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        CPU interrupted
  isError: false
---
send:
  python: answer
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: reticulate::py$answer
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  python: |
    import asyncio

    try:
        Path("async-ready").touch()
        await asyncio.Event().wait()
    except asyncio.CancelledError:
        print("async cancelled")
  timeout_ms: 0
result:
  content:
    - type: text
