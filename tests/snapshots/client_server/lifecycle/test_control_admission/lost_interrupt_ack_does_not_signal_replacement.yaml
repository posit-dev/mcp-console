---
!same-as custom MCP initialization for this execution mode
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  control: restart
  timeout_ms: 5000
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: first cell
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: "[selected worker failed]"
  isError: true
---
send: {}
result:
  content:
    - type: text
      text: |-
        [selected worker failed]
        [worker exited with status 0]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  r: fresh cell
result:
  content:
    - type: text
      text: |
        fresh cell
  isError: false
