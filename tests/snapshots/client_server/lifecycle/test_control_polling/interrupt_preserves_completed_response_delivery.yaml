---
!same-as custom MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
      python: []
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: shutdown output checkpoints
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  stdin: p
  timeout_ms: 40000
result:
  content:
    - type: text
      text: |
        before shutdown
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: echo after completed interrupt
result:
  content:
    - type: text
      text: |
        zod: after completed interrupt
  isError: false
