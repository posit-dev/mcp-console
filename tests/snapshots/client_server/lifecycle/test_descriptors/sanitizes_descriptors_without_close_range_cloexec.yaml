---
launch_path: ENOSYS
send:
  python: |
    import errno
    import os

    descriptor = int(os.environ["MCP_CONSOLE_TEST_INHERITED_FD"])
    try:
        os.write(descriptor, b"escaped")
    except OSError as error:
        assert error.errno == errno.EBADF
    else:
        raise RuntimeError("unlisted server descriptor reached the worker")

    print("closed")
result:
  content:
    - type: text
      text: |
        closed
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: must not run
result:
  content:
    - type: text
      text: >-
        [failed to launch worker relay: No such file or directory (os error 2)]
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
