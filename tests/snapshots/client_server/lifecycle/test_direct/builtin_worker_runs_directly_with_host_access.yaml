---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.direct.yaml
---
send:
  python: |
    import os
    from pathlib import Path

    storage = Path(os.environ["TMPDIR"])
    assert storage.is_dir() and storage.samefile(Path.cwd())
    _ = Path("worker-storage").write_text(str(storage))
    output = Path("host-output")
    output.write_text("host write succeeded", encoding="utf-8")
    print(output.read_text(encoding="utf-8"))
result:
  content:
    - type: text
      text: |
        host write succeeded
  isError: false
---
send:
  control: restart
  python: print("output" in globals())
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        False
        [done]
  isError: false
