---
!same-as MCP initialization for this execution mode
---
send:
  r: cat("ready\n")
result:
  content:
    - type: text
      text: |
        ready
  isError: false
---
send:
  r: |
    tryCatch(
      readline("old> "),
      interrupt = function(e) cat("interrupted\n")
    )
result:
  content:
    - type: text
      text: |-
        [input requested: "old> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  requirements:
    r:
      - DBI
  r: follow_up_ran <- TRUE
result:
  content:
    - type: text
      text: |-
        interrupted
        R requirements cannot change under r.resolution=disabled (requirements.action=add)
  isError: true
---
send:
  r: stopifnot(!exists("follow_up_ran")); cat("worker retained\n")
result:
  content:
    - type: text
      text: |
        worker retained
  isError: false
