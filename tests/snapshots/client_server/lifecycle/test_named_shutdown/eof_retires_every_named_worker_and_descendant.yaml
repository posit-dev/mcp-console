---
!same-as python-only MCP initialization for this execution mode
---
send:
  session: default
  python: |
    import json
    import os
    import subprocess
    import sys

    child = subprocess.Popen(
        [
            sys.executable,
            "-c",
            "import os, signal; "
            "signal.signal(signal.SIGTERM, signal.SIG_IGN); "
            "print(os.getpid(), flush=True); signal.pause()",
        ],
        stdin=subprocess.DEVNULL,
        stdout=subprocess.PIPE,
        stderr=subprocess.PIPE,
        text=True,
        start_new_session=True,
    )
    child_pid = int(child.stdout.readline())
    print(
        json.dumps(
            {
                "worker": os.getpid(),
                "relay": os.getppid(),
                "child": child_pid,
            },
            sort_keys=True,
        )
    )
result:
  content:
    - type: text
      text: >
        {"child": "<child pid>", "relay": "<relay pid>", "worker": "<worker
        pid>"}
  isError: false
transcript_normalization:
  target: result.content[0].text
  process_ids: omitted after live identity assertions
