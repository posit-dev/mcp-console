---
!same-as custom MCP initialization for this execution mode
---
send:
  r: set controlled restart state
result:
  content:
    - type: text
      text: |
        zod controlled state: old
  isError: false
session_bundles:
  - <recording>/sessions/session-001
---
send:
  control: restart
  r: inspect controlled restart state
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        zod controlled state: fresh; evaluation=1
        [done]
  isError: false
session_bundles:
  - <recording>/sessions/session-002
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
