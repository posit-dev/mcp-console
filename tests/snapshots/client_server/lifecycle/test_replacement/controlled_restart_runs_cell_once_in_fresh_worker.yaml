---
!same-as custom MCP initialization for this execution mode
---
send:
  r: set controlled restart state
result:
  content:
    - type: text
      text: |
        zod controlled state: old
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  control: restart
  r: inspect controlled restart state
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        zod controlled state: fresh; evaluation=1
        [done]
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
