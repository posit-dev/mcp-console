---
!same-as custom MCP initialization for this execution mode
---
send:
  r: exit unexpectedly
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 86]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  stdin: |
    replacement
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: input without request
result:
  content:
    - type: text
      text: |
        zod stdin: replacement
  isError: false
