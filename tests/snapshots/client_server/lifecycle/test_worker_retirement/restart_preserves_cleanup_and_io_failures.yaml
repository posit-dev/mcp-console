---
!same-as custom MCP initialization for this execution mode
---
send:
  r: "42"
result:
  content:
    - type: text
      text: |-
        [scripted evaluation failure; additionally failed to stop the worker: worker launcher exited with status 47; additionally failed to retire worker I/O: scripted retirement failure]
        [stopped by session restart request before evaluation finished]
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [worker launcher exited with status 47; additionally failed to retire worker I/O: scripted retirement failure]
  isError: true
---
send:
  r: must not run during retirement
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[worker is restarting]"
  isError: true
---
send:
  r: "42"
result:
  content:
    - type: text
      text: "[worker is shutting down]"
  isError: true
---
exit_status: 1
stderr: >
  worker launcher exited with status 47; additionally failed to retire
  worker I/O: scripted retirement failure
