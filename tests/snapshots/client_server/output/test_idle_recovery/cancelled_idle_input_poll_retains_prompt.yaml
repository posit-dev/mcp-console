---
scenario: >-
  Cancelling an empty poll preserves an input prompt requested outside a
  cell.
fixture: >-
  The fake worker completes its cell before requesting input. A sideband
  receipt proves the server processed the prompt before the response gate
  pauses delivery.
---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.custom.direct.yaml
---
send:
  r: echo ready
result:
  content:
    - type: text
      text: |
        zod: ready
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: request input while idle
result:
