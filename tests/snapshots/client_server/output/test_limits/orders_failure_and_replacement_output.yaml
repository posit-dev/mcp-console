---
!same-as custom MCP initialization for this execution mode
---
send:
  r: complete silently
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: violate protocol after stdout
result:
  content:
    - type: text
      text: |-
        zod old stdout
        
        [output omitted: 4186527 UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/capture/sessions/001/cell-002.txt]
         stdout tail
        [worker sent an unexpected ready message]
        [worker terminated by signal 9]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
