---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os

    print("prefix", end="")
    with open(os.environ["CONSOLE_TEST_RELEASE"], "rb", buffering=0) as gate:
        assert gate.read(1) == b"1"
    print(input())
  timeout_ms: 100
result:
  content:
    - type: text
      text: |-
        prefix
        [elapsed: <elapsed>s since admission]
        [running; poll with an empty send]
  isError: false
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [input requested: ""]
        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    answer
result:
  content:
    - type: text
      text: |
        answer
  isError: false
