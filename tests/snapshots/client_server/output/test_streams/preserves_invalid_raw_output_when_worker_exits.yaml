            [output omitted: <omitted byte count> UTF-8 bytes; raw log: .agents/console/sessions/<run ID>/capture/sessions/002/cell-001.txt]
          - repeat: z
            count: 3862
          - |-
            od expected stderr crash tail: <pipe tail bytes>
            [worker sideband read failed: worker sideband closed]
            [worker exited with status 86]
            [worker stopped: in-memory state lost]
            [starting new worker]
            [idle]
  isError: true
