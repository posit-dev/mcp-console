---
!same-as custom MCP initialization for this execution mode
---
send:
  r: echo ready
result:
  content:
    - type: text
      text: |
        zod: ready
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: echo held response
result:
  content:
    - type: text
      text: |
        zod: held response
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
