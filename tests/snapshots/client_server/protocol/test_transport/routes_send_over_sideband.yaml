---
!same-as custom MCP initialization for this execution mode
---
send:
  r: echo hello
result:
  content:
    - type: text
      text: |
        zod: hello
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: echo precise 👩🏽‍💻
result:
  content:
    - type: text
      text: |
        zod python: precise 👩🏽‍💻
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
