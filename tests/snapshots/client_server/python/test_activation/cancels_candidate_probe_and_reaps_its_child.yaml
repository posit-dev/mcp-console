---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    cat(
      tempfile("probe-ready-"),
      tempfile("probe-release-"),
      tempfile("probe-pid-"),
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |-
        <probe ready>
        <probe release>
        <probe pid>
  isError: false
---
send:
  python: marker = object(); marker_id = id(marker)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: KeyboardInterrupt
  isError: true
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: id(marker) == marker_id
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
