---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    cat(
      tempfile("probe-ready-"),
      tempfile("probe-release-"),
      tempfile("probe-pid-"),
      sep = "\n"
    )
result:
  content:
    - type: text
      text: |-
        <probe ready>
        <probe release>
        <probe pid>
  isError: false
---
send:
  python: marker = object(); marker_id = id(marker)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: Python preparation cancelled by restart
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: '"marker" not in globals()'
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
