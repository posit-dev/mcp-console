---
send:
  python: |
    import os
    import console_unloaded
    from pathlib import Path

    assert os.getpid() == int(Path("worker-pid").read_text())
    print(console_unloaded.origin)
result:
  content:
    - type: text
      text: |
        candidate
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
