      text: "[prepared]"
  isError: false
---
send:
  python: |
    import sys

    original_identity = sys.prefix, sys.exec_prefix, sys.executable
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - console-activation-fixture
result:
