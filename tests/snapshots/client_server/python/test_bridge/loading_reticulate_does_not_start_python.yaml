---
send:
  r: |
    Sys.setenv(RETICULATE_PYTHON = "__console_missing_python__")
    suppressPackageStartupMessages(library(reticulate))
    stopifnot(!reticulate::py_available(initialize = FALSE))
    cat("reticulate loaded without Python\n")
result:
  content:
    - type: text
      text: |
        reticulate loaded without Python
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
