---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    answer = 42
    import sys
    import threading


    def explicit_exit():
        raise SystemExit(33)


    for terminate in (lambda: sys.exit(33), explicit_exit):
        thread = threading.Thread(target=terminate)
        thread.start()
        thread.join()
        assert not thread.is_alive()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: answer
