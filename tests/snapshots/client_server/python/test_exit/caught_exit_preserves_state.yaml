---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    answer = 42
    import sys

    try:
        sys.exit(33)
    except SystemExit as error:
        assert error.code == 33
    try:
        raise SystemExit("caught message")
    except SystemExit as error:
        assert error.code == "caught message"
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: answer
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
