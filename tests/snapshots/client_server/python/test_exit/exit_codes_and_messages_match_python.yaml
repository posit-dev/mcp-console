---
!same-as MCP initialization for this execution mode
---
send:
  python: |-
    import threading
    assert threading.current_thread() is threading.main_thread()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |-
    answer = 42
    import sys
    sys.exit()
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 0]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  python: ("answer" in globals(), 1 + 1)
result:
  content:
    - type: text
      text: |
        (False, 2)
  isError: false
