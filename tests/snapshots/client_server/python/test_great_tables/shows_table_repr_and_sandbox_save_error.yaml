    import pandas as pd
    from great_tables import GT

    sales = pd.DataFrame(
        {
            "Region": ["North", "South"],
            "Revenue": [1234.5, 9876.0],
        }
    )
    table = GT(sales).tab_header(title="Quarterly sales").fmt_currency(columns="Revenue")
    table
  timeout_ms: 600000
