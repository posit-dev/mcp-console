---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    python:
      - -e
      - >-
        base::writeLines('executed',
        base::Sys.getenv('MCP_CONSOLE_HOST_MARKER'))
result:
  content:
    - type: text
      text: >-
        Python requirement `-e` is not accepted: host-side managed resolution
        accepts named package requirements only
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
