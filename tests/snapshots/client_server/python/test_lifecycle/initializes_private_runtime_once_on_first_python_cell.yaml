---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(!reticulate::py_available(initialize = FALSE))
    initialization_count <- 0L
    setHook("reticulate.onPyInit", function() {
      initialization_count <<- initialization_count + 1L
    }, action = "append")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: >-
    runtime_identity = object(); runtime_identity_id = id(runtime_identity);
    42
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: assert id(runtime_identity) == runtime_identity_id; 43
result:
