---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(!reticulate::py_available(initialize = FALSE))
    initialization_count <- 0L
    setHook("reticulate.onPyInit", function() {
      initialization_count <<- initialization_count + 1L
    }, action = "append")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  python: >-
    runtime_identity = object(); runtime_identity_id = id(runtime_identity);
    42
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  python: assert id(runtime_identity) == runtime_identity_id; 43
result:
  content:
    - type: text
      text: |
        43
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  r: initialization_count
result:
  content:
    - type: text
      text: |
        [1] 0
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: invisible(reticulate::py_config()); initialization_count
result:
  content:
    - type: text
      text: |
        [1] 1
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  python: assert id(runtime_identity) == runtime_identity_id; 44
result:
  content:
    - type: text
      text: |
        44
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  r: invisible(reticulate::py_config()); initialization_count
result:
  content:
    - type: text
      text: |
        [1] 1
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
