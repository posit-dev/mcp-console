---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    cache = Path(os.environ["MPLCONFIGDIR"])
    cache.mkdir(parents=True, exist_ok=True)
    marker = cache / "session-marker"
    print(marker.exists())
result:
  content:
    - type: text
      text: |
        False
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    marker.write_text("private")
    print(marker.read_text())
result:
  content:
    - type: text
      text: |
        private
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
