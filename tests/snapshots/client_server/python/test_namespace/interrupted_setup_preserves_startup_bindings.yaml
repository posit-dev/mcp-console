---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: raise AssertionError("interrupted setup ran the cell")
result:
  content:
    - type: text
      text: |-
        [input requested: "namespace setup> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 109, in initialize_site
          File "<frozen site>", line 709, in main
          File "<frozen site>", line 648, in execsitecustomize
          File "<namespace-workspace>/modules/sitecustomize.py", line 4, in <module>
            exec(checkpoint)
            ~~~~^^^^^^^^^^^^
          File "<namespace setup checkpoint>", line 7, in <module>
          File "<string>", line 50, in _console_input
        KeyboardInterrupt
  isError: false
---
send:
  python: |
    assert all(a is b for a, b in zip((os, sys, tempfile), namespace_bindings))
    assert os is __import__("os") and tempfile is __import__("tempfile")
    assert not any(name.startswith("_mcp_console") for name in vars(__import__("builtins")))
    print("startup namespace preserved")
result:
  content:
    - type: text
      text: |
        startup namespace preserved
  isError: false
---
send:
  r: >-
    stopifnot(reticulate::py_eval("all(a is b for a, b in zip((os, sys,
    tempfile), namespace_bindings))"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
