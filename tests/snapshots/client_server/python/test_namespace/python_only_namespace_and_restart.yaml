---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print(globals())
result:
  content:
    - type: text
      text: >
        {'__name__': '__main__', '__doc__': None, '__package__': None,
        '__loader__': <class '_frozen_importlib.BuiltinImporter'>, '__spec__':
        None, '__annotations__': {}, '__builtins__': <module 'builtins'
        (built-in)>}
  isError: false
---
send:
  python: |
    assert globals() is __import__("__main__").__dict__
    assert __name__ == "__main__"
    assert globals().keys() <= {
        "__name__", "__doc__", "__package__", "__loader__", "__spec__",
        "__builtins__", "__annotations__", "r",
    }
    assert not {"os", "sys", "tempfile"} & globals().keys()
    assert not {"os", "sys", "tempfile"} & vars(__import__("builtins")).keys()
    assert not any(name.startswith("_mcp_console") for name in vars(__import__("builtins")))
    assert callable(_console.sql_connection)
    assert hasattr(__import__("builtins"), "r")
    assert globals().keys() == {
        "__name__",
        "__doc__",
        "__package__",
        "__loader__",
        "__spec__",
        "__annotations__",
        "__builtins__",
    }
    print("_console" in globals(), hasattr(__import__("builtins"), "_console"))
result:
  content:
    - type: text
      text: |
        False True
  isError: false
---
send:
  python: |
    try:
        r.pi
    except RuntimeError as error:
        assert str(error) == "R is unavailable in this session"
    else:
        raise AssertionError("fixture unexpectedly has R")
    print("R unavailable")
result:
  content:
    - type: text
      text: |
        R unavailable
  isError: false
---
send:
  python: retained = object()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: |-
    assert globals() is __import__("__main__").__dict__
    assert __name__ == "__main__"
    assert globals().keys() <= {
        "__name__", "__doc__", "__package__", "__loader__", "__spec__",
        "__builtins__", "__annotations__", "r",
    }
    assert not {"os", "sys", "tempfile"} & globals().keys()
    assert not {"os", "sys", "tempfile"} & vars(__import__("builtins")).keys()
    assert not any(name.startswith("_mcp_console") for name in vars(__import__("builtins")))
    assert callable(_console.sql_connection)
    assert hasattr(__import__("builtins"), "r")

    assert "retained" not in globals()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
