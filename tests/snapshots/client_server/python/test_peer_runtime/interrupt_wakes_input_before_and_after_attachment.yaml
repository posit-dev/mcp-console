---
send:
  python: |
    import signal
    import threading

    def interrupt_from_background():
        with open("interrupt", "rb", buffering=0) as gate:
            assert gate.read(1) == b"1"
        signal.pthread_kill(threading.get_ident(), signal.SIGINT)

    sender = threading.Thread(target=interrupt_from_background)
    sender.start()
    try:
        input("interrupt gate> ")
    except KeyboardInterrupt:
        print("input cancelled once")
    else:
        raise AssertionError("input was not interrupted")
    sender.join()
result:
  content:
    - type: text
      text: |-
        [input requested: "interrupt gate> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
