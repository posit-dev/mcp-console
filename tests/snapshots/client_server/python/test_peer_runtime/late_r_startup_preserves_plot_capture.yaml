---
scenario: >-
  An R startup package initializes Python before Console attaches its
  bridge.
fixture: >-
  Native R startup is eager; retained Python state is checked through R
  and Python follow-up cells.
---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: before_followup = object(); followup_identity = id(before_followup)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: >-
    stopifnot(reticulate::py_eval("id(before_followup) == followup_identity
    and id(early_object) == early_identity and sys.executable ==
    early_executable"))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    graphics::plot(1:3)
    graphics::plot(3:1)
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: image
      data: <PNG byte-identical to live Rscript page 2>
      mimeType: image/png
  isError: false
---
send:
  r: |
    stopifnot(
      "mcpconsoleearlypython" %in% getOption("defaultPackages"),
      identical(isTRUE(reticulate::py_config()$ephemeral), FALSE),
      identical(search()[[2L]], "tools:mcp-console"),
      identical(find("py")[[1L]], "tools:mcp-console"),
      identical(find(".console")[[1L]], "tools:mcp-console")
    )
    if (FALSE) {
      stopifnot(identical(Sys.getenv("RETICULATE_PYTHON"), "managed"))
    }
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    assert id(before_followup) == followup_identity; assert early_executable
    == sys.executable; print('startup Python retained across follow-up')
result:
  content:
    - type: text
      text: |
        startup Python retained across follow-up
  isError: false
---
send:
  r: |
    incompatible <- tryCatch(
      reticulate::use_python("/incompatible-python", required = TRUE),
      error = conditionMessage
    )
    stopifnot(identical(
      incompatible,
      "Python is already initialized with another selection; restart required"
    ))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import json
    import subprocess

    if False:
        assert "==" + ".".join(map(str, sys.version_info[:3])) == ''
    else:
        assert os.path.samefile(sys.executable, os.environ["MCP_CONSOLE_TEST_PYTHON"])
        assert os.path.realpath(sys.prefix) == os.path.realpath(
            os.environ["MCP_CONSOLE_TEST_PYTHON_PREFIX"]
        )
    assert id(early_object) == early_identity
    assert sys.executable == early_executable
    assert (
        sys.prefix,
        sys.exec_prefix,
        sys.base_prefix,
        sys.base_exec_prefix,
    ) == early_prefixes
    assert os.environ["PATH"] == early_path
    child = json.loads(
        subprocess.check_output([sys.executable, "-c", early_child_program], text=True)
    )
    assert child == early_child, (child, early_child)
    print("attached to the existing interpreter")
result:
  content:
    - type: text
      text: |
        attached to the existing interpreter
  isError: false
---
send:
  r: reticulate::py_eval("id(early_object) == early_identity")
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
