---
send:
  control: restart
  requirements:
    python_version:
      - <selected Python version>
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(
      "mcpconsoleearlypython" %in% getOption("defaultPackages"),
      identical(isTRUE(reticulate::py_config()$ephemeral), TRUE),
      identical(search()[[2L]], "tools:mcp-console"),
      identical(find("py")[[1L]], "tools:mcp-console"),
      identical(find(".console")[[1L]], "tools:mcp-console")
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import json
    import subprocess

    if not True:
        assert os.path.samefile(sys.executable, os.environ["MCP_CONSOLE_TEST_PYTHON"])
        assert os.path.realpath(sys.prefix) == os.path.realpath(
            os.environ["MCP_CONSOLE_TEST_PYTHON_PREFIX"]
        )
    assert id(early_object) == early_identity
    assert sys.executable == early_executable
    assert (
        sys.prefix,
        sys.exec_prefix,
        sys.base_prefix,
        sys.base_exec_prefix,
    ) == early_prefixes
    assert os.environ["PATH"] == early_path
    child = json.loads(
        subprocess.check_output([sys.executable, "-c", early_child_program], text=True)
    )
    assert child == early_child, (child, early_child)
    print("attached to the existing interpreter")
result:
  content:
    - type: text
      text: |
        attached to the existing interpreter
  isError: false
---
send:
  r: reticulate::py_eval("id(early_object) == early_identity")
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  python: >-
    import yaml12; assert id(early_object) == early_identity; print('adopted
    interpreter resolved import')
result:
  content:
    - type: text
      text: |
        [resolved PyPI distribution 'py-yaml12' for Python import 'yaml12']
        adopted interpreter resolved import
  isError: false
