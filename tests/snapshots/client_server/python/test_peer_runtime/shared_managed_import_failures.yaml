---
scenario: Recover from failed and cancelled automatic Python preparation.
fixture: >-
  R is available. A wrapper around real uv fails one resolution, then
  blocks another behind FIFOs so the client can interrupt it. The accepted
  state is checked before a successful retry.
---
!same-as automatic MCP initialization for this execution mode
---
send:
  python: import os; worker_pid = os.getpid(); steps = []; identity = object()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "dbplyr",
              "dplyr",
              "duckdb",
              "ggplot2",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - dbplyr
        - dplyr
        - duckdb
        - ggplot2
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  python: steps.append('failure'); import yaml12
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
        ModuleNotFoundError: No module named 'yaml12'.

        MCP Console inferred the PyPI distribution `py-yaml12` from the import `yaml12`, but automatic package resolution failed:

        managed Python resolution failed:
        resolver input:
        {
          "python": "<running Python>",
          "packages": [
            "numpy",
            "pandas",
            "matplotlib",
            "plotnine",
            "py-yaml12"
          ]
        }
        uv output:
        fixture Python resolution failed

        Import names and PyPI distribution names can differ. Retry with the correct distribution declared through `requirements.python` in the `send` call, for example:

        requirements: {"python": ["py-yaml12"]}
  isError: false
