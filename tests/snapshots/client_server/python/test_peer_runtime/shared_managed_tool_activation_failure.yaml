---
scenario: Withhold submitted code when live Python activation fails.
fixture: >-
  R is available. The uv fixture injects an activation failure while fd 2
  is redirected to a temporary file. The case checks sideband diagnostic
  delivery and preservation of accepted requirements.
---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import os, tempfile

    identity = object()
    original_stderr = os.dup(2)
    raw_stderr = tempfile.TemporaryFile()
    _ = os.dup2(raw_stderr.fileno(), 2)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
