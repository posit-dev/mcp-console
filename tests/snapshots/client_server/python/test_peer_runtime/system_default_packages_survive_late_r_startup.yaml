---
!same-as python-only MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "arrow",
              "dbplyr",
              "dplyr",
              "duckdb",
              "ggplot2",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - arrow
        - dbplyr
        - dplyr
        - duckdb
        - ggplot2
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: invisible(NULL)
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(
      "mcpconsoleearlypython" %in% getOption("defaultPackages"),
      identical(isTRUE(reticulate::py_config()$ephemeral), FALSE),
      identical(search()[[2L]], "tools:mcp-console"),
      identical(find("py")[[1L]], "tools:mcp-console"),
      identical(find(".console")[[1L]], "tools:mcp-console")
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import json
    import subprocess

    if not False:
        assert os.path.samefile(sys.executable, os.environ["MCP_CONSOLE_TEST_PYTHON"])
        assert os.path.realpath(sys.prefix) == os.path.realpath(
            os.environ["MCP_CONSOLE_TEST_PYTHON_PREFIX"]
        )
    assert id(early_object) == early_identity
    assert sys.executable == early_executable
    assert (
        sys.prefix,
        sys.exec_prefix,
        sys.base_prefix,
        sys.base_exec_prefix,
    ) == early_prefixes
    assert os.environ["PATH"] == early_path
    child = json.loads(
        subprocess.check_output([sys.executable, "-c", early_child_program], text=True)
    )
    assert child == early_child, (child, early_child)
    print("attached to the existing interpreter")
result:
  content:
    - type: text
      text: |
        attached to the existing interpreter
  isError: false
---
send:
  r: reticulate::py_eval("id(early_object) == early_identity")
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
