---
!same-as r-only MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: |
    initial <- py_require()
    stopifnot(identical(initial, reticulate::py_require()))
    result <- withVisible(py_require(c("packaging", "six"), action = "set"))
    stopifnot(!result$visible, is.null(result$value))
    py_require("numpy")
    stopifnot(
      identical(sort(py_require()$packages), c("numpy", "packaging", "six")),
      identical(tail(py_require()$history, 1L)[[1L]]$requested_from, "R_GlobalEnv"),
      !reticulate::py_available(initialize = FALSE)
    )
    cat("requirements declared without Python\n")
result:
  content:
    - type: text
      text: |
        requirements declared without Python
  isError: false
