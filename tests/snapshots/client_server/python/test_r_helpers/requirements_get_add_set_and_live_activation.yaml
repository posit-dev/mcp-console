send:
  r: |
    py_require("py-yaml12")
    stopifnot(
      identical(py_import("yaml12")$`__name__`, "yaml12"),
      py_eval("id(bridge_object) == bridge_identity"),
      identical(sort(py_require()$packages), c("packaging", "py-yaml12"))
    )
    accepted <- py_require()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
