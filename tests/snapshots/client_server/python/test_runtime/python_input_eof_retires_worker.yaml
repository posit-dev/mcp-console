---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    eof_gate <- tempfile("python-input-eof-")
    cat(eof_gate)
result:
  content:
    - type: text
      text: <Python EOF checkpoint>
  isError: false
---
send:
  python: |
    import os

    gate_path = r.eof_gate
    eof_marker = object()
    input("ready for EOF> ")
    reader, writer = os.pipe()
    os.close(writer)
    os.dup2(reader, 0)
    os.close(reader)
    try:
        input("EOF> ")
    except EOFError:
        print("Python input reached EOF")
    with open(gate_path, "rb", buffering=0) as gate:
        assert gate.read(1) == b"1"
result:
  content:
    - type: text
      text: |-
        [input requested: "ready for EOF> "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: "\n"
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [input requested: "EOF> "]
        Python input reached EOF

        [elapsed: <elapsed>s since admission]
        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 0]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  python: '"eof_marker" in globals()'
result:
  content:
    - type: text
      text: |
        False
  isError: false
