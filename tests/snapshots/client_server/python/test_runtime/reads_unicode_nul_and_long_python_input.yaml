---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    saved_object = object()
    original_object = saved_object
    first = input("unicode> ")
    second = input("long> ")
    third = input("queued> ")
    assert first == "Zażółć 🐍\0fin"
    assert second == "🐍" * 4097 + "\0tail"
    assert third == "queued"
    print(len(first), len(second), third)
result:
  content:
    - type: text
      text: |-
        [input requested: "unicode> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  stdin:
    text_bytes: 16421
    concat:
      - "Zażółć 🐍\0fin\n"
      - repeat: 🐍
        count: 4097
      - "\0tail\nqueued\n"
result:
  content:
    - type: text
      text: |
        [input requested: "long> "]
        [input requested: "queued> "]
        12 4102 queued
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    try:
        input("partial> ")
    except KeyboardInterrupt:
        print("input interrupted")
  stdin:
    text_bytes: 4107
    concat:
      - repeat: 🐍
        count: 1025
      - "\0prefix"
result:
  content:
    - type: text
      text: |-
        [input requested: "partial> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        input interrupted
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    replayed = input("replay> ")
    assert replayed == "🐍" * 1025 + "\0prefix!"
    print("complete input retained")
  stdin: |
    !
result:
  content:
    - type: text
      text: |
        [input requested: "replay> "]
        complete input retained
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: saved_object is original_object
result:
  content:
    - type: text
      text: |
        True
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
