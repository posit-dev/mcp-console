---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    bridge_plot <- function() {
      plot(1:3)
      invisible(NULL)
    }
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    print("before plot")
    r.bridge_plot()
    print("after plot")
result:
  content:
    - type: text
      text: |
        before plot
        after plot
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
