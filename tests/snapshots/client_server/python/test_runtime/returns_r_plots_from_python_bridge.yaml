---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    bridge_plot <- function() {
      plot(1:3)
      invisible(NULL)
    }
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    print("before plot")
    r.bridge_plot()
    print("after plot")
result:
  content:
    - type: text
      text: |
        before plot
        after plot
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
