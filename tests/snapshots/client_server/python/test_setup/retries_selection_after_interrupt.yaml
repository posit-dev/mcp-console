---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    r_marker <- 41L
    invisible(suppressMessages(base::trace(
      "py_discover_config",
      tracer = quote({
        if (
          !exists(
            "selection_interrupted",
            envir = .GlobalEnv,
            inherits = FALSE
          )
        ) {
          assign("selection_interrupted", TRUE, envir = .GlobalEnv)
          stop(base::structure(
            base::list(message = "synthetic selection interrupt", call = NULL),
            class = c("interrupt", "condition")
          ))
        }
      }),
      print = FALSE,
      where = asNamespace("reticulate")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    raise AssertionError("interrupted selection ran the cell")
result:
  content:
    - type: text
      text: |
        Error: synthetic selection interrupt
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: r.r_marker + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
