---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    original_environment <- Sys.getenv(
      c(
        "VIRTUAL_ENV",
        "R_SESSION_INITIALIZED",
        "PYTHONIOENCODING",
        "PATH",
        "LD_LIBRARY_PATH",
        "PYTHONPATH"
      ),
      unset = NA_character_
    )
    selection_serializations <- 0L
    invisible(suppressMessages(base::trace(
      "fromJSON",
      tracer = quote({
        if (
          is.character(txt) && length(txt) == 1L && startsWith(txt, '{"embedding":')
        ) {
          selection_serializations <<- selection_serializations + 1L
          if (selection_serializations == 1L) {
            base::stop(base::structure(
              base::list(
                message = "synthetic serialization interrupt",
                call = NULL
              ),
              class = c("interrupt", "condition")
            ))
          }
        }
      }),
      print = FALSE,
      where = asNamespace("jsonlite")
    )))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: raise AssertionError('interrupted selection ran the cell')
result:
  content:
    - type: text
      text: |
        Error: synthetic serialization interrupt
  isError: false
---
send:
  r: |
    stopifnot(!reticulate::py_available(initialize = FALSE))
    stopifnot(identical(
      Sys.getenv(names(original_environment), unset = NA_character_),
      original_environment
    ))
    42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  python: |
    42
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: stopifnot(selection_serializations == 2L); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
