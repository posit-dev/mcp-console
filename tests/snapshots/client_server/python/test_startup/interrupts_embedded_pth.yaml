---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: never_run = True
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |-
        [input requested: "startup interrupt> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 140, in initialize_site
          File "<frozen site>", line <line>, in main
          File "<frozen site>", line <line>, in venv
          File "<frozen site>", line <line>, in addsitepackages
          File "<frozen site>", line <line>, in addsitedir
          File "<frozen site>", line <line>, in addpackage
          File "<string>", line 1, in <module>
          File "<site-packages>/console_startup.py", line 15, in <module>
            input("startup interrupt> ")
          File "<string>", line 55, in _console_input
        KeyboardInterrupt
  isError: false
---
send:
  python: |
    import builtins
    import os

    assert os.getpid() == <worker pid>
    assert builtins.startup_attempts == 2
    "never_run" in globals()
result:
  content:
    - type: text
      text: |
        False
  isError: false
---
send:
  python: builtins.startup_attempts
result:
  content:
    - type: text
      text: |
        2
  isError: false
