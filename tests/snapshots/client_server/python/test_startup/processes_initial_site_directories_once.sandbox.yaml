---
!same-as python-only-writable MCP initialization for this execution mode
---
send:
  python: |
    import builtins
    import sys

    assert sys.flags.no_site == 0
    builtins.console_startups == 2
result:
  content:
    - type: text
      text: |
        True
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
