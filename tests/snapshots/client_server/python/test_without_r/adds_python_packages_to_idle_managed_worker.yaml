    import more_itertools, six, yaml12

    assert "identity" not in globals()
    assert (
        subprocess.check_output(
            ["python", "-c", "import more_itertools, six, yaml12; print('child ready')"],
            text=True,
        ).strip()
        == "child ready"
    )
    print("plain restart retained additions")
