  control: restart
  requirements:
    python:
      - ./local-package
  stdin: |
    invalid input
result:
  content:
    - type: text
      text: >-
        Python requirement `./local-package` is not accepted: host-side managed
        resolution accepts named package requirements only
  isError: true
