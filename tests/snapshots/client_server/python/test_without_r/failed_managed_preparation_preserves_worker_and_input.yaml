      text: |
        42
  isError: false
---
send:
  control: restart
  requirements:
    python:
      - py-yaml12
  stdin: |
    must not reach old worker
  python: |
    raise AssertionError("failed restart ran code")
result:
  content:
    - type: text
      text: |-
        [managed Python resolution failed:
        resolver input:
        {
          "python": "3.13.XX (reticulate default)",
          "packages": [
            "numpy",
            "pandas",
            "matplotlib",
            "plotnine",
            "duckdb",
            "py-yaml12"
          ]
        }
        uv output:
        fixture Python resolution failed]
  isError: true
