send:
  control: restart
  requirements:
    python:
      - more-itertools
  stdin: |
    replacement input
  timeout_ms: 0
  python: |
    assert "identity" not in globals()
    print(input())
result:
  content:
    - type: text
      text: |-
        Traceback (most recent call last):
          File "<mcp-console:python:e5>", line 1, in <module>
        EOFError
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [input requested: ""]
        replacement input
        [done]
  isError: false
