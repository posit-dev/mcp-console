---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: >-
    import os, sys; assert sys.executable ==
    os.environ['RETICULATE_PYTHON']; identity = object(); identity_id =
    id(identity); 42
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    python:
      - py-yaml12
