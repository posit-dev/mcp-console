---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import os
    import sys

    assert os.environ["RETICULATE_PYTHON"] == sys.executable
    print("explicit selection retained")
result:
  content:
    - type: text
      text: |
        explicit selection retained
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: restart
  python: |
    import os
    import sys

    assert os.environ["RETICULATE_PYTHON"] == sys.executable
    print("explicit selection retained")
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        explicit selection retained
        [done]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
