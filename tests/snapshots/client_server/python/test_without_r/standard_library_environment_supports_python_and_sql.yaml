---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import importlib.util
    import statistics

    assert all(
        importlib.util.find_spec(package) is None
        for package in ("numpy", "pandas", "matplotlib", "duckdb")
    )
    values = [2, 4, 6]
    statistics.mean(values)
result:
  content:
    - type: text
      text: |
        4
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: values.append(8); statistics.mean(values)
result:
  content:
    - type: text
      text: |
        5
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
