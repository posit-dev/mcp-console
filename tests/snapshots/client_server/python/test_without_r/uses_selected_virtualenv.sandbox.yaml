---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import os
    import sys
    import tempfile
    from pathlib import Path
    import matplotlib.pyplot as plt

    assert os.environ["RETICULATE_PYTHON"] == sys.executable
    assert sys.prefix != sys.base_prefix
    value = 40
    temporary = Path(tempfile.gettempdir())
    (temporary / "owned.txt").write_text("owned")
    print(temporary)
result:
  content:
    - type: text
      text: |
        <worker temporary>
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: value += 1; print('before error'); raise ValueError('recoverable')
result:
