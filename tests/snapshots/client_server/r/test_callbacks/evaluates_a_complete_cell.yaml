---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    answer <- 40
    answer + 1
    answer + 2
    cat("done\n")
    invisible(99)
result:
  content:
    - type: text
      text: |
        [1] 41
        [1] 42
        done
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    identical(
      as.vector(splines::splineDesign(
        knots = c(0, 0, 0, 0, 1, 1, 1, 1),
        x = 0.5
      )),
      c(0.125, 0.375, 0.375, 0.125)
    )
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: stop("boom")
