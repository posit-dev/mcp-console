---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - later
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    callback_gate <- tempfile("mcp-console-callback-gate-")
    callback_checkpoint <- tempfile("mcp-console-callback-checkpoint-")
    run_callback <- function() {
      if (!file.exists(callback_gate)) {
        later::later(run_callback, delay = 0.01)
        return(invisible(NULL))
      }
      cat("idle plot\n")
      plot(1:3)
      stopifnot(file.create(callback_checkpoint))
    }
    later::later(run_callback, delay = 0.01)
    cat(callback_gate, callback_checkpoint, sep = "\n")
result:
  content:
    - type: text
      text: |-
        <worker callback gate>
        <worker callback checkpoint>
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  session: default
result:
  content:
    - type: text
      text: |
        idle plot
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
