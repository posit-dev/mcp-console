---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(identical(ls(all.names = TRUE), character()))
    stopifnot(length(capture.output(?consolehelp::topic)) > 10L)
    browser_error <- tryCatch(getOption("browser")(), error = identity)
    stopifnot(identical(conditionMessage(browser_error), "browser invoked"))
    rm(browser_error)
    cat("documentation defaults installed after native profiles\n")
result:
  content:
    - type: text
      text: |
        documentation defaults installed after native profiles
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    options(pager = function(...) cat("user pager\n"), help_type = "text")
result:
