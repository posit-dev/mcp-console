---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    r_input_state <- 41L
    tryCatch(
      readline("R interrupt> "),
      interrupt = function(condition) cat("R input interrupted\n")
    )
  stdin: R partial
result:
  content:
    - type: text
      text: |-
        [input requested: "R interrupt> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |
        R input interrupted
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: readline("R replay> ")
  stdin: |
    !
result:
  content:
    - type: text
      text: |
        [input requested: "R replay> "]
        [1] "R partial!"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    suspended_input <- "not read"
    suspendInterrupts({
      suspended_input <- readline("R suspended> ")
      cat("suspended input accepted")
    })
result:
  content:
    - type: text
      text: |-
        [input requested: "R suspended> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
