---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    quit(save = "no", status = 33L, runLast = FALSE)
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 33]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
session_bundles:
  - <recording>/sessions/session-001
---
send:
  r: 1 + 1
result:
  content:
    - type: text
      text: |
        [1] 2
  isError: false
session_bundles:
  - <recording>/sessions/session-002
