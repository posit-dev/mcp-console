---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    dyn.load("./mcp_test_input_handler.so")
    invisible(.Call(
      "mcp_test_register_input_handler",
      file.path(tempdir(), "direct-stdin-boundary-fifo"),
      function() {
        connection <- suppressWarnings(file("/dev/stdin"))
        on.exit(close(connection))
        stopifnot(file.create(file.path(
          tempdir(),
          "direct-stdin-boundary-checkpoint"
        )))
        readLines(connection, n = 1)
        cat("direct callback released\n")
      }
    ))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: cat("direct stdin cell ran\n")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        direct callback released
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
