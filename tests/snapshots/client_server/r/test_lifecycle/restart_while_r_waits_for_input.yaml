---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    restart_marker <- TRUE
    readline("restart> ")
result:
  content:
    - type: text
      text: |-
        [input requested: "restart> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [1] ""
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: exists("restart_marker", inherits = FALSE)
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
