---
!same-as MCP initialization for this execution mode
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: |
    while (!file.exists("release-evaluation")) {
      Sys.sleep(0.01)
    }
    answer <- 42
    answer
  timeout_ms: 10
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  timeout_ms: 3000
  session: default
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  r: answer + 1
result:
  content:
    - type: text
      text: |
        [1] 43
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
