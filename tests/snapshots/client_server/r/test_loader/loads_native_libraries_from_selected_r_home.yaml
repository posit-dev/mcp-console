---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.direct.yaml
---
send:
  r: |
    dyn.load("loader_probe.so")
    local({
      con <- fifo("loader-release", "rb", blocking = TRUE)
      on.exit(close(con))
      stopifnot(identical(readBin(con, "raw", 1L), charToRaw("1")))
    })
    .C("loader_probe", result = 0L)$result
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
