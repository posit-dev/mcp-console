---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: native_location
result:
  content:
    - type: text
      text: |
        [1] "directory"
  isError: false
session_bundles:
  - <recording>/sessions/session-001
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: native_location
result:
  content:
    - type: text
      text: |
        [1] "home"
  isError: false
session_bundles:
  - <recording>/sessions/session-002
