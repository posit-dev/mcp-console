---
!same-as r-only-writable MCP initialization for this execution mode
---
send:
  r: stop("interrupted startup ran cell")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output; phase: startup]
        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |-
        R library inspection resolution cancelled
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 1]
        [worker stopped: in-memory state lost]
        [startup may have executed; explicit restart required]
  isError: true
---
send:
  r: stop("incomplete R startup retried")
result:
  content:
    - type: text
      text: "[startup may have executed; explicit restart required]"
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: 6L * 7L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
