---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(
      native_profile,
      native_first,
      identical(restored_value, 42L),
      identical(getOption("width"), 73L),
      identical(getOption("defaultPackages"), "utils"),
      "package:utils" %in% search(),
      !("package:stats" %in% search()),
      interactive(),
      "--no-save" %in% commandArgs(),
      !("--vanilla" %in% commandArgs())
    )
    cat("native startup complete\n")
result:
  content:
    - type: text
      text: |
        native startup complete
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    stopifnot(
      native_profile,
      native_first,
      identical(restored_value, 42L),
      identical(getOption("width"), 73L),
      identical(getOption("defaultPackages"), "utils"),
      "package:utils" %in% search(),
      !("package:stats" %in% search()),
      interactive(),
      "--no-save" %in% commandArgs(),
      !("--vanilla" %in% commandArgs())
    )
    cat("native startup complete\n")
result:
  content:
    - type: text
      text: |
        native startup complete
  isError: false
---
send:
  r: native_edited
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  r: restored_value <- 99L
result:
  content:
    - type: text
      text: "[done]"
  isError: false
