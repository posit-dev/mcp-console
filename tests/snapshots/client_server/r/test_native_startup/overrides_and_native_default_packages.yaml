---
!same-as r-only MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(
      identical(native_order, "user first"),
      identical(getOption("defaultPackages"), "utils"),
      "package:utils" %in% search(),
      !("package:stats" %in% search())
    )
    cat("native overrides and package selection retained\n")
result:
  content:
    - type: text
      text: |
        native overrides and package selection retained
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
