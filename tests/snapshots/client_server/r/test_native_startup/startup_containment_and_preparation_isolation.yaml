---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.r-only-writable.yaml
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: |
        native profile contained
  isError: false
---
send:
  control: restart
  requirements:
    action: set
    r:
      - MASS
  r: |
    reached <- fifo(
      Sys.getenv("MCP_CONSOLE_TEST_CELL_REACHED"),
      "wb",
      blocking = TRUE
    )
    writeBin(charToRaw("1"), reached)
    close(reached)
    release <- fifo(
      Sys.getenv("MCP_CONSOLE_TEST_CELL_RELEASE"),
      "rb",
      blocking = TRUE
    )
    invisible(readBin(release, "raw", 1L))
    close(release)
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        native profile contained
        [done]
  isError: false
