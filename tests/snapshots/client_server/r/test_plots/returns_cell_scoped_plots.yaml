---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    options(
      console.plot.width_in = 4,
      console.plot.height_in = 3,
      console.plot.dpi = 100
    )
    cat("before plots\n")
    local({
      plot(1:3)
      cat("after first plot\n")
      lines(3:1, col = "red")
      plot(3:1)
      cat("after second plot\n")
    })
result:
  content:
    - type: text
      text: |
        before plots
        after first plot
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
    - type: text
      text: |
        after second plot
    - type: image
      data: <PNG byte-identical to live Rscript page 2>
      mimeType: image/png
  isError: false
---
send:
  r: lines(1:3)
result:
  content:
    - type: text
      text: |
        Error in plot.xy(xy.coords(x, y), type = type, ...) : 
          plot.new has not been called yet
  isError: false
---
send:
  r: plot(3:1)
result:
  content:
    - type: image
      data: <PNG byte-identical to live Rscript page 1>
      mimeType: image/png
  isError: false
