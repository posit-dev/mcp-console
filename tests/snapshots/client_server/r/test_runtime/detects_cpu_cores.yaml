---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    cores <- parallel::detectCores()
    stopifnot(
      length(cores) == 1L,
      !is.na(cores),
      cores >= 1L
    )
    writeLines("R core detection available")
result:
  content:
    - type: text
      text: |
        R core detection available
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
