---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import ctypes
    import os

    try:
        initialized = bool(ctypes.c_void_p.in_dll(ctypes.CDLL(None), "R_GlobalEnv").value)
    except ValueError:
        initialized = False
    assert not initialized, "R initialized before Python demand"
    r_paths = {
        name: os.environ[name]
        for name in ("R_HOME", "R_SHARE_DIR", "R_INCLUDE_DIR", "R_DOC_DIR")
    }
    os.environ.pop("R_HOME")
    os.environ["R_SHARE_DIR"] = "/missing-r-share"
    os.environ.pop("R_INCLUDE_DIR")
    os.environ["R_DOC_DIR"] = "/missing-r-doc"
    print("Python changed R paths before R initialization")
result:
  content:
    - type: text
      text: |
        Python changed R paths before R initialization
  isError: false
---
send:
  python: >-
    _ = r['names <- c("R_SHARE_DIR", "R_INCLUDE_DIR",
    "R_DOC_DIR")\ndirectories <-
    Sys.getenv(names)\nstopifnot(\n  identical(Sys.getenv("R_HOME"),
    R.home()),\n  all(dir.exists(directories)),\n  identical(\n    unname(directories),\n    vapply(\n      c("share",
    "include", "doc"),\n      R.home,\n      "",\n      USE.NAMES =
    FALSE\n    )\n  ),\n  file.exists(file.path(R.home("include"),
    "R.h")),\n  length(readLines(file.path(R.home("doc"), "AUTHORS"))) >
    0L\n)\nchild <-
    system2(\n  commandArgs()[1L],\n  c(\n    "--vanilla",\n    "--slave",\n    "-e",\n    shQuote(\n      \'cat(Sys.getenv(c("R_SHARE_DIR",
    "R_INCLUDE_DIR", "R_DOC_DIR")), sep = "\\n")\'\n    )\n  ),\n  stdout =
    TRUE,\n  stderr = TRUE\n)\nstopifnot(is.null(attr(child, "status")),
    identical(child, unname(directories)))\ncat("R and its children use the
    selected resource directories\\n")\n']
result:
  content:
    - type: text
      text: |
        R and its children use the selected resource directories
  isError: false
---
send:
  python: |
    native = ctypes.CDLL(None)
    native.getenv.argtypes = [ctypes.c_char_p]
    native.getenv.restype = ctypes.c_char_p
    assert all(
        native.getenv(name.encode()) == os.fsencode(path) for name, path in r_paths.items()
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
