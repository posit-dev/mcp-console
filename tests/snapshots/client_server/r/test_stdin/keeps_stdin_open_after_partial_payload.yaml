---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - DBI
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    cat("before\n")
    value <- readline("partial> ")
    value
  stdin: without newline
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |-
        before
        [input requested: "partial> "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: "\n"
result:
  content:
    - type: text
      text: |
        [1] "without newline"
  isError: false
---
send:
  r: |
    readline("next> ")
  stdin: |
    next
result:
  content:
    - type: text
      text: |
        [input requested: "next> "]
        [1] "next"
  isError: false
