---
!same-as MCP initialization for this execution mode
---
send:
  stdin: |
    cold fd 0
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: |
    local({
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      readLines(connection, n = 1)
    })
result:
  content:
    - type: text
      text: |
        [1] "cold fd 0"
  isError: false
---
send:
  r: |
    prompted <- readline("bundled> ")
    direct <- local({
      connection <- suppressWarnings(file("/dev/stdin"))
      on.exit(close(connection))
      readLines(connection, n = 1)
    })
    paste(prompted, direct, sep = "|")
  stdin: |
    café
  timeout_ms: 50
result:
  content:
    - type: text
      text: |-
        [input requested: "bundled> "]

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  stdin: "timed out "
  timeout_ms: 50
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  stdin: |
    fd 0
  timeout_ms: 3000
result:
  content:
    - type: text
      text: |
        [1] "café|timed out fd 0"
  isError: false
