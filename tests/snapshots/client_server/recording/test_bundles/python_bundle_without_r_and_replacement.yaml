---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print('original')
result:
  content:
    - type: text
      text: |
        original
  isError: false
session_bundles:
  - <recording>/sessions/session-001
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print('replacement')
result:
  content:
    - type: text
      text: |
        replacement
  isError: false
session_bundles:
  - <recording>/sessions/session-002
