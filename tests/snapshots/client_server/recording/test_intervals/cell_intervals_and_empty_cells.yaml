---
!same-as custom MCP initialization for this execution mode
---
send:
  r: record intervals
result:
  content:
    - type: text
      text: |
        startup text
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        before image
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after image
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |
        between cells
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: complete silently
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: rejected source
  typo: true
result:
  content:
    - type: text
      text: >-
        failed to deserialize parameters: unknown field `typo`, expected one of
        `r`, `python`, `sql`, `note`, `control`, `requirements`, `stdin`,
        `timeout_ms`
  isError: true
---
send:
  control: restart
  r: complete silently
result:
  content:
    - type: text
      text: |
        shutdown text
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |

        [worker stopped: in-memory state lost]
        [starting new worker]
        startup text
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |-

        [done]
  isError: false
