---
!same-as custom MCP initialization for this execution mode
---
send:
  r: overflow image retention
result:
  content:
    - type: text
      text: |

        [output omitted: 10 images (83886120 encoded bytes); retained images: .agents/console/sessions/<recording ID>/capture/sessions/001/]
    - type: image
      data: <4 MiB of zero bytes, verified byte-for-byte>
      mimeType: image/png
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: preview image limit
result:
  content:
