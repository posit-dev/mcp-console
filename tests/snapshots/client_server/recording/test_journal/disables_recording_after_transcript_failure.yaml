---
!same-as custom MCP initialization for this execution mode
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
---
send:
  r: emit image
result:
  content:
    - type: text
      text: |
        before image
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after image
  isError: false
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
---
journal after failure:
  - recording_started
  - tool_call
  - cell_output
  - tool_result
  - tool_call
complete final line: true
post-failure append: false
server stderr: >-
  mcp-console: transcript recording disabled: <artifact persistence
  failed>
