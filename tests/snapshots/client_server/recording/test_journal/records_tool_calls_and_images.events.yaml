---
- event: recording_started
  working_directory: <workspace>
  dynamic_resolution: ~
  python_preparation: ~
  startup_requirements: ~
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_call
  call_id: 1
  request_id: <request ID>
  request:
    name: send
    arguments:
      r: emit image
      stdin: |
        recorded stdin
      requirements:
        r:
          - praise
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: artifact_created
  artifact_id: 1
  call_id: 1
  path: artifacts/call-000001-image-000001.png
  mime_type: image/png
  bytes: 68
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: cell_output
  call_id: 1
  path: outputs/call-000001.log
  retained_bytes: 25
  inline_omitted_bytes: 0
  discarded_bytes: 0
  retention_limit_bytes: 1073741824
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_result
  call_id: 1
  result:
    content:
      - type: text
        text: |
          before image
      - type: image
        mimeType: image/png
        artifactId: 1
        path: artifacts/call-000001-image-000001.png
      - type: text
        text: |
          after image
    isError: false
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_call
  call_id: 2
  request_id: <request ID>
  request:
    _meta:
      progressToken: record-me
    name: send
    arguments:
      r: "1"
      python: "1"
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_result
  call_id: 2
  result:
    content:
      - type: text
        text: only one of `r`, `python`, or `sql` may be supplied
    isError: true
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_call
  call_id: 3
  request_id: <request ID>
  request:
    name: send
    arguments:
      requirements:
        python:
          - transcript-fixture
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
- event: tool_result
  call_id: 3
  result:
    content:
      - type: text
        text: Python requirements are unavailable with a custom worker
    isError: true
  run_id: <run ID>
  sequence: <capture sequence>
  at: <UTC timestamp>
---
produced session:
  root: .agents/console/sessions/<run ID>
  files:
    - internal/events.jsonl
    - transcript.md
    - transcript.qmd
    - artifacts/call-000001-image-000001.png
    - outputs/call-000001.log
