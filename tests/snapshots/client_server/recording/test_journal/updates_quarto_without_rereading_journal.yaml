---
!same-as custom MCP initialization for this execution mode
---
send:
  r: echo first
result:
  content:
    - type: text
      text: |
        zod: first
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: echo second
result:
  content:
    - type: text
      text: |
        zod python: second
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
quarto projection:
  updated from incremental state: true
  journal reopened for reading: false
