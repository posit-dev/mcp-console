---
!same-as custom MCP initialization for this execution mode
---
send:
  r: echo ready
result:
  content:
    - type: text
      text: |
        zod: ready
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: request input
result:
  content:
    - type: text
      text: |-
        [input requested: "zod> "]
        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    supplied answer
result:
  content:
    - type: text
      text: |
        zod stdin: supplied answer
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  r: preview huge line
result:
  content:
    - type: text
      text: |
        preview head
        
        [output omitted: 16769343 UTF-8 bytes; raw log: .agents/console/sessions/<recording ID>/capture/sessions/001/cell-003.txt]
        
        preview tail: final diagnostic
    - type: image
      data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
      mimeType: image/png
    - type: text
      text: |
        after final image
  isError: false
