---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print('default')
result:
  content:
    - type: text
      text: |
        default
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  note: Record beta's question before starting its worker.
  session: beta
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      note: Record beta's question before starting its worker.
---
send:
  python: print('alpha')
  session: alpha
result:
  content:
    - type: text
      text: |
        alpha
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  python: print('beta')
  note: Run beta's initial measurement.
  session: beta
result:
  content:
    - type: text
      text: |
        beta
  isError: false
  _meta:
    posit.mcp-console/send:
      note: Run beta's initial measurement.
      language: python
---
send:
  note: Alpha has completed its baseline.
  session: alpha
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      note: Alpha has completed its baseline.
---
send:
  note: The default measurement is complete.
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      note: The default measurement is complete.
