---
!same-as python-only MCP initialization for this execution mode
---
input:
  method: ping
result: {}
---
send:
  r: must not execute
  python: must not execute
result:
  content:
    - type: text
      text: only one of `r`, `python`, or `sql` may be supplied
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  session: default
result:
  content:
    - type: text
      text: |
        retained startup text
    - type: image
      data: <verified startup PNG>
      mimeType: image/png
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  stdin: unused input
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
