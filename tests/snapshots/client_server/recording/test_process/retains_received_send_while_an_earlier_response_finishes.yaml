---
!same-as existing-python MCP initialization for this execution mode
---
send:
  python: pass
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    from pathlib import Path

    with Path('<workspace>/cell-entered').open('wb', buffering=0) as gate:
        gate.write(b'1')
    with Path('<workspace>/cell-release').open('rb', buffering=0) as gate:
        assert gate.read(1) == b'1'
    print('first response')
result:
  content:
    - type: text
      text: |
        first response
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
