---
!same-as existing-python MCP initialization for this execution mode
---
send:
  python: |
    from pathlib import Path

    with Path('<workspace>/cell-entered').open('wb', buffering=0) as gate:
        gate.write(b'1')
    with Path('<workspace>/cell-release').open('rb', buffering=0) as gate:
        assert gate.read(1) == b'1'
    print('first response')
result:
  content:
    - type: text
      text: |
        first response
  isError: false
---
send:
  python: 21 * 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
