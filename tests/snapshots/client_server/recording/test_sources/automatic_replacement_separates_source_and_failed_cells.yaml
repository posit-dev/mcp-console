---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: print('original session')
result:
  content:
    - type: text
      text: |
        original session
  isError: false
---
send:
  python: import os; os._exit(17)
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker exited with status 17]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  python: print('automatic replacement')
result:
  content:
    - type: text
      text: |
        automatic replacement
  isError: false
---
send:
  python: raise ValueError('retained failure')
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
        ValueError: retained failure
  isError: false
