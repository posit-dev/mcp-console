---
send:
  stdin: |
    kept
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: (marker, answer)
result:
  content:
    - type: text
      text: |
        (42, 'kept')
  isError: false
---
send:
  control: restart
  requirements:
    action: set
    python:
      - six
  python: import six; six.__name__
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        'six'
        [done]
  isError: false
