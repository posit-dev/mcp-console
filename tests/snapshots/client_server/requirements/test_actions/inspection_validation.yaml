      text: >-
        requirements.action=get/reset takes no package lists or constraint
        fields
  isError: true
---
send:
  requirements:
    r: ~
    action: get
result:
  content:
    - type: text
      text: >-
        failed to deserialize parameters: invalid type: null, expected a
        sequence
  isError: true
---
send:
  requirements:
    python_version: ~
    action: get
result:
  content:
    - type: text
      text: >-
        failed to deserialize parameters: invalid type: null, expected a
