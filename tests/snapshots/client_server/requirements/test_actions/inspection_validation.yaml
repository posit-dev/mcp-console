---
send:
  requirements: {}
result:
  content:
    - type: text
      text: >-
        at least one of `requirements.r`, `requirements.python`, or
        `requirements.duckdb` is required
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
