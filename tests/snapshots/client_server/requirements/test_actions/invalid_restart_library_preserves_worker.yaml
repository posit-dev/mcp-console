---
!same-as MCP initialization for this execution mode
---
send:
  control: restart
  requirements:
    action: set
    r:
      - praise
    python: []
    duckdb: []
  r: worker_pid <- Sys.getpid(); libraries <- .libPaths()
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [done]
  isError: false
---
send:
  control: restart
  requirements:
    action: set
    r:
      - consolefirst
    duckdb: []
result:
  content:
    - type: text
      text: >-
        resolved R library path contains wildcard characters. Use a library
        directory without glob syntax
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "praise"
            ],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - praise
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: >-
    stopifnot(identical(Sys.getpid(), worker_pid), identical(.libPaths(),
    libraries))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
