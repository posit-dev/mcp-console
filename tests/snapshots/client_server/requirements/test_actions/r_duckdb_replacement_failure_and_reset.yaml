          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - praise
      python:
        - six
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
