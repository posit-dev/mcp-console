        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: marker <- 42L; pid <- Sys.getpid()
  requirements:
    action: set
result:
  content:
    - type: text
      text: "[done]"
  isError: false
