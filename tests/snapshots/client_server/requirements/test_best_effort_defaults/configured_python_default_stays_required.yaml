---
scenario: >-
  A configured Python package stays required even when it is a built-in
  default.
fixture: >-
  python.managed.packages explicitly requests plotnine; the uv wrapper
  rejects it.
---
!same-as MCP initialization for this execution mode
---
send:
  python: raise AssertionError('must not execute')
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "3.13.XX (reticulate default)",
          "packages": [
            "plotnine"
          ]
        }
        uv output:
        synthetic uv failure
  isError: true
