---
scenario: A built-in Python convenience package cannot be installed, without R.
fixture: >-
  The uv wrapper fails every request containing plotnine; other
  preparation uses real uv.
---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: answer = 40; print(answer + 2)
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        skipping default Python package `plotnine`: managed Python resolution failed:
        resolver input:
        {
          "python": "3.13.XX (reticulate default)",
          "packages": [
            "numpy",
            "pandas",
            "matplotlib",
            "plotnine"
          ]
        }
        uv output:
        synthetic uv failure
        [output produced while idle]
        42
  isError: false
---
send:
  python: import numpy; print('Python default available')
result:
  content:
    - type: text
      text: |
        Python default available
  isError: false
---
send:
  requirements:
    python:
      - plotnine
  python: answer = 0
result:
  content:
    - type: text
      text: |-
        managed Python resolution failed:
        resolver input:
        {
          "python": "<running Python>",
          "packages": [
            "numpy",
            "pandas",
            "matplotlib",
            "plotnine",
            "duckdb"
          ]
        }
        uv output:
        synthetic uv failure
  isError: true
