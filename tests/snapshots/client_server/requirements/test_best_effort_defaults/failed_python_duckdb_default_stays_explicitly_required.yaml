---
scenario: A default extension fails in a Python-only session.
fixture: >-
  uv selects a seeded DuckDB environment whose sitecustomize fixture
  rejects sqlite only in extension preparation.
---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: answer = 40; print(answer + 2)
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        skipping default DuckDB extension `sqlite`: DuckDB extension resolution failed with exit status: 1: fixture DuckDB extension sqlite is unavailable
        [output produced while idle]
        42
  isError: false
---
send:
  requirements:
    duckdb:
      - sqlite
  python: answer = 0
result:
  content:
    - type: text
      text: >-
        DuckDB extension resolution failed with exit status: 1: fixture DuckDB
        extension sqlite is unavailable
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: answer + 2
result:
  content:
    - type: text
      text: |
        42
  isError: false
