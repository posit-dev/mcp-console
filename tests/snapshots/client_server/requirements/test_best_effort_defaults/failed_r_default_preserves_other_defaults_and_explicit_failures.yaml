---
scenario: A built-in R convenience package cannot be installed.
fixture: >-
  The ir wrapper fails every request containing tidyverse; other
  preparation uses real ir.
---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "dbplyr",
              "dplyr",
              "duckdb",
              "ggplot2",
              "nanoarrow",
              "reticulate",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - dbplyr
        - dplyr
        - duckdb
        - ggplot2
        - nanoarrow
        - reticulate
        - yyjsonr
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  python: answer = 40; print(answer + 2)
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        skipping default R package `tidyverse`: R package resolution failed with exit status: 1: synthetic `ir` failure for tidyverse
        [output produced while idle]
        42
  isError: false
---
send:
  r: >-
    stopifnot(requireNamespace('ggplot2', quietly = TRUE)); cat('R default
    available\n')
result:
  content:
    - type: text
      text: |
        R default available
  isError: false
---
send:
  requirements:
    r:
      - tidyverse
  python: answer = 0
result:
  content:
    - type: text
      text: >-
        R package resolution failed with exit status: 1: synthetic `ir` failure
        for tidyverse
  isError: true
