---
!same-as custom MCP initialization for this execution mode
---
send:
  r: resolve python while idle
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  r: request input while idle
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  session: default
result:
  content:
    - type: text
      text: |-
        [input requested: "idle> "]
        [waiting for stdin]
  isError: false
---
send:
  r: echo echo
  stdin: |
    continue
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
