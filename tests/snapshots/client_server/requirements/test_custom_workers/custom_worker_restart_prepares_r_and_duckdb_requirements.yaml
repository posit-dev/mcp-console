---
!same-as custom MCP initialization for this execution mode
---
send:
  control: restart
  requirements:
    r:
      - praise
    duckdb:
      - json
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: report managed R requirement
result:
  content:
    - type: text
      text: |
        zod R requirement: prepared=true
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
