---
!same-as custom MCP initialization for this execution mode
---
send:
  sql: echo echo
result:
  content:
    - type: text
      text: |
        zod sql: echo
  isError: false
  _meta:
    posit.mcp-console/send:
      language: sql
---
send:
  r: echo echo
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
