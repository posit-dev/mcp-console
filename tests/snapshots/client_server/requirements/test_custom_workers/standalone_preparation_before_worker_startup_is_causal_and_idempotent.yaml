---
!same-as custom MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - must-not-resolve
  stdin: |
    must not queue
result:
  content:
    - type: text
      text: >-
        requirements-only `send` performs standalone preparation and cannot also
        queue stdin
  isError: true
---
send:
  requirements:
    r:
      - standalone-requirement
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    r:
      - standalone-requirement
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
