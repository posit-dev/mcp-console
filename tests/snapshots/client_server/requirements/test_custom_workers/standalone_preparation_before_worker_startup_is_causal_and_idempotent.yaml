---
!same-as custom MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - must-not-resolve
  stdin: |
    must not queue
result:
  content:
    - type: text
      text: >-
        requirements-only `send` performs standalone preparation and cannot also
        queue stdin
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    r:
      - standalone-requirement
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
