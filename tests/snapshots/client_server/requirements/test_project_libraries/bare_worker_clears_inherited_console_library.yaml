---
!same-as MCP initialization for this execution mode
---
send:
  r: >-
    stopifnot(Sys.getenv("MCP_CONSOLE_R_LIBRARY") == ""); cat("bare library
    ready\n")
result:
  content:
    - type: text
      text: |
        bare library ready
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: >-
    stopifnot(Sys.getenv("MCP_CONSOLE_R_LIBRARY") == ""); cat("bare library
    ready\n")
result:
  content:
    - type: text
      text: |
        bare library ready
  isError: false
