---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.python-only-writable.yaml
---
send:
  r: 1L
result:
  content:
    - type: text
      text: >
        Error: R requires a temporary directory without whitespace. Set
        sandbox.tempdir.managed.parent to a suitable directory and relaunch
        Console, or set TMPDIR before starting R.
  isError: false
---
send:
  python: |
    import os
    from pathlib import Path

    os.environ["HOME"] = str(Path.cwd() / "person[1]")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    r:
      - consolefirst
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: del os.environ["TMPDIR"]
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    project <- normalizePath(Sys.glob("~/local"))
    candidate <- file.path(getwd(), "resolved-r-libraries", "consolefirst")
    stopifnot(
      identical(project, file.path(getwd(), "person1", "local")),
      identical(dirname(find.package("consolefirst")), candidate),
      identical(
        .libPaths()[2:5],
        c(
          file.path(getwd(), "project-first"),
          project,
          file.path(getwd(), "project-last"),
          candidate
        )
      ),
      consolefirst::fixture()
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
