---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.python-only-writable.yaml
---
send:
  r: 1L
result:
  content:
    - type: text
      text: >
        Error: R requires a temporary directory without whitespace. Set
        sandbox.tempdir.managed.parent to a suitable directory and relaunch
        Console, or set TMPDIR before starting R.
  isError: false
---
send:
  requirements:
    r:
      - consolefirst
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  requirements:
    r:
      - consolesecond
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: import os; del os.environ["TMPDIR"]
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    original <- normalizePath(Sys.getenv("R_LIBS_SITE"))
    project <- normalizePath(c("project-first", "project-last"))
    paths <- .libPaths()
    stopifnot(
      identical(paths[paths %in% c(original, project)], c(original, project)),
      consolefirst::fixture(),
      consolesecond::fixture()
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
