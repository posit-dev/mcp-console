---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    r_started = Path(os.environ["TMPDIR"]) / "r-started"
    assert not r_started.exists()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    r:
      - consolefirst
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: assert not r_started.exists()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    _ = r['native_paths <- .libPaths()\nprepared_library <-
    dirname(find.package("consolefirst"))\nstopifnot(prepared_library %in%
    native_paths)\n']
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: assert r_started.read_text() == "started\n"
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    r:
      - consolefirst
      - consolesecond
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: >-
    _ = r['paths <- .libPaths()\nreplacement <-
    dirname(find.package("consolesecond"))\nstopifnot(\n  !prepared_library
    %in% paths,\n  identical(\n    paths[!paths %in%
    replacement],\n    native_paths[!native_paths %in%
    prepared_library]\n  ),\n  consolefirst::fixture(),\n  consolesecond::fixture()\n)\ncat("pre-initialization
    library replaced\\n")\n']
result:
  content:
    - type: text
      text: |
        pre-initialization library replaced
  isError: false
