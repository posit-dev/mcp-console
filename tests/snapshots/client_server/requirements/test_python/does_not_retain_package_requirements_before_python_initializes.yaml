---
send:
  r: |
    library(mcpconsolepyrequire)
    request <- tail(reticulate::py_require()$history, 1L)[[1L]]
    stopifnot(
      identical(request$requested_from, "mcpconsolepyrequire"),
      isTRUE(request$env_is_package)
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: tools::pskill(Sys.getpid(), signal = 9L)
result:
  content:
    - type: text
      text: |-
        [worker sideband read failed: worker sideband closed]
        [worker terminated by signal 9]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: true
---
send:
  r: |
    "py-yaml12" %in% reticulate::py_require()$packages
result:
  content:
    - type: text
      text: |
        [1] FALSE
  isError: false
---
send:
  r: library(mcpconsolepyrequire); yaml12 <- reticulate::import("yaml12")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: 'yaml12$parse_yaml("answer: 42")$answer'
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
