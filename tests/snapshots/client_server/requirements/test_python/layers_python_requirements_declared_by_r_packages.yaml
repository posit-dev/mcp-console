---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import importlib.util
    import sys

    runtime_marker = 42
    initial_prefix = sys.prefix
    importlib.util.find_spec("yaml12") is None
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  r: |
    initial_libpython <- reticulate::py_config()$libpython
    initial_worker <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: library(mcpconsolepyrequire)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "DBI",
              "dbplyr",
              "dplyr",
              "duckdb",
              "ggplot2",
              "nanoarrow",
              "reticulate",
              "tidyverse",
              "yyjsonr"
            ],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "py-yaml12"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - DBI
        - dbplyr
        - dplyr
        - duckdb
        - ggplot2
        - nanoarrow
        - reticulate
        - tidyverse
        - yyjsonr
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - py-yaml12
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: |
    identical(reticulate::py_config()$libpython, initial_libpython) &&
      identical(Sys.getpid(), initial_worker)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  python: |
    import yaml12

    (runtime_marker, yaml12.__name__, sys.prefix != initial_prefix)
result:
  content:
    - type: text
      text: |
        (42, 'yaml12', True)
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: |
    import yaml12

    ("runtime_marker" in globals(), yaml12.__name__)
result:
  content:
    - type: text
      text: |
        (False, 'yaml12')
  isError: false
---
send:
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
