---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import importlib.util
    import os
    import sys

    sentinel = 42
    worker_pid = os.getpid()
    initial_prefix = sys.prefix
    importlib.util.find_spec("yaml12") is None
result:
  content:
    - type: text
      text: |
        True
  isError: false
---
send:
  requirements:
    python:
      - not a valid requirement !!!
result:
  content:
    - type: text
      text: >-
        Python requirement `not a valid requirement !!!` is not accepted:
        host-side managed resolution accepts named package requirements only
  isError: true
---
send:
  python: >
    sentinel, os.getpid() == worker_pid, importlib.util.find_spec("yaml12")
    is None
result:
  content:
    - type: text
      text: |
        (42, True, True)
  isError: false
---
send:
  python: |
    import os
    import sys
    import yaml12

    (sentinel, os.getpid() == worker_pid, sys.prefix != initial_prefix, yaml12.__name__)
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: |
        (42, True, True, 'yaml12')
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: is.null(reticulate::py_require()$python_version)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
---
send:
  python: |
    import yaml12

    "sentinel" in globals(), yaml12.__name__
result:
  content:
    - type: text
      text: |
        (False, 'yaml12')
  isError: false
