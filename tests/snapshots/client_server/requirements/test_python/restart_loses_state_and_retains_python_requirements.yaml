---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    python:
      - py-yaml12
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: restart_marker = 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: |
    import yaml12

    "restart_marker" in globals(), yaml12.__name__
result:
  content:
    - type: text
      text: |
        (False, 'yaml12')
  isError: false
