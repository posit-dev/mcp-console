---
send:
  sql: CREATE TABLE managed_restore_value AS SELECT 42 AS answer
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import importlib

    sql_import_stages = []


    def miss(stage):
        sql_import_stages.append(stage)
        try:
            importlib.import_module("mcp_console_sql_missing_" + stage)
        except ModuleNotFoundError:
            pass


    class ColumnName:
        def __str__(self):
            miss("name")
            return "answer"


    class Value:
        def __repr__(self):
            miss("repr")
            return "42"


    class Cursor:
        @property
        def description(self):
            miss("description")
            return ((ColumnName(),),)

        def execute(self, source):
            miss("execute")
            return self

        def fetchmany(self, size):
            miss("fetch")
            return [(Value(),)][:size]

        def close(self):
            miss("close")


    class Connection:
        def cursor(self):
            miss("cursor")
            return Cursor()


    _console.sql_connection(Connection())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: ANSWER
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
---
send:
  sql: ANSWER AGAIN
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
---
send:
  python: sorted(set(sql_import_stages))
result:
  content:
    - type: text
      text: |
        ['close', 'cursor', 'description', 'execute', 'fetch', 'name', 'repr']
  isError: false
---
send:
  python: |
    import _mcp_console_sql
    import sys

    use_r_code = _mcp_console_sql.use_r.__code__


    def restore_hook(frame, event, argument):
        if event == "call" and frame.f_code is use_r_code:
            miss("restore")
            raise SystemExit("managed SQL restoration exit")
        return restore_hook


    _console.sql_connection(None)
    sys.settrace(restore_hook)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
