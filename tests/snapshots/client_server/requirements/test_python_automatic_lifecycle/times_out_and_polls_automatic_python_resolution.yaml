---
!same-as automatic MCP initialization for this execution mode
---
send:
  python: None
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    with open("automatic-import-release", "rb", buffering=0) as gate:
        assert gate.read(1) == b"1"
    automatic_timeout_attempts = (
        globals().get(
            "automatic_timeout_attempts",
            0,
        )
        + 1
    )
    import yaml12

    (yaml12.__name__, automatic_timeout_attempts)
  timeout_ms: 1
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  session: default
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output; phase: dependency preparation]
        [running; poll with an empty send]
  isError: false
---
send:
  session: default
  timeout_ms: 30000
result:
  content:
    - type: text
      text: |
        [resolved PyPI distribution 'py-yaml12' for Python import 'yaml12']
        ('yaml12', 1)
  isError: false
