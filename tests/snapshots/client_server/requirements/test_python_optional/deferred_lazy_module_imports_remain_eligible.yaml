---
!same-as automatic MCP initialization for this execution mode
---
send:
  requirements:
    action: set
    python:
      - mcp_console_test_lazy_package
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    import importlib.util
    import sys

    specification = importlib.util.find_spec("mcp_console_test_lazy_package")
    specification.loader = importlib.util.LazyLoader(specification.loader)
    package = importlib.util.module_from_spec(specification)
    sys.modules[specification.name] = package
    specification.loader.exec_module(package)
    package.fallback
result:
  content:
    - type: text
      text: |
        False
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
