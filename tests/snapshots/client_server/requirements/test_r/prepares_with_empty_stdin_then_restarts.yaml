---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  stdin: ""
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  control: restart
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: |-
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      identical(dirname(find.package("praise")), .libPaths()[[managed_index]])
    )
    sentinel <- 42L
    worker_pid <- Sys.getpid()
    praise::praise("ready")
result:
  content:
    - type: text
      text: |
        [1] "ready"
  isError: false
---
send:
  stdin: ""
  requirements:
    r:
      - praise
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: stopifnot(identical(Sys.getpid(), worker_pid)); sentinel
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  control: restart
  requirements:
    r:
      - zeallot
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: |
    managed_index <- if (Sys.getenv("MCP_CONSOLE_SANDBOX") == "1") 2L else 1L
    stopifnot(
      !exists("sentinel"),
      !exists("worker_pid"),
      identical(dirname(find.package("praise")), .libPaths()[[managed_index]]),
      identical(dirname(find.package("zeallot")), .libPaths()[[managed_index]])
    )
    praise::praise("restarted")
result:
  content:
    - type: text
      text: |
        [1] "restarted"
  isError: false
