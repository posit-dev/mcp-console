---
!same-as MCP initialization for this execution mode
---
send:
  r: resolver_interrupt_state <- 41L; resolver_pid <- Sys.getpid()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    local({
      gate <- fifo(
        Sys.getenv("MCP_CONSOLE_TEST_R_RESOLVER_RELEASE"),
        "rb",
        blocking = TRUE
      )
      stopifnot(identical(readBin(gate, "raw", 1L), charToRaw("1")))
      close(gate)
    })
    package <- "RcppRoll"
    do.call(base::loadNamespace, list(package = package))
    resolver_interrupt_cell_ran <- TRUE
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
result:
  content:
    - type: text
      text: |
        Error: R package resolution interrupted
  isError: false
---
send:
  r: >-
    resolver_interrupt_state +
    as.integer(!exists('resolver_interrupt_cell_ran')) +
    as.integer(identical(Sys.getpid(), resolver_pid)) - 1L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
