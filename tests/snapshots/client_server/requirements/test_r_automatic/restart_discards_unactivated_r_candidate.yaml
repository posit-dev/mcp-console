---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    activation_checkpoint <- base::file.path(
      base::tempdir(),
      "automatic-r-activation-before-report"
    )
    base::cat(activation_checkpoint, "\n", sep = "")
result:
  content:
    - type: text
      text: |
        <activation checkpoint>
  isError: false
---
send:
  r: |
    activation_gate_used <- FALSE
    invisible(suppressMessages(base::trace(
      ".libPaths",
      tracer = quote({
        if (
          !missing(new) &&
            base::length(new) > 0L &&
            !activation_gate_used
        ) {
          activation_gate_used <<- TRUE
          checkpoint <- base::file(
            activation_checkpoint,
            open = "wb",
            raw = TRUE
          )
          base::writeBin(base::charToRaw("1"), checkpoint)
          base::close(checkpoint)
          gate <- base::suppressWarnings(base::file(
            "/dev/stdin",
            open = "rb"
          ))
          base::on.exit(base::close(gate), add = TRUE)
          base::stopifnot(base::length(base::readBin(
            gate,
            what = "raw",
            n = 1L
          )) == 0L)
        }
      }),
      print = FALSE,
      where = base::baseenv()
    )))
    package <- "mcprestart"
    invisible(base::do.call(
      base::loadNamespace,
      list(package = package)
    ))
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [active evaluation stopped by session restart request]
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: >-
    package <- 'mcprestart'; invisible(base::do.call(base::loadNamespace,
    list(package = package))); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
