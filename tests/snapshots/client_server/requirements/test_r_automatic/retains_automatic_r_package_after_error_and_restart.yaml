---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - DBI
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  r: |
    stopifnot(is.function(fortunes::fortune))
    stop("after activation")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |
        Error: after activation
  isError: false
---
send:
  r: stopifnot(requireNamespace("fortunes", quietly = TRUE)); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: stopifnot(requireNamespace("fortunes", quietly = TRUE)); 42L
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
