---
!same-as r-only MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: |
    reticulate::py_require(
      "requests[socks]>=2.32,<3",
      python_version = ">=3.13, <3.14",
      exclude_newer = "2026-01-01"
    )
    written <- reticulate::py_write_requirements(
      NULL,
      NULL,
      freeze = FALSE,
      python = NULL
    )
    stopifnot(
      identical(written$packages, "requests[socks]>=2.32,<3"),
      startsWith(written$python_version, "3.13."),
      !reticulate::py_available(initialize = FALSE)
    )
result:
  content:
    - type: text
      text: "[done]"
  isError: false
