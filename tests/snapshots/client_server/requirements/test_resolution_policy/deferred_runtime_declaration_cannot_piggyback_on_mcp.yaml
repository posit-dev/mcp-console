---
send:
  r: >-
    reticulate::py_require(python_version = character(), exclude_newer = '',
    action = 'set')
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: >-
    reticulate::py_require('six');
    stopifnot(!reticulate::py_available(initialize = FALSE))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  requirements:
    python:
      - packaging
result:
  content:
    - type: text
      text: >-
        Python requirements cannot change under
        python.managed.resolution=explicit (runtime dependency request)
  isError: true
