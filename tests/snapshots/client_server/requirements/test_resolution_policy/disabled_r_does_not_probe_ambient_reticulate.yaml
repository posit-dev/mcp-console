  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  r: 2 + 2
result:
  content:
    - type: text
      text: |
        [1] 4
  isError: false
