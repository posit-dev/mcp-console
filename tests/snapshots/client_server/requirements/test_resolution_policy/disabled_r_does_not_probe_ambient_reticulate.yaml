---
scenario: >-
  Disabled R preparation does not load ambient reticulate to discover uv.
fixture: >-
  No ir or uv on PATH; existing Python and an R reticulate package that
  fails on load.
---
!same-as python-only MCP initialization for this execution mode
---
send:
  r: 1 + 1
result:
  content:
