---
!same-as startup-only MCP initialization for this execution mode
---
send:
  control: restart
  requirements:
    action: set
  python: raise AssertionError('must not run')
  stdin: |
    withheld
result:
  content:
    - type: text
      text: >-
        [Python requirements cannot change under
        python.managed.resolution=startup_only (requirements.action=set)]
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "packaging"
            ],
            "duckdb": [],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - packaging
      duckdb: []
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: >-
    import packaging, os; original_pid = os.getpid(); print('startup
    available')
result:
  content:
    - type: text
      text: |
        startup available
  isError: false
