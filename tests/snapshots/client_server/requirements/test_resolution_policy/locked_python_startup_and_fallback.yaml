---
!same-as fixed MCP initialization for this execution mode
---
send:
  control: restart
  requirements:
    action: set
  python: raise AssertionError('must not run')
  stdin: |
    withheld
result:
  content:
    - type: text
      text: >-
        [Python requirements cannot change under python.managed.resolution=fixed
        (requirements.action=set)]
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "packaging"
            ],
            "duckdb": [],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - packaging
      duckdb: []
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: >-
    import packaging, os; original_pid = os.getpid(); print('startup
    available')
result:
  content:
    - type: text
      text: |
        startup available
  isError: false
---
send:
  python: |
    import importlib

    for name in ("yaml12", "rpython", "xml.mcp_console_missing"):
        for load in (
            importlib.import_module,
            __import__,
            lambda name: exec(f"import {name}"),
        ):
            try:
                load(name)
            except ModuleNotFoundError as error:
                assert type(error) is ModuleNotFoundError
                assert error.args == (f"No module named '{name}'",), error.args
                assert error.name == name
                assert error.path is None
            else:
                raise AssertionError(f"undeclared import succeeded: {name}")

    try:
        from xml import mcp_console_missing
    except ImportError as error:
        assert type(error) is ImportError
        assert str(error).startswith("cannot import name 'mcp_console_missing' from 'xml'")
        assert error.name == "xml"
    else:
        raise AssertionError("missing from-import succeeded")

    print("native import errors")
result:
  content:
    - type: text
      text: |
        native import errors
  isError: false
