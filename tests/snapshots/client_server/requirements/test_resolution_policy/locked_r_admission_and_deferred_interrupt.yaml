---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: set
result:
  content:
    - type: text
      text: >-
        R requirements cannot change under r.resolution=fixed
        (requirements.action=set)
  isError: true
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "mcpfirst"
            ],
            "python": [],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "arrow",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - mcpfirst
      python: []
      duckdb:
        - icu
        - json
        - sqlite
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - arrow
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
---
send:
  r: >-
    stopifnot(mcpfirst::fixture()); original_pid <- Sys.getpid();
    cat('startup available\n')
result:
  content:
    - type: text
      text: |
        startup available
  isError: false
---
send:
  python: print('Python available')
result:
  content:
    - type: text
      text: |
        Python available
  isError: false
---
send:
  requirements:
    r:
      - mcpsecond
    python:
      - packaging
  r: stop('must not run')
  stdin: |
    withheld
result:
  content:
    - type: text
      text: >-
        R requirements cannot change under r.resolution=fixed
        (requirements.action=add)
  isError: true
---
