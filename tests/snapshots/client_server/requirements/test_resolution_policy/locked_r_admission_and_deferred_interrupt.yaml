---
send:
  r: |
    tryCatch({
      local({
        checkpoint <- file("<fixture>/active", "wb", raw = TRUE)
        on.exit(close(checkpoint))
        writeChar("1", checkpoint, eos = NULL)
      })
      Sys.sleep(60)
    }, interrupt = function(e) cat("active interrupted\n"))
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
---
send:
  control: interrupt
  requirements:
    r:
      - mcpsecond
  r: followup_ran <- TRUE
  timeout_ms: 10000
result:
  content:
    - type: text
      text: |-
        active interrupted
        R requirements cannot change under r.resolution=fixed (requirements.action=add)
  isError: true
---
send:
  r: >-
    stopifnot(!exists('followup_ran'), Sys.getpid() == original_pid);
    cat('worker retained\n')
result:
  content:
    - type: text
      text: |
        worker retained
  isError: false
