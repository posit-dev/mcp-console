---
!same-as fixed MCP initialization for this execution mode
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: >-
    import duckdb; duckdb.sql('LOAD json'); print('installed extension
    usable')
result:
  content:
    - type: text
      text: |
        installed extension usable
  isError: false
---
send:
  requirements:
    duckdb:
      - fts
result:
  content:
    - type: text
      text: >-
        Python requirements cannot change under python.managed.resolution=fixed
        (requirements.action=add)
  isError: true
