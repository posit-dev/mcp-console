---
!same-as MCP initialization for this execution mode
---
send:
  python: print('Python initialized')
result:
  content:
    - type: text
      text: |
        Python initialized
  isError: false
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: import yaml12
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e2>", line 1, in <module>
        ModuleNotFoundError: No module named 'yaml12'.

        MCP Console inferred the PyPI distribution `py-yaml12` from the import `yaml12`, but automatic package resolution failed:

        Python requirements cannot change under python.managed.resolution=explicit (runtime dependency request)

        Import names and PyPI distribution names can differ. Retry with the correct distribution declared through `requirements.python` in the `send` call, for example:

        requirements: {"python": ["py-yaml12"]}
  isError: false
---
send:
  python: |
    import importlib

    for load in (importlib.import_module, __import__):
        try:
            load("yaml12")
        except ModuleNotFoundError:
            pass
        else:
            raise AssertionError("undeclared import resolved")
    print("dynamic imports require declared dependencies")
result:
  content:
    - type: text
      text: |
        dynamic imports require declared dependencies
  isError: false
