---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import importlib.util
    import sys

    assert sys.version_info.major == 3 and 12 <= sys.version_info.minor < 14
    assert importlib.util.find_spec("duckdb") is None
    assert importlib.util.find_spec("packaging") is not None
    assert "packaging" not in sys.modules
    print("conditional startup available")
result:
  content:
    - type: text
      text: |
        conditional startup available
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
