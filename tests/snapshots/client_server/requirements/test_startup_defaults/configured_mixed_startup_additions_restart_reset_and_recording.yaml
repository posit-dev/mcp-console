---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    stopifnot(
      !("praise" %in% loadedNamespaces()),
      nzchar(find.package("praise")),
      !("package:praise" %in% search())
    )
    cat("configured R available\n")
result:
  content:
    - type: text
      text: |
        configured R available
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  python: |
    import importlib.util
    import sys

    assert sys.version_info[:2] == (3, 13)
    assert importlib.util.find_spec("packaging") is not None
    assert "packaging" not in sys.modules
    print("configured Python available")
result:
  content:
    - type: text
      text: |
        configured Python available
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    action: get
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [
              "praise"
            ],
            "python": [
              "packaging"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [
              "3.13"
            ],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [
              "DBI",
              "duckdb",
              "jsonlite",
              "nanoarrow",
              "pillar",
              "reticulate",
              "tibble",
              "utf8"
            ],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r:
        - praise
      python:
        - packaging
      duckdb:
        - icu
        - json
        - sqlite
      python_version:
        - "3.13"
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r:
        - DBI
        - duckdb
        - jsonlite
        - nanoarrow
        - pillar
        - reticulate
        - tibble
        - utf8
      python: []
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
