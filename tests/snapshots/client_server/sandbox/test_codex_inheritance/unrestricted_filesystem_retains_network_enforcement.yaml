---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.client-sandbox-python-only.yaml
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      timeout_ms: 60000
      python: |
        import errno
        import json
        import os
        import socket
        from pathlib import Path

        assert os.environ["MCP_CONSOLE_SANDBOX"] == "1"
        _ = Path("created").write_text("unrestricted filesystem")
        try:
            _ = Path("secret").read_text()
        except OSError as error:
            assert error.errno in (errno.EACCES, errno.EPERM)
        else:
            raise AssertionError("explicit denial was lost on unrestricted base")
        for port in json.loads(os.environ["MCP_CONSOLE_TEST_PORTS"]):
            try:
                connection = socket.create_connection(("127.0.0.1", port), timeout=2)
            except OSError:
                pass
            else:
                connection.close()
                raise AssertionError("inherited network restriction was lost")
        print("unrestricted filesystem with restricted networking")
    _meta:
      codex/sandbox-state:
        permissionProfile:
          type: managed
          file_system:
            type: unrestricted
          network: restricted
result:
  content:
    - type: text
      text: |
        unrestricted filesystem with restricted networking
  isError: false
---
input:
  method: tools/call
  params:
    name: send
    arguments:
      timeout_ms: 60000
      python: Path('created').read_text()
    _meta:
      codex/sandbox-state:
        permissionProfile:
          type: external
          network: restricted
result:
  content:
    - type: text
      text: |
        'unrestricted filesystem'
  isError: false
