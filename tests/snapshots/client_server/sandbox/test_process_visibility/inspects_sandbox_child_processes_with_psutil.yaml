---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.yaml
---
send:
  python: |
    import sys

    initial_executable = sys.executable
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import ctypes
    import errno
    import os
    import subprocess
    import sys

    import psutil

    mib = (ctypes.c_int * 3)(1, 14, 0)
    size = ctypes.c_size_t()
    ctypes.set_errno(0)
    result = ctypes.CDLL(None, use_errno=True).sysctl(
        mib,
        len(mib),
        None,
        ctypes.byref(size),
        None,
        0,
    )
    denied = result == -1 and ctypes.get_errno() == errno.EPERM

    command = [sys.executable, "-c", "import time; time.sleep(30)"]
    child = subprocess.Popen(command)
    try:
        visible = psutil.pids()
        descendants = psutil.Process().children(recursive=True)
        observed = [process.pid for process in descendants]
        process_group = os.getpgrp()
        visible_groups = [os.getpgid(pid) for pid in visible]
    finally:
        child.terminate()
        child.wait()

    (
        initial_executable != sys.executable,
        denied,
        1 not in visible,
        visible == sorted(visible),
        all(group == process_group for group in visible_groups),
        child.pid in visible,
        child.pid in observed,
    )
  requirements:
    python:
      - psutil
result:
  content:
    - type: text
      text: |
        (True, True, True, True, True, True, True)
  isError: false
