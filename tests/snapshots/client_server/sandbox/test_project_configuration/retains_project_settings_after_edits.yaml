---
input:
  method: notifications/initialized
---
input:
  method: tools/list
result:
  tools:
    - name: send
      description: >-
        Persistent R, Python, and SQL REPL for calculations, data exploration
        and analysis, database queries, debugging, simulations, and plots. Reuse
        objects across calls to inspect results, test hypotheses, and compare
        approaches.


        Send one complete `r`, `python`, or `sql` cell per call. Results display
        automatically; supported plots return as images.


        Choose whichever language makes each step easiest to express, even when
        earlier steps used another language. Switch between R, Python, and SQL
        cells, reusing results through the language bridges, or use reticulate
        within an R cell to combine R expressions with Python objects and
        function calls. For example, read a specialized format with a Python
        library, then continue with an R data frame to transform or summarize
        the data, fit a statistical model, or make a plot.


        DuckDB can query CSV, Parquet, JSON/JSONL file globs, and databases via
        extensions.


        Run one cell at a time per session; collect its result before more code.
        Sessions can run concurrently. Use `control="interrupt"` to interrupt.
        An error can leave earlier changes in place. Poll without code; do not
        resubmit. Empty calls poll all sessions; supply `session` to select one.
        Use `timeout_ms=300000` for a long poll of one session; it returns early
        on completion or input. Avoid repeated short polls such as
        `timeout_ms=1000`. Defaults: `timeout_ms=60000` (60 seconds),
        `requirements.action="add"`.


        Text results, including notices, have an 8 KiB limit, retaining the
        beginning and latest tail; images have separate limits. Response notices
        report state and omitted-output locations.


        Evaluated code can read host files subject to configured restrictions
        and can access the network subject to the launcher's proxy settings.
        Writable locations: private `TMPDIR`, `"<workspace>/output café 雪"`,
        `"<writable-root>"`; subject to more specific read/deny rules. Package
        preparation may execute installation or build code with separate
        filesystem and network permissions; use only trusted dependencies.
      inputSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        type: object
        properties:
          r:
            description: >-
              Evaluate one complete R cell in persistent global state. Visible
              top-level expressions autoprint; leave the primary result last. Load
              CRAN packages normally through `library()`, `require()`,
              `requireNamespace()`, `loadNamespace()`, `::`, or `:::`; managed
              sessions prepare missing packages on first use. Avoid availability
              probes or `install.packages()`. `?pkg::topic` and `help.search()` print
              installed help; `vignette()` prints rendered HTML text or labeled
              UTF-8/ASCII source for other formats. Capture long documentation with
              `text <- capture.output(print(?pkg::topic))`, then print line ranges
              with `writeLines()`. Access Python globals through `py$name`.
              `.console$sql_connection()` returns the active native DBI connection for
              DBI/dplyr, or errors if another runtime owns SQL. Select a user-owned
              DBI connection for SQL cells with `.console$sql_connection(connection)`;
              restore managed DuckDB with `.console$sql_connection(NULL)`. Never
              disconnect the managed connection; restore it before disconnecting a
              selection. After R-owned SQL, `.console$sql_last_result(n = 100)`
              returns a data frame of up to n successive rows, including the original
              preview first, without re-executing SQL; omit n to materialize all
              remaining rows. Column types and precision follow the database driver.
              Cleanup is automatic on exhaustion, replacement, or retrieval failure.
              Default-device plots return as PNGs and finalize at cell end, including
              after errors; draw each plot in one cell. Explicit devices are not
              captured. Set persistent dimensions in inches and DPI with
              `options(console.plot.width_in = ..., console.plot.height_in = ...,
              console.plot.dpi = ...)`. For a reusable R script, include imports, data
              inputs, and `#| packages:`/`#| r-version:` metadata for `ir run
              script.R`, which starts without live Console objects.
            type:
              - string
              - "null"
          python:
            description: >-
              Evaluate one complete Python cell in persistent `__main__` state. The
              final visible expression autoprints; leave the primary result last.
              Declare dependencies with `requirements.python` before importing them;
              preparation can accompany the cell. Import names may differ from
              distribution names. Access R globals and call functions through
              `r.name`. Select a user-owned DB-API connection for SQL cells with
              `_console.sql_connection(connection)`; restore managed DuckDB with
              `_console.sql_connection(None)`. After Python-owned SQL, `data =
              _console.sql_last_result(n=100)` retrieves up to n successive native
              rows, including the original preview first, without re-executing SQL;
              omit n to materialize all remaining rows. It returns a dictionary with
              `rows` and ordered `columns`, without requiring pandas. Optional
              `pandas.DataFrame(data["rows"], columns=data["columns"])` conversion
              follows pandas' type rules. Cleanup is automatic on exhaustion,
              replacement, or retrieval failure; connections stay open. For R-owned
              DuckDB, bind Python frames to an R name through `r` before querying.
              `_console.sql_connection()` returns the active native Python connection,
              or errors if SQL uses R; on Python-owned DuckDB, register frames with
              `_console.sql_connection().register(name, frame)` (globals are not
              scanned). `matplotlib.pyplot.show()` returns open figures as PNGs
              immediately and closes them. At cell end, even after errors, remaining
              open figures return as PNGs and close; `show()` is optional. Closing an
              unshown figure suppresses capture. R plots through `r` follow the R plot
              rules.
            type:
              - string
              - "null"
          sql:
            description: >-
              Evaluate one complete SQL cell through the active connection. Managed
              DuckDB keeps a persistent catalog. Results are bounded table previews
              that abbreviate long text cells; query focused subsets or aggregates.
              Retrieve data without replay through `.console$sql_last_result(n = 100)`
              or `_console.sql_last_result(n=100)` in the connection's owning
              language. Each call consumes successive rows, starting with the original
              preview; omit n to materialize all remaining rows. Cleanup is automatic
              on exhaustion, another SQL cell, connection selection, or a retrieval
              error or interrupt. A partially consumed result can hold database
              resources and locks. Before direct connection use, finish retrieval or
              select that connection again to discard unread rows. Transfer retrieved
              data using the existing language bridge. The selected driver supplies
              its own SQL dialect and types. With R-owned managed DuckDB, query R data
              frames by name; DuckDB tables/views take precedence. Use DBI from an R
              cell for commands requiring the statement interface. Managed
              conveniences/extensions apply only to DuckDB. Read JSON/JSONL file globs
              as tables, including nested fields, with `read_json('data/*.json*')`.
              Read SQLite with `ATTACH 'path' AS name (TYPE sqlite, READ_ONLY)`. With
              a sandbox, attach existing DuckDB databases outside writable paths using
              `ATTACH 'path' AS name (READ_ONLY)`. Use `SHOW TABLES`, `DESCRIBE`,
              `SUMMARIZE`, or `EXPLAIN`; CLI dot commands are not supported.
            type:
              - string
              - "null"
          note:
            description: |-
              Plain text or Markdown journal annotation, recorded as prose before any same-call code.
              Use it to record observations, questions, or the purpose of a step. May accompany other
              arguments or stand alone. A note-only call returns without waiting for or collecting
              worker output. Notes are not evaluated.
            type:
              - string
              - "null"
          session:
            description: |-
              Select a session by name (default: "default"). A new name starts an independent session
              with its first code cell. Each session retains its own variables, database
              state, and requirements; different sessions can execute concurrently. Supply the name
              again to poll, interrupt, or restart it. An empty call without session polls all active
              sessions and lists their statuses. Restart without code or nonempty stdin stops a named
              session until its next code or nonempty-input call; the default session restarts immediately.
            type: string
            default: default
          timeout_ms:
            description: >-
              Wait for output for up to this many milliseconds (default 60,000). Use
              `timeout_ms=300000` with `session` for a long poll; it returns early
              when that session finishes or needs input. An empty call without session
              polls all sessions concurrently within this budget and can wait for
              other busy sessions. Avoid repeated short polls such as
              `timeout_ms=1000`. `0` returns without waiting for completion. Expiry
              returns available output while work continues. This is a wait budget,
              not cancellation or a whole-call deadline: preparation and control can
              exceed it; standalone preparation has no timeout.
            type: integer
            format: uint64
            minimum: 0
            default: 60000
          control:
            description: >-
              Apply control before same-call stdin/code. `interrupt` requests a
              cooperative interrupt and cancellation of dependency preparation,
              preserving live state. A following cell runs only if prior work stops.
              `restart` discards live interpreter, database, debugger, and
              unread-input state; same-call stdin/code go only to the replacement.
            type: string
            enum:
              - interrupt
              - restart
          stdin:
            description: >-
              Send stdin alone to answer an active read, prompt, or debugger. UTF-8
              text is queued exactly; no newline is added, so line input normally
              needs a trailing `\n`. Empty text queues nothing. With a cell, input
              queues before code; an already waiting read may consume it first,
              including while interrupted work unwinds. Unread input can satisfy later
              reads; restart discards it.
            type:
              - string
              - "null"
          requirements:
            description: >-
              Inspect declarations or prepare dependencies on the execution host
              without importing, attaching, or loading them. Requires host preparation
              support; bare runtimes use installed packages. Alone, performs
              standalone preparation. With a cell, preparation precedes code; without
              control it also precedes bundled stdin. Failure or a required restart
              withholds the cell. Compatible additions preserve live state on an idle
              worker; other changes need restart. With restart, candidate resolution
              precedes replacement; resolution failure preserves the current worker
              and sends no stdin/code. Standalone preparation rejects nonempty stdin.
              Only add can accompany interrupt, with a following cell; providers
              without this preparation support reject the combination before signaling
              or input. Otherwise interrupt and stdin precede deferred
              validation/preparation and are not rolled back on failure.
            type:
              - object
              - "null"
            properties:
              action:
                description: |-
                  get reads the retained declaration, not an installed-package inventory, without starting a
                  worker or consuming output; use it alone, without code, stdin, control, or payload fields.
                  The complete declaration is in structuredContent.requirements.
                  add (default) accumulates up to 64 entries per language per call; bare {} is invalid.
                  set replaces the whole declaration without defaults; omitted lists/constraints are empty,
                  even with only action supplied. reset restores startup defaults and rejects payload fields.
                  Changed set/reset with a live worker require control="restart"; unchanged declarations are
                  no-ops. set accepts the complete accumulated manifest without add's per-list limit.
                type: string
                enum:
                  - get
                  - add
                  - set
                  - reset
              python_version:
                description: |-
                  Python version numbers or ==, !=, <, <=, >, >= constraints (e.g. >=3.11).
                  add appends; changes with a live worker require control="restart".
                type: array
                items:
                  type: string
              exclude_newer:
                description: |-
                  Package publication cutoff accepted by uv, e.g. "2026-01-01".
                  set clears an omitted/null cutoff; add preserves omission and cannot replace an existing one.
                type:
                  - string
                  - "null"
              duckdb:
                description: |-
                  Managed DuckDB extension names, e.g. fts or spatial: lowercase ASCII letter first, then
                  lowercase letters, digits, or underscores (at most 64 characters).
                  Use DuckDB's LOAD or automatic loading after preparation.
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
              r:
                description: |-
                  Single-line ir package references, e.g. data.table or sf, including supported remote
                  references; local sources and NUL/line breaks are rejected. Automatic R loads accept plain
                  package names only; use this field for explicit references or preparation before use.
                type: array
                items:
                  type: string
                  minLength: 1
              python:
                description: |-
                  Named PEP 508 registry requirements with versions, extras, or markers, e.g. polars>=1 or
                  requests[socks]. Paths, URLs, editable requirements, direct references, and local sources
                  are rejected. Bare or explicitly selected Python environments and custom workers disable
                  managed Python requirements.
                type: array
                items:
                  type: string
                  minLength: 1
            additionalProperties: false
---
send:
  python: |
    import errno
    import json
    import os
    from pathlib import Path
    import socket
    from urllib.parse import urlsplit

    host = Path(os.environ["MCP_CONSOLE_TEST_PROJECT"])
    configured = os.environ["MCP_CONSOLE_TEST_CONFIGURED"] == "1"
    assert "MCP_CONSOLE_SANDBOX_SETTINGS" not in os.environ
    assert "MCP_CONSOLE_SANDBOX_CONFIG" not in os.environ
    assert (os.environ.get("CODEX_NETWORK_PROXY_ACTIVE") == "1") == configured
    _ = (Path(os.environ["TMPDIR"]) / "private").write_text("private storage")
    _ = (host / "CLI cache" / "persistent").write_text("CLI grant")
    for name, allowed in (("output café 雪", configured), ("neighbor", False)):
        try:
            _ = (host / name / "created").write_text("project grant")
        except OSError as error:
            assert not allowed and error.errno in (errno.EPERM, errno.EACCES, errno.EROFS)
        else:
            assert allowed, name
    # A proxy listener can reuse a host port in its network namespace.
    proxy_ports = {
        urlsplit(os.environ.get(key, "")).port
        for key in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY")
    }
    ports = json.loads(os.environ["MCP_CONSOLE_TEST_PORTS"])
    port = next(port for port in ports if port not in proxy_ports)
    try:
        socket.create_connection(("127.0.0.1", port), timeout=2)
    except OSError:
        pass
    else:
        raise AssertionError("direct network unexpectedly allowed")
    os.chdir(host / "CLI cache")
    print("captured grants, proxy selection, and restricted network verified")
result:
  content:
    - type: text
      text: |
        captured grants, proxy selection, and restricted network verified
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
