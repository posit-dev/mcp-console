  method: initialize
  params:
    protocolVersion: 2025-11-25
    capabilities: {}
    clientInfo:
      name: acceptance-test
      version: 1.0.0
result:
  protocolVersion: 2025-11-25
  capabilities:
    tools: {}
  serverInfo:
    name: mcp-console
    version: <Console version>
  instructions: >-
    Persistent R, Python, and SQL REPL for calculations, data exploration
