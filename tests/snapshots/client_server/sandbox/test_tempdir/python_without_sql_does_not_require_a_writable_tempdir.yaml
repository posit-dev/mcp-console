---
!same-as configured-python MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    assert Path(os.environ["TMPDIR"]).name == "absent-temp"
    print(6 * 7)
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
