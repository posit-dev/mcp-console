---
!same-as configured-python MCP initialization for this execution mode
---
send:
  python: |
    import os
    from pathlib import Path

    assert Path(os.environ["TMPDIR"]).name == "absent-temp"
    print(6 * 7)
result:
  content:
    - type: text
      text: |
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: restart
