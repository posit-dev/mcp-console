---
send:
  timeout_ms: 600000
result:
  content:
    - type: text
      text: |
        [1] 42
  isError: false
---
input:
  method: ping
result: {}
---
send:
  r: cat("1", file = Sys.getenv("MCP_CONSOLE_TEST_EVALUATED")); 42L
