---
send:
  requirements:
    action: get
result: <committed default manifest>
---
send:
  stdin: |
    retained input
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    action: set
result:
  content:
    - type: text
      text: >-
        changed requirements require an explicit restart; retry
        send(control="restart", requirements={"action": "set", ...}) with the
        complete declaration (or action="reset")
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  requirements:
    action: get
result: <unchanged default manifest>
---
send:
  python: input()
result:
  content:
    - type: text
      text: |
        [input requested: ""]
        'retained input'
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
