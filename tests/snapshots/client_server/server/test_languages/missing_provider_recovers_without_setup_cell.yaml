---
!same-as sql MCP initialization for this execution mode
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
session_bundles:
  - <recording>/sessions/session-001
---
send:
  control: restart
  requirements:
    action: set
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  sql: SELECT 1
result:
  content:
    - type: text
      text: >
        Error: DuckDB is unavailable; add duckdb with requirements.python and
        control: restart in a managed session, install it before starting a
        selected Python environment, or select a DB-API connection with
        _console.sql_connection(connection)
  isError: false
session_bundles:
  - <recording>/sessions/session-002
---
send:
  control: restart
  requirements:
    python:
      - duckdb
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  sql: SELECT 42 AS recovered
result:
  content:
    - type: text
      text: |
        recovered
        ---------
        42
  isError: false
session_bundles:
  - <recording>/sessions/session-003
