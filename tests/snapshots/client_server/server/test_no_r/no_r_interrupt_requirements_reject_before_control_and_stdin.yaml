---
send:
  python: |
    import os

    original_pid = os.getpid()
    received = input("original cell> ")
    print(received)
result:
  content:
    - type: text
      text: |-
        [input requested: "original cell> "]
        [waiting for stdin]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  control: interrupt
  requirements:
    r:
      - praise
  stdin: |
    rejected input
  python: interrupt_followup_ran = True
result:
  content:
    - type: text
      text: R requirements are unavailable in Python sessions without R
  isError: true
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
