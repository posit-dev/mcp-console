send:
  python: |
    assert os.getpid() == original_pid
    assert received == "fresh input"
    assert "interrupt_followup_ran" not in globals()
    print("original cell and worker retained")
result:
  content:
    - type: text
      text: |
        original cell and worker retained
  isError: false
