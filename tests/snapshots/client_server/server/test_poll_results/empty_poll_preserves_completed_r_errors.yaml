---
scenario: >-
  Empty polls expose completed R errors with one or multiple active
  sessions.
fixture: >-
  A FIFO holds each cell until its initial send has returned, avoiding
  timing-dependent sleeps.
---
!same-as MCP initialization for this execution mode
---
send:
  r: invisible(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    release <- fifo("default-only", open = "rb", blocking = TRUE)
    stopifnot(identical(readBin(release, "raw", 1L), charToRaw("1")))
    close(release)
    stop("console-poll-mre")
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        Error: console-poll-mre
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
