---
selection: default
python_guidance: >-
  Evaluate one complete Python cell in persistent `__main__` state. The
  final visible expression autoprints; leave the primary result last.
  Declare dependencies with `requirements.python` before importing them;
  preparation can accompany the cell. Import names may differ from
  distribution names. `matplotlib.pyplot.show()` returns open figures as
  PNGs immediately and closes them. At cell end, even after errors,
  remaining open figures return as PNGs and close; `show()` is optional.
  Closing an unshown figure suppresses capture.
