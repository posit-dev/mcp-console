---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import json
    from pathlib import Path

    connection = _console.sql_connection()
    storage = Path(
        connection.execute("SELECT current_setting('temp_directory')").fetchone()[0]
    ).parent
    storage.mkdir(parents=True, exist_ok=True)
    (storage / "cleanup-marker").write_text("owned storage")
    secrets = Path(
        connection.execute("SELECT current_setting('secret_directory')").fetchone()[0]
    )
    assert secrets.parent == storage
    secrets.mkdir(parents=True, exist_ok=True)
    (secrets / "credential").write_text("fixture secret")
    print(json.dumps(str(storage)))
result:
  content:
    - type: text
      text: |
        "<SQL storage>"
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
