---
!same-as python-only MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [],
            "duckdb": [],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": false,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python: []
      duckdb: []
      python_version: []
      exclude_newer: ~
    prepared: false
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: answer = 41; answer + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: 1 + 1
result:
  content:
    - type: text
      text: R cells are unavailable in Python sessions without R
  isError: true
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: answer = 41; answer + 1
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  r: 1 + 1
result:
  content:
    - type: text
      text: R cells are unavailable in Python sessions without R
  isError: true
