---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    action: get
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  python: counter = 1; input('first cell> ')
  requirements:
    action: set
  stdin: |
    retained input
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output; phase: startup]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output; phase: startup]
        [running; poll with an empty send]
  isError: false
---
send: {}
result:
  content:
    - type: text
      text: |
        [input requested: "first cell> "]
        'retained input'
  isError: false
---
send:
  python: counter
result:
  content:
    - type: text
      text: |
        1
  isError: false
---
send:
  requirements:
    action: reset
result:
  content:
    - type: text
      text: >-
        changed requirements require an explicit restart; retry
        send(control="restart", requirements={"action": "set", ...}) with the
        complete declaration (or action="reset")
  isError: true
