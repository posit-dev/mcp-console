---
!same-as python-only MCP initialization for this execution mode
---
send:
  r: value <- 'default'
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    value <- "alpha"
    source <- data.frame(value = 1L)
  session: alpha
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: CREATE TABLE results AS SELECT value FROM source
  session: alpha
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(
      !exists("value"),
      !DBI::dbExistsTable(.console$sql_connection(), "results")
    )
    value <- "beta"
    source <- data.frame(value = 2L)
  session: beta
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: CREATE TABLE results AS SELECT value FROM source
  session: beta
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    result <- DBI::dbGetQuery(
      .console$sql_connection(),
      "SELECT value FROM results"
    )
    cat(sprintf("%s %d\n", value, result$value))
  session: alpha
result:
  content:
    - type: text
      text: |
        alpha 1
  isError: false
---
send:
  r: |
    result <- DBI::dbGetQuery(
      .console$sql_connection(),
