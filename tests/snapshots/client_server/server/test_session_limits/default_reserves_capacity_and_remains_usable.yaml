---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: retained = 40
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  session: alpha
  python: print('must not execute')
result:
  content:
    - type: text
      text: >-
        session limit reached (sessions.max = 1); stop a named session before
        starting another
  isError: true
---
send:
  session: alpha
  timeout_ms: 0
result:
  content:
    - type: text
      text: unknown session "alpha"; submit a code cell to create it
  isError: true
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [session: "default"; status: idle]

        [idle]
  structuredContent:
    sessions:
      - session: default
        status: idle
  isError: false
---
send:
  python: retained += 2; print(retained)
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  control: restart
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [idle]
  isError: false
---
send:
  python: print('retained' in globals())
result:
  content:
    - type: text
      text: |
        False
  isError: false
---
send:
  session: beta
  python: print('must not execute')
result:
  content:
    - type: text
      text: >-
        session limit reached (sessions.max = 1); stop a named session before
        starting another
  isError: true
