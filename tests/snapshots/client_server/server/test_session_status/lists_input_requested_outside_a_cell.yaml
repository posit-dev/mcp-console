---
scenario: An empty poll reports an idle worker's input request.
fixture: >-
  The fake worker acknowledges cell completion before requesting input;
  its sideband receipt proves the server processed that request.
---
!same-as custom MCP initialization for this execution mode
---
send:
  r: request input while idle
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  session: default
result:
  content:
    - type: text
      text: |-
        [input requested: "idle> "]
        [waiting for stdin]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [waiting for stdin]
  isError: false
---
send:
  r: echo echo
  stdin: |
    continue
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
  _meta:
    posit.mcp-console/send:
      language: r
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
