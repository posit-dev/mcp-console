---
scenario: Session listing reports an idle worker's input request.
fixture: >-
  The fake worker acknowledges cell completion before requesting input;
  its sideband receipt proves the server processed that request.
---
!same-as custom MCP initialization for this execution mode
---
send:
  r: request input while idle
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  session: default
result:
  content:
    - type: text
      text: |-
        [input requested: "idle> "]
        [waiting for stdin]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [session: "default"; status: waiting_for_stdin]

        [waiting for stdin]
  structuredContent:
    sessions:
      - session: default
        status: waiting_for_stdin
  isError: false
---
send:
  r: echo echo
  stdin: |
    continue
result:
  content:
    - type: text
      text: |
        zod: echo
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [session: "default"; status: idle]

        [idle]
  structuredContent:
    sessions:
      - session: default
        status: idle
  isError: false
