---
scenario: >-
  Cancelling an aggregate poll while one session is running must not
  restore an empty stopped session's notice.
fixture: >-
  The default Python cell waits at a FIFO. Its first complete response
  write is held until a ping is received, so the ping proves delivery
  settled before the aggregate starts. A targeted poll proves aggregate
  ownership before cancellation; alpha has stopped with all output
  delivered.
---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: pass
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  python: pass
  session: alpha
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
send:
  control: restart
  session: alpha
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [stopped]
  isError: false
---
send:
  timeout_ms: 0
  python: |
    with open("default-ready", "wb", buffering=0) as ready:
        _ = ready.write(b"1")
    with open("default-release", "rb", buffering=0) as release:
        assert release.read(1) == b"1"
    print("default returned")
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output]
        [running; poll with an empty send]
  isError: false
  _meta:
    posit.mcp-console/send:
      language: python
---
input:
  method: ping
result: {}
---
send:
  timeout_ms: 60000
id: <cancelled request 1>
---
send:
  session: default
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[worker evaluation is already being polled]"
  isError: true
---
input:
  method: notifications/cancelled
  params:
    requestId: <cancelled request 1>
---
input:
  method: ping
result: {}
---
send:
  timeout_ms: 60000
result:
  content:
    - type: text
      text: |
        default returned
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
