---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: default_value = 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    retained = "alpha"
    answer = input("alpha> ")
  session: alpha
result:
  content:
    - type: text
      text: |-
        [input requested: "alpha> "]
        [waiting for stdin]
  isError: false
---
send:
  python: |
    retained = "beta"
    answer = input("beta> ")
  session: beta
result:
  content:
    - type: text
      text: |-
        [input requested: "beta> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  session: alpha
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<mcp-console:python:e1>", line 2, in <module>
        KeyboardInterrupt
  isError: false
---
send:
  python: retained, 'answer' in globals()
  session: alpha
result:
  content:
    - type: text
      text: |
        ('alpha', False)
  isError: false
---
send:
  session: beta
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [waiting for stdin]
  isError: false
---
send:
  stdin: |
    beta survived
  session: beta
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: retained, answer
  session: beta
result:
  content:
    - type: text
      text: |
        ('beta', 'beta survived')
  isError: false
