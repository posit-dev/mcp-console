---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: value = 'default state'
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: value = 'old state'
  session: alpha
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  session: alpha
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [stopped]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [session: "default"; status: idle]

        [idle]
  structuredContent:
    sessions:
      - session: default
        status: idle
  isError: false
---
send:
  session: alpha
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-

        [stopped]
  isError: false
---
send:
  python: value
result:
  content:
    - type: text
      text: |
        'default state'
  isError: false
---
send:
  python: |
    assert "value" not in globals()
    value = "new state"
    value
  session: alpha
result:
  content:
    - type: text
      text: |
        [starting new worker]
        'new state'
  isError: false
