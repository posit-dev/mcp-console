---
!same-as tests/snapshots/client_server/server/test_tools/initializes_and_lists_tools.direct.yaml
---
send:
  r: cancelled_cell_ran <- TRUE
id: <cancelled request 1>
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[worker evaluation is already being polled]"
  isError: true
---
send:
  r: stop('another cell must not execute')
  timeout_ms: 0
result:
  content:
    - type: text
      text: "[worker is already evaluating a cell; poll without a code field]"
  isError: true
---
input:
  method: notifications/cancelled
  params:
    requestId: <cancelled request 1>
---
input:
  method: ping
result: {}
---
send:
  timeout_ms: 250
result:
  content:
    - type: text
      text: |-

        [elapsed: <elapsed>s since admission; no new output; phase: startup]
        [running; poll with an empty send]
  isError: false
---
send:
  timeout_ms: 600000
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: exists("cancelled_cell_ran", inherits = FALSE)
result:
  content:
    - type: text
      text: |
        [1] TRUE
  isError: false
