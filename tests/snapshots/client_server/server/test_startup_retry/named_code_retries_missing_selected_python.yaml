---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: default_value = 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  session: alpha
  python: rejected_cell = True
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  session: alpha
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  session: alpha
  stdin: |
    rejected input
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  session: alpha
  python: |
    assert "rejected_cell" not in globals()
    answer = input("retry> ")
    print(answer)
  stdin: |
    accepted input
result:
  content:
    - type: text
      text: |
        [input requested: "retry> "]
        accepted input
  isError: false
---
send:
  python: default_value
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  session: beta
  python: rejected_cell = True
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  session: beta
  control: restart
result:
  content:
    - type: text
      text: |-

        [stopped]
  isError: false
---
send:
  session: beta
result:
  content:
    - type: text
      text: |-

        [stopped]
  isError: false
---
send:
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        [session: "alpha"; status: idle]

        [idle]
        [session: "default"; status: idle]

        [idle]
  structuredContent:
    sessions:
      - session: alpha
        status: idle
      - session: default
        status: idle
  isError: false
