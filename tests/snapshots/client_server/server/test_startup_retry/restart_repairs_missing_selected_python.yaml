---
!same-as python-only MCP initialization for this execution mode
---
send:
  python: rejected_cell = True
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  python: rejected_cell = True
result:
  content:
    - type: text
      text: >-
        selected Python executable is not an absolute file:
        <workspace>/selected-python
  isError: true
---
send:
  control: restart
  python: assert 'rejected_cell' not in globals(); answer = 42; answer
result:
  content:
    - type: text
      text: |-
        [runtime discovery retried]
        42
        [done]
  isError: false
---
send:
  python: answer + 1
result:
  content:
    - type: text
      text: |
        43
  isError: false
---
tools_schema_unchanged: true
---
send:
  python: |
    import os

    os.environ["RETICULATE_PYTHON"] = "/unavailable/python"
    os.environ["PATH"] = "/unavailable/tools"
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  python: assert 'answer' not in globals(); 42
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        42
        [done]
  isError: false
