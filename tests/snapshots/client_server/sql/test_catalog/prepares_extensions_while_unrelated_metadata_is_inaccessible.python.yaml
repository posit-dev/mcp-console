---
scenario: Prepare an extension through the python provider.
fixture: >-
  An unrelated installer metadata file remains unreadable while
  preparation runs.
---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    assert _console.sql_connection().execute("SELECT 42").fetchone() == (42,)
    print("connection retained")
result:
  content:
    - type: text
      text: |
        connection retained
  isError: false
---
send:
  requirements:
    duckdb:
      - core_functions
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: |
    assert _console.sql_connection().execute("SELECT 42").fetchone() == (42,)
    print("connection retained")
result:
  content:
    - type: text
      text: |
        connection retained
  isError: false
