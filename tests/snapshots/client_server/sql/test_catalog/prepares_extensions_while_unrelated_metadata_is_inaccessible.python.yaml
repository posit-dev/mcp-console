---
scenario: Prepare an extension through the python provider.
fixture: >-
  An unrelated installer metadata file remains unreadable while
  preparation runs.
---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    assert _console.sql_connection().execute("SELECT 42").fetchone() == (42,)
    print("connection retained")
result:
  content:
    - type: text
      text: |
        connection retained
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
