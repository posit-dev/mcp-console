---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    preview_library <- tempfile("sql-preview-library-")
    dir.create(preview_library)
    packages <- installed.packages()[, c("Package", "LibPath")]
    packages <- packages[
      !duplicated(packages[, "Package"]) & packages[, "Package"] != "arrow",
      ,
      drop = FALSE
    ]
    stopifnot(file.symlink(
      file.path(packages[, "LibPath"], packages[, "Package"]),
      file.path(preview_library, packages[, "Package"])
    ))
    .libPaths(preview_library, include.site = FALSE)
    stopifnot(
      !nzchar(system.file(package = "arrow")),
      !"arrow" %in% loadedNamespaces()
    )
    invisible(options(
      width = 20L,
      max.print = 1L,
      digits = 2L,
      scipen = -9L,
      OutDec = ",",
      cli.num_colors = 256L,
      cli.unicode = FALSE,
      pillar.advice = TRUE,
      pillar.bidi = TRUE,
      pillar.bold = TRUE,
      pillar.min_title_chars = 1000L,
      pillar.width = 20L,
      pillar.print_max = 1L,
      pillar.max_extra_cols = 0L,
      pillar.superdigit_sep = "XYZ",
      pillar.subtle = TRUE
    ))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: |
    SELECT
      CAST(NULL AS VARCHAR) AS missing,
      CAST('9223372036854775807' AS BIGINT) AS big,
      CAST(
        '12345678901234567890123456789.123456789'
        AS DECIMAL(38, 9)
      ) AS exact,
      CAST([1, NULL, 3] AS INTEGER[]) AS items,
      {'name': 'Ada', 'active': true} AS person
    FROM range(21)
