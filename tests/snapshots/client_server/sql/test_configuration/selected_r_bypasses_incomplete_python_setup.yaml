---
!same-as MCP initialization for this execution mode
---
send:
  r: Sys.setenv(RETICULATE_PYTHONPATH = "<startup modules>")
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    retained_pid <- Sys.getpid()
    native <- DBI::dbConnect(duckdb::duckdb(), dbdir = ":memory:")
    invisible(DBI::dbExecute(native, "CREATE TABLE selected AS SELECT 1 AS answer"))
    DBI::dbBegin(native)
    .console$sql_connection(native)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: never_run = True
result:
  content:
    - type: text
      text: |-
        [input requested: "Python SQL setup> "]
        [waiting for stdin]
  isError: false
---
send:
  control: interrupt
  timeout_ms: 0
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 949, in _mcp_console_configure_module_defaults
          File "<string>", line 907, in apply
          File "<SQL setup checkpoint>", line 16, in configuration_checkpoint
          File "<string>", line 50, in _console_input
        KeyboardInterrupt
  isError: false
---
send:
  sql: UPDATE selected SET answer = 43 RETURNING answer
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
           answer
          <int32>
        1      43
  isError: false
---
send:
  r: |
    stopifnot(
      Sys.getpid() == retained_pid,
      identical(.console$sql_connection(), native)
    )
    DBI::dbRollback(native)
    stopifnot(DBI::dbGetQuery(native, "SELECT answer FROM selected")[[1L]] == 1)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: assert "never_run" not in globals()
result:
  content:
    - type: text
      text: |
        Python setup resumed with same objects
  isError: false
