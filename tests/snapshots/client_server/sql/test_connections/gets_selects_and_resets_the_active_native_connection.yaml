---
!same-as MCP initialization for this execution mode
---
send:
  r: |
    managed <- .console$sql_connection()
    stopifnot(inherits(managed, "duckdb_connection"))
    stopifnot(!exists("sql_connection"), !exists("console_sql_connection"))
    invisible(DBI::dbExecute(
      managed,
      "CREATE TABLE retained AS SELECT 42 AS value"
    ))
    sqlite <- DBI::dbConnect(RSQLite::SQLite(), ":memory:")
    stopifnot(is.null(.console$sql_connection(connection = sqlite)))
    stopifnot(identical(.console$sql_connection(), sqlite))
    writeLines("selected native DBI identity")
  requirements:
    r:
      - RSQLite
result:
  content:
    - type: text
      text: |
        selected native DBI identity
  isError: false
---
send:
  sql: CREATE TABLE chosen AS SELECT 11 AS value
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    stopifnot(DBI::dbGetQuery(sqlite, "SELECT value FROM chosen")$value == 11)
    closed <- DBI::dbConnect(RSQLite::SQLite(), ":memory:")
    invisible(DBI::dbDisconnect(closed))
    message <- tryCatch(.console$sql_connection(closed), error = conditionMessage)
    stopifnot(identical(.console$sql_connection(), sqlite))
    writeLines(message)
result:
  content:
    - type: text
      text: |
        `connection` must be a valid DBIConnection or NULL
  isError: false
---
send:
  python: |
    import builtins
    import sqlite3

    assert "_console" not in globals()
    assert "sql_connection" not in vars(builtins)
    assert "console_sql_connection" not in vars(builtins)
    try:
        _console.sql_connection()
    except RuntimeError as error:
        print(error)
    selected = sqlite3.connect(":memory:")
    assert _console.sql_connection(connection=selected) is None
    assert _console.sql_connection() is selected
    _ = selected.execute("CREATE TABLE chosen AS SELECT 23 AS value")
result:
  content:
    - type: text
      text: >
        The active SQL connection belongs to R; use .console$sql_connection() in
        R
  isError: false
---
send:
  r: |
    writeLines(tryCatch(.console$sql_connection(), error = conditionMessage))
    stopifnot(DBI::dbIsValid(sqlite))
result:
  content:
    - type: text
      text: >
        The active SQL connection belongs to Python; use
        _console.sql_connection() in Python
  isError: false
---
send:
  sql: SELECT value FROM chosen
result:
  content:
    - type: text
      text: |
        value
        -----
        23
  isError: false
---
send:
  python: |
    try:
        _console.sql_connection(object())
    except TypeError as error:
        print(error)
    assert _console.sql_connection() is selected
    _ = _console.sql_last_result()
    selected.close()
result:
  content:
    - type: text
      text: |
        `connection` must provide a callable cursor() method or be None
  isError: false
---
send:
  sql: SELECT value FROM chosen
result:
  content:
    - type: text
      text: |
        Error: Cannot operate on a closed database.
  isError: false
---
send:
  python: |
    assert _console.sql_connection() is selected
    selected = sqlite3.connect(":memory:")
    selected.execute("CREATE TABLE still_open AS SELECT 7 AS value")
    _console.sql_connection(selected)
    assert _console.sql_connection(None) is None
    assert selected.execute("SELECT value FROM still_open").fetchone() == (7,)
    try:
        _console.sql_connection()
    except RuntimeError as error:
        print(error)
result:
  content:
    - type: text
      text: >
        The active SQL connection belongs to R; use .console$sql_connection() in
        R
  isError: false
---
send:
  r: |
    stopifnot(identical(.console$sql_connection(), managed))
    stopifnot(DBI::dbIsValid(sqlite))
    stopifnot(is.null(.console$sql_connection(sqlite)))
    stopifnot(
      DBI::dbGetQuery(
        .console$sql_connection(),
        "SELECT value FROM chosen"
      )$value ==
        11
    )
    stopifnot(is.null(.console$sql_connection(NULL)))
    stopifnot(identical(.console$sql_connection(), managed), DBI::dbIsValid(sqlite))
    writeLines("reset retained managed identity and user connection")
result:
  content:
    - type: text
      text: |
        reset retained managed identity and user connection
  isError: false
---
send:
  sql: SELECT value FROM retained
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            value
          <int32>
        1      42
  isError: false
---
send:
  python: _console.sql_connection(selected)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: .console$sql_connection(NULL)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: selected.execute('SELECT value FROM still_open').fetchone()
result:
  content:
    - type: text
      text: |
        (7,)
  isError: false
---
send:
  python: _console.sql_connection(selected)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  control: restart
  sql: SELECT value FROM retained
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        Error: Catalog Error: Table with name retained does not exist!
        Did you mean "pg_settings"?

        LINE 1: SELECT value FROM retained
                                  ^
        ℹ Context: rapi_prepare
        ℹ Error type: CATALOG
        [done]
  isError: false
---
send:
  r: >-
    stopifnot(inherits(.console$sql_connection(), "duckdb_connection"));
    writeLines("new managed generation")
result:
  content:
    - type: text
      text: |
        new managed generation
  isError: false
