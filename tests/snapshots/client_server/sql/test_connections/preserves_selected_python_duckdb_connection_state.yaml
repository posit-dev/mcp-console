---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import duckdb

    connection = duckdb.connect(":memory:")
    connection.execute("CREATE TEMP TABLE before_selection AS SELECT 41 AS value")
    _console.sql_connection(connection)
    del connection
  requirements:
    python:
      - duckdb==1.5.6
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  sql: SELECT value + 1 AS answer FROM before_selection
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  sql: CREATE TEMP TABLE later_state AS SELECT 'retained' AS value
result:
  content:
    - type: text
      text: |
        Count
        -----
        1
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
