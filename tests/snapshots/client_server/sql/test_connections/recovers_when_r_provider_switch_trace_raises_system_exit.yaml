---
!same-as MCP initialization for this execution mode
---
send:
  sql: CREATE TABLE managed_value AS SELECT 7 AS value
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    import _mcp_console_sql
    import sqlite3
    import sys


    connection = sqlite3.connect(":memory:")
    connection.execute("CREATE TABLE python_value AS SELECT 42 AS value")
    _console.sql_connection(connection)
    use_r_code = _mcp_console_sql.use_r.__code__


    def exit_use_r(frame, event, argument):
        if event == "call" and frame.f_code is use_r_code:
            raise SystemExit("R provider switch exit")
        return exit_use_r


    sys.settrace(exit_use_r)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: .console$sql_connection(NULL); invisible()
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 145, in use_r
          File "<mcp-console:python:e1>", line 14, in exit_use_r
        SystemExit: R provider switch exit
        Error: Python function `_mcp_console_sql.use_r` failed
  isError: false
---
send:
  python: connection.execute('SELECT value FROM python_value').fetchone()[0]
result:
  content:
    - type: text
      text: |
        42
  isError: false
---
send:
  sql: SELECT value FROM python_value
result:
  content:
    - type: text
      text: |
        value
        -----
        42
  isError: false
---
send:
  r: .console$sql_connection(NULL); invisible()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT value FROM managed_value
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
            value
          <int32>
        1       7
  isError: false
