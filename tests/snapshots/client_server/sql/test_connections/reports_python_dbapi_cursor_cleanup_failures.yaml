---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    class CleanupCursor:
        description = (("answer",),)

        def execute(self, source):
            if source == "ERROR":
                raise RuntimeError("selected DB-API execution failure")
            return self

        def fetchmany(self, size):
            return [(42,)][:size]

        def fetchall(self):
            return []

        def close(self):
            raise RuntimeError("selected DB-API cleanup failure")


    class CleanupConnection:
        def cursor(self):
            return CleanupCursor()


    _console.sql_connection(CleanupConnection())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: ANSWER
result:
  content:
    - type: text
      text: |
        answer
        ------
        42
  isError: false
---
send:
  python: _ = _console.sql_last_result()
result:
