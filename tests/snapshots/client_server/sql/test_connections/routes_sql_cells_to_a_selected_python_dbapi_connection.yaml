send:
  python: |
    class ControlValue:
        def __repr__(self):
            return "tab\tline\nreturn\rcontrol\x01" + "\t" * 80


    class ControlCursor:
        description = (("value",),)

        def execute(self, source):
            return self

        def fetchmany(self, size):
            return [(ControlValue(),)][:size]

        def close(self):
            pass


    class ControlConnection:
        def cursor(self):
            return ControlCursor()


    _console.sql_connection(ControlConnection())
result:
  content:
    - type: text
      text: "[done]"
  isError: false
