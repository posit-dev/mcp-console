---
!same-as MCP initialization for this execution mode
---
send: {}
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  requirements:
    action: get
  timeout_ms: 0
result:
  content:
    - type: text
      text: |-
        {
          "requirements": {
            "r": [],
            "python": [
              "numpy",
              "pandas",
              "matplotlib",
              "plotnine",
              "duckdb"
            ],
            "duckdb": [
              "icu",
              "json",
              "sqlite"
            ],
            "python_version": [],
            "exclude_newer": null
          },
          "prepared": true,
          "runtime_requirements": {
            "r": [],
            "python": []
          }
        }
  structuredContent:
    requirements:
      r: []
      python:
        - numpy
        - pandas
        - matplotlib
        - plotnine
        - duckdb
      duckdb:
        - icu
        - json
        - sqlite
      python_version: []
      exclude_newer: ~
    prepared: true
    runtime_requirements:
      r: []
      python: []
  isError: false
---
send:
  sql: SET autoinstall_known_extensions = false; SET TimeZone = 'UTC'
result:
  content:
    - type: text
      text: |
        Success
        -------
        [0 rows]
  isError: false
---
send:
  sql: ATTACH 'audit.sqlite' AS audit (TYPE sqlite, READ_ONLY)
result:
  content:
    - type: text
      text: |
        Success
        -------
        [0 rows]
  isError: false
---
send:
  sql: |
    SELECT
      CASE WHEN json_extract_string('{"answer":42}', '$.answer') = '42'
        THEN 1234567 ELSE 0 END AS json_ok,
      CASE WHEN CAST(
        timezone('America/New_York', TIMESTAMP '2020-01-01') AS VARCHAR
      ) = '2020-01-01 05:00:00+00'
        THEN 1234567 ELSE 0 END AS timezone_ok,
      CASE WHEN (SELECT payload->>'$.answer' FROM audit.events) = '42'
        THEN 1234567 ELSE 0 END AS sqlite_ok
result:
  content:
    - type: text
      text: |
        json_ok | timezone_ok | sqlite_ok
        --------+-------------+----------
        1234567 | 1234567     | 1234567
  isError: false
---
send:
  sql: INSERT INTO audit.events VALUES ('{}')
result:
  content:
    - type: text
      text: >
        Error: Invalid Input Error: Cannot execute statement of type "INSERT" on
        database "audit" which is attached in read-only mode!
  isError: false
---
send:
  sql: SELECT count(*) AS events FROM audit.events
result:
  content:
    - type: text
      text: |
        events
        ------
        1
  isError: false
