---
!same-as MCP initialization for this execution mode
---
send:
  requirements:
    r:
      - RSQLite
  r: |
    selected_r <- DBI::dbConnect(RSQLite::SQLite(), ":memory:")
    invisible(DBI::dbExecute(selected_r, "CREATE TABLE values_table (id INTEGER)"))
    DBI::dbBegin(selected_r)
    invisible(DBI::dbExecute(selected_r, "INSERT INTO values_table VALUES (42)"))
    .console$sql_connection(selected_r)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT id FROM values_table
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
               id
          <int32>
        1      42
  isError: false
---
send:
  python: |
    r = 42
    borrowed_r = _console.sql_connection()
    assert r == 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: stopifnot(identical(.console$sql_last_result()$id, 42L))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT id FROM values_table
result:
  content:
    - type: text
      text: |
        # A tibble: 1 × 1
               id
          <int32>
        1      42
  isError: false
---
send:
  python: |
    _console.sql_connection(borrowed_r)
    assert r == 42
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    message <- tryCatch(.console$sql_last_result(), error = conditionMessage)
    stopifnot(grepl("No retained", message, fixed = TRUE))
    DBI::dbRollback(selected_r)
    stopifnot(
      DBI::dbGetQuery(selected_r, "SELECT count(*) AS n FROM values_table")$n == 0
    )
    writeLines("bridged R selection discards results without committing")
result:
  content:
    - type: text
      text: |
        bridged R selection discards results without committing
  isError: false
---
send:
  python: |
    import sqlite3

    selected_python = sqlite3.connect(":memory:")
    selected_python.execute("CREATE TABLE values_table (id INTEGER)")
    selected_python.execute("INSERT INTO values_table VALUES (42)")
    _console.sql_connection(selected_python)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT id FROM values_table
result:
  content:
    - type: text
      text: |
        id
        --
        42
  isError: false
---
send:
  r: borrowed_python <- .console$sql_connection()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    assert _console.sql_last_result() == {"columns": ("id",), "rows":
    [(42,)]}
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT id FROM values_table
result:
  content:
    - type: text
      text: |
        id
        --
        42
  isError: false
---
send:
  r: .console$sql_connection(borrowed_python)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: |
    try:
        _console.sql_last_result()
    except RuntimeError as error:
        assert "No retained" in str(error)
    else:
        raise AssertionError("bridged selection retained unread rows")
    assert selected_python.in_transaction
    selected_python.rollback()
    assert selected_python.execute("SELECT count(*) FROM values_table").fetchone() == (0,)
    print("bridged Python selection discards results without committing")
result:
  content:
    - type: text
      text: |
        bridged Python selection discards results without committing
  isError: false
