    stopifnot(grepl("No retained", tryCatch(.console$sql_last_result(1L), error = conditionMessage)))
    stopifnot(metrics$clears == 3L, DBI::dbIsValid(sqlite))
    writeLines("interrupted DBI fetch closes its result")
