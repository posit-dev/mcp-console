send:
  python: |
    try:
        _console.sql_last_result()
    except RuntimeError:
        pass
    else:
        raise AssertionError("stale result survived failed SQL")
    assert previous["rows"] == [(i,) for i in range(5)]
    assert connection.in_transaction
    print("failed SQL invalidates the previous result")
