send:
  r: |
    message <- tryCatch(.console$sql_last_result(1L), error = conditionMessage)
    stopifnot(grepl("No retained", message))
    writeLines("Python selection invalidates R results")
result:
  content:
    - type: text
      text: |
        Python selection invalidates R results
  isError: false
---
send:
  python: |
    def select_again():
        _console.sql_connection(connection)
        return 41


    connection.create_function("select_again", 0, select_again)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT select_again() AS value
result:
  content:
    - type: text
      text: |
        value
        -----
        41
  isError: false
---
send:
  python: |
    try:
        _console.sql_last_result()
    except RuntimeError:
        pass
    else:
        raise AssertionError("selection during SQL retained a stale result")
    print("selection during execution does not retain a stale result")
result:
  content:
    - type: text
      text: |
        selection during execution does not retain a stale result
  isError: false
---
send:
  control: restart
  python: assert 'previous' not in globals()
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        [done]
  isError: false
---
send:
  python: |
    try:
        _console.sql_last_result()
    except RuntimeError as error:
        assert "No retained" in str(error)
    else:
        raise AssertionError("result survived restart")
    print("restart has no retained result")
result:
  content:
    - type: text
      text: |
        restart has no retained result
  isError: false
