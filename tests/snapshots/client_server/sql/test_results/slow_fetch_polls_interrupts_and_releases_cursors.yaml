---
!same-as MCP initialization for this execution mode
---
send:
  python: |
    import sqlite3


    class GatedCursor:
        def __init__(self):
            self.native = connection.native.cursor()
            self.calls = 0
            self.closed = False
            connection.latest = self

        def execute(self, source):
            self.native.execute(source)
            return self

        @property
        def description(self):
            return self.native.description

        def fetchmany(self, n):
            self.calls += 1
            if self.calls > 1:
                input("fetch> ")
            return self.native.fetchmany(n)

        def close(self):
            self.closed = True
            self.native.close()


    class GatedConnection:
        def __init__(self):
            self.native = sqlite3.connect(":memory:")

        def cursor(self):
            return GatedCursor()


    connection = GatedConnection()
    _console.sql_connection(connection)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
