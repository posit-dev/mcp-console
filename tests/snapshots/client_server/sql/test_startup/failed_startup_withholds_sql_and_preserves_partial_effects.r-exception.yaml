---
config:
  startup:
    language: r
    code: startup_count <- 1L; stop("startup failure")
---
!same-as MCP initialization for this execution mode
---
send:
  sql: CREATE TABLE never_run AS SELECT 99 AS answer
result:
  content:
    - type: text
      text: |
        Error: startup failure
        Error: configured startup did not complete; SQL withheld; explicit restart required
        Error: SQL unavailable: configured startup did not complete; explicit restart required
  isError: false
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: >
        Error: SQL unavailable: configured startup did not complete; explicit
        restart required
  isError: false
---
send:
  r: stopifnot(startup_count == 1L)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
language: r
failure: startup failure
first_sql: |
  Error: startup failure
  Error: configured startup did not complete; SQL withheld; explicit restart required
  Error: SQL unavailable: configured startup did not complete; explicit restart required
later_sql: >
  Error: SQL unavailable: configured startup did not complete; explicit
  restart required
