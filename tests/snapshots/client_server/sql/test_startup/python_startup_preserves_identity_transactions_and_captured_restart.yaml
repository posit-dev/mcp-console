  isError: false
---
send:
  python: |
    assert startup_count == 1 and id(native) == native_identity
    assert native.execute("SELECT answer FROM selected").fetchone() == (43,)
    native.rollback()
    assert native.execute("SELECT count(*) FROM selected").fetchone() == (0,)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
