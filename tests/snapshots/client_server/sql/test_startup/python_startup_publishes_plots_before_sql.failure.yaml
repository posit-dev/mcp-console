---
config:
  startup:
    language: python
    code: |-
      import os
      import sqlite3
      from pathlib import Path

      import matplotlib.pyplot as plt

      startup_count = globals().get("startup_count", 0) + 1
      native = sqlite3.connect(":memory:")
      _console.sql_connection(native)
      figure, axes = plt.subplots(figsize=(3, 2), dpi=100)
      _ = axes.plot([1, 2, 3], [3, 1, 2])
      figure.savefig(Path(os.environ["TMPDIR"]) / "startup.png", format="png")
      plt.show()

      raise RuntimeError('startup failed after plotting')
  python: <configured Python>
  cache: host
---
failed_startup: true
---
!same-as python-only MCP initialization for this execution mode
---
send:
  sql: SELECT 42 AS answer
  timeout_ms: 0
result:
  content:
    - type: image
      data: <PNG byte-identical to live startup savefig 1>
      mimeType: image/png
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 496, in initialize_connection
          File "<console startup>", line 15, in <module>
        RuntimeError: startup failed after plotting
        Error: configured startup did not complete; SQL withheld; explicit restart required
        Error: SQL unavailable: configured startup did not complete; explicit restart required
  isError: false
---
send:
  session: default
result:
  content:
    - type: text
      text: |-

        [idle]
  isError: false
---
send:
  python: assert startup_count == 1; assert not plt.get_fignums()
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: >
        Error: SQL unavailable: configured startup did not complete; explicit
        restart required
  isError: false
