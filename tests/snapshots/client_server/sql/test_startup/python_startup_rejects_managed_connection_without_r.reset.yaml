---
config:
  startup:
    language: python
    code: |-
      startup_count = 1
      _console.sql_connection(None)
---
!same-as MCP initialization for this execution mode
---
send:
  sql: CREATE TABLE never_run AS SELECT 99 AS answer
result:
  content:
    - type: text
      text: |
        Traceback (most recent call last):
          File "<string>", line 492, in initialize_connection
        RuntimeError: startup must select a native connection with _console.sql_connection(connection)
        Error: configured startup did not complete; SQL withheld; explicit restart required
        Error: SQL unavailable: configured startup did not complete; explicit restart required
  isError: false
---
send:
  python: |
    assert startup_count == 1
    assert _console.sql_connection().execute(
        "SELECT count(*) FROM information_schema.tables WHERE table_name = 'never_run'"
    ).fetchone() == (0,)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: >
        Error: SQL unavailable: configured startup did not complete; explicit
        restart required
  isError: false
