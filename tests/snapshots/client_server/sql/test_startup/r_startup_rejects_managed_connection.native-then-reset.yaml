---
config:
  startup:
    language: r
    code: |
      startup_count <- 1L
      native <- DBI::dbConnect(duckdb::duckdb())
      invisible(DBI::dbExecute(native, "CREATE TABLE selected AS SELECT 1 AS answer"))
      DBI::dbBegin(native)
      .console$sql_connection(native)
      invisible(DBI::dbExecute(native, "UPDATE selected SET answer = 42"))
      .console$sql_connection(NULL)
---
!same-as MCP initialization for this execution mode
---
send:
  sql: CREATE TABLE never_run AS SELECT 99 AS answer
result:
  content:
    - type: text
      text: |
        Error: startup must select a valid native connection with .console$sql_connection(connection)
        Error: configured startup did not complete; SQL withheld; explicit restart required
        Error: SQL unavailable: configured startup did not complete; explicit restart required
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: >-
    stopifnot(startup_count == 1L, !"never_run" %in%
    DBI::dbListTables(.console$sql_connection()))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  r: |
    stopifnot(DBI::dbIsValid(native))
    stopifnot(DBI::dbGetQuery(native, "SELECT answer FROM selected")[[1L]] == 42)
    DBI::dbRollback(native)
    stopifnot(DBI::dbGetQuery(native, "SELECT answer FROM selected")[[1L]] == 1)
    .console$sql_connection(native)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: >
        Error: SQL unavailable: configured startup did not complete; explicit
        restart required
  isError: false
  _meta:
    io.modelcontextprotocol/serverInfo:
      name: mcp-console
      title: MCP Console
      version: <Console version>
      description: >-
        An interactive workbench for agents working with data in R, Python, and
        SQL.
      websiteUrl: https://github.com/posit-dev/mcp-console
