---
config:
  startup:
    language: r
    code: |
      startup_count <- 1L
      native <- DBI::dbConnect(duckdb::duckdb())
      invisible(DBI::dbExecute(native, "CREATE TABLE selected AS SELECT 1 AS answer"))
      DBI::dbBegin(native)
      .console$sql_connection(native)
      invisible(DBI::dbExecute(native, "UPDATE selected SET answer = 42"))

      reticulate::py_run_string(paste(
        "import sqlite3",
        "py_native = sqlite3.connect(':memory:')",
        "_console.sql_connection(py_native)",
        sep = "\n"
      ))
---
!same-as MCP initialization for this execution mode
---
send:
  sql: SELECT answer FROM selected
result:
  content:
    - type: text
      text: |
        Error: startup must select a valid native connection with .console$sql_connection(connection)
        Error: configured startup did not complete; SQL withheld; explicit restart required
        Error: SQL unavailable: configured startup did not complete; explicit restart required
  isError: false
---
send:
  r: |
    stopifnot(startup_count == 1L, DBI::dbIsValid(native))
    stopifnot(DBI::dbGetQuery(native, "SELECT answer FROM selected")[[1L]] == 42)
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  r: |
    DBI::dbRollback(native)
    stopifnot(DBI::dbGetQuery(native, "SELECT answer FROM selected")[[1L]] == 1)
    .console$sql_connection(native)
    stopifnot(identical(.console$sql_connection(), native))
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  sql: SELECT 42 AS answer
result:
  content:
    - type: text
      text: >
        Error: SQL unavailable: configured startup did not complete; explicit
        restart required
  isError: false
