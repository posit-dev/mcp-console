---
send:
  control: restart
  sql: SET autoinstall_known_extensions = false; LOAD fts
result:
  content:
    - type: text
      text: |-
        [worker stopped: in-memory state lost]
        [starting new worker]
        Success
        -------
        [0 rows]
        [done]
  isError: false
---
send:
  python: import os; os._exit(47)
result:
  content:
