---
send:
  requirements:
    duckdb:
      - json
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  python: >-
    identity = object(); identity_id = id(identity); answer = input('answer>
    ')
result:
  content:
    - type: text
      text: |-
        [input requested: "answer> "]
        [waiting for stdin]
  isError: false
---
send:
  requirements:
    duckdb:
      - fts
  python: identity = None
result:
  content:
    - type: text
      text: >-
        worker is already evaluating a cell; poll it before preparing
        requirements
  isError: true
---
send:
  requirements:
    duckdb:
      - json
result:
  content:
    - type: text
      text: "[prepared]"
  isError: false
---
send:
  stdin: |
    kept
result:
  content:
    - type: text
      text: "[done]"
  isError: false
---
send:
  python: >-
    assert id(identity) == identity_id and answer == 'kept'; print('input
    retained')
result:
  content:
    - type: text
      text: |
        input retained
  isError: false
---
send:
  python: import pdb; pdb.set_trace(); print('debugger continued')
result:
  content:
    - type: text
      text: |-
        > <mcp-console:python:e3>(1)<module>()
        [input requested: "(Pdb) "]
        [waiting for stdin]
  isError: false
---
send:
  requirements:
    duckdb:
      - fts
result:
  content:
    - type: text
      text: >-
        worker is already evaluating a cell; poll it before preparing
        requirements
  isError: true
---
send:
  control: interrupt
  requirements:
    duckdb:
      - json
  python: identity = None
result:
  content:
    - type: text
      text: >-
        [Python requirements cannot accompany control: interrupt; prepare before
        first use or with control: restart]
  isError: true
---
send:
  stdin: |
    continue
result:
  content:
    - type: text
      text: |
        debugger continued
  isError: false
---
send:
  python: assert id(identity) == identity_id; print('still live')
result:
  content:
    - type: text
      text: |
        still live
  isError: false
