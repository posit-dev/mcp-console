relay:
  kind: evaluate
  language: python
  source: |
    import os

    with open(os.environ["MCP_CONSOLE_MITM_OUTPUT_GATE"], "rb", buffering=0) as output_gate:
        assert output_gate.read(1) == b"1"
    import os


    def write_all(file_descriptor, data):
        data = memoryview(data)
        while data:
            data = data[os.write(file_descriptor, data) :]


    write_all(1, b"x" * 4194304)
    write_all(2, b"y" * 4194304)
